    // 4. DRFからデータの読み込む（Django の API から取得する場合）
    const dataset = new dhx.DataCollection();
    fetch("/reference/data/")

        .then(data => {
            grid.data.parse(data.references); // data.references (配列部分) を渡す
        });

    // 3. Gridの初期化
    const grid = new dhx.Grid("grid_container", {
        columns: [
            { id: "id", header: [{ text: "ID" }], hidden: true },
            { id: "action", header: [{ text: "修正" }], align: "center", width: 80, htmlEnable: true,
                    template:() => "<button class='edit-btn'>修正</button>"
                },
            { id: "detail_name", header: [{ text: "明細名称" }], editable: true },
            {
                id: "calcu_cls",
                header: [{ text: "計算区分" }],
                editable: false,
                editorType: "select", // セレクトボックス形式
                options: [
                    { id: "0", value: "加算対象" },
                    { id: "1", value: "階層内集計（加算なし）" },
                    { id: "2", value: "税抜合計" },
                    { id: "3", value: "消費税" }
                ]
            },
            {
                id: "unit_name", // ForeignKeyのIDが入る
                header: [{ text: "予算単位" }],
                editable: false,
                editorType: "select",
                options: [] // 後でAPIから取得して流し込む
            },
            { id: "budget_price", header: [{ text: "予算単価" }], editable: true, type: "number" },
            { id: "unit_no", header: [{ text: "unit_no" }],  },
            { id: "unit_name", header: [{ text: "unit_name" }], },
            { id: "action", header: [{ text: "操作" }], align: "center", width: 80, htmlEnable: true,
                template:() => "<button class='edit-btn'>編集</button>"
            },
            { id: "delete", header: [{ text: "削除" }], align: "center",  width: 80, htmlEnable: true,

                }
        ],
        autoWidth: true,
        data: dataset, // 作成した DataCollection を直接紐付ける
        // 行単位の選択モードに変更
        //selection: "row",

    // 3. Unit一覧を取得してGridのプルダウンに反映
    fetch("/unit/units/")
        .then(res => res.json())
        .then(data => {
            const unitOptions = data.map(u => ({ id: u.id, value: u.unit_name }));
            // unit_name列のオプションを更新
            grid.getColumn("unit_name").options = unitOptions;
            grid.paint(); // 再描画
        });

    // 4. データ読み込み
    grid.data.load("/reference/references/");

            // 4.1 新規作成ボタン（HTML側に id="add-btn" がある想定）

                dhxWindow.header.data.update("title", { value: "編集"});
                dhxWindow.paint();

        });

        // 4. 追加処理(add)
        document.getElementById("add_btn").onclick = function() {
            // 一時的なIDを生成（dhtmlxの内部生成に任せるか、Date.now()などを使用）
            const tempId = null;

            const newRow = {
                id: tempId,
                detail_name: null, // 初期値
                calcu_cls: "",
                unit_name: "",
                budget_price: "",
                is_new: true // 新規フラグを付けておくと後で抽出が楽
            };

            //dataset.add(newRow);

            // 追加した行を表示・選択
            grid.showRow(tempId);
            grid.selection.setCell(tempId, "detail_name", "calcu_cls", "unit_name", "budget_price");
        };


        // 5. 削除処理
        document.getElementById("del_btn").onclick = function() {
            const selection = grid.selection.getCell();
            if (selection && selection.row) {
                const rowId = selection.row.id; // これがDjangoのpkになります

                if (confirm("選択した行を削除してもよろしいですか？")) {
                    // 1. サーバー側のデータを削除
                    fetch(`/reference/update/${rowId}`, {
                        method: 'DELETE',
                        headers: {
                            "Content-Type": "application/json",
                            'X-CSRFToken': getCookie('csrftoken') // DjangoのCSRF対策
                        }
                    }).then(response => {
                        if (response.ok) {
                            // 2. サーバー削除成功後、フロントエンド(Grid)から削除
                            dataset.remove(rowId);
                        } else {
                            alert("サーバーでの削除に失敗しました。");
                        }
                    }).catch(error => {
                        console.error('Error:', error);
                    });
                }
            } else {
                alert("削除する行を選択してください。");
            }
        };

        // 6. 一括保存ボタンのイベント
        document.getElementById("save_btn").onclick =
            async function saveAllChanges() {
                // グリッド上の全データを取得（追加分：u...、修正分：数値ID が混在）
                const allData = grid.data.serialize();

                if (allData.length === 0) return;

                try {
                    const response = await fetch("/reference/update/", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": getCookie("csrftoken")
                        },
                        body: JSON.stringify(allData)
                    });

                    const savedItems = await response.json();

                    if (response.ok) {
                        // サーバーから返ってきた確定データでグリッドを更新
                        // savedItems は必ず配列で返ってくる前提
                        savedItems.forEach((newItem) => {
                            // ここが重要：
                            // 新規なら一時ID(u...)をキーに数値IDへ置換
                            // 修正なら数値IDをキーに内容を最新化
                            // サーバー側で「元々の一時ID」を返してくれない場合は、
                            // unit_no など一意のキーでマッチングさせる工夫が必要です。

                            // シンプルな実装例（unit_no が一意の場合）
                            const row = grid.data.serialize().find(r => r.unit_no === newItem.unit_no);
                            if (row) {
                                grid.data.update(row.id, newItem);
                            }
                        });
                        alert("追加と修正の保存が完了しました");
                    }
                } catch (error) {
                    console.error("保存失敗:", error);
                }
            }
