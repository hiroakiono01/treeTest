<html lang="ja">
<head>
    {% load static %}
    {% csrf_token %}
    <!-- DHTMLX SuiteのJS/CSSを読み込み -->
    <script src="{% static 'suite/suite.js' %}"></script>
    <link rel="stylesheet" href="{% static 'suite/suite.css' %}">
    <!-- 共通ユーティリティ -->
    <script src="{% static 'js/utils.js' %}"></script>
    <link rel="stylesheet" href="{% static 'suite/myStyleSuite.css' %}">


</head>
<body>
<div id="controls" style="padding: 10px 10px 10px 0px; width: 70%; ">
</div>
<div id="toolbar_container"></div>
<div id="grid_container" style="width: 70%; height: 700px;"></div>
<script>
    // 1. --- ツールバーの処理 ---
    // 1.1 ツールバー設定（Unitの時と同じ構成）
    const toolbar = new dhx.Toolbar("toolbar_container", { css: "dhx_toolbar--bordered" });
    toolbar.data.add([
        { id: "add", type: "button", value: "新規追加", icon: "mi-plus", color: "primary" },
    ]);
    // 1.2. ツールバーのクリックイベント
    toolbar.events.on("click", function(id) {
        if (id === "add") {
            addRow(); // 前に作った関数を呼ぶ
        }
    })

    // 2. --- モーダルウインドウの準備 ---
    //  2.1 ウィンドウの準備
    const dhxWindow = new dhx.Window({
        width: 400,
        height: 700,
        title: "新規",
        modal: true
    });
    // 2.2 フォームの準備
    const form = new dhx.Form(null, {
        rows: [
            { type: "input", name: "id", hidden: true }, // 見えないが値は保持される
            {
                name: "detail_name",
                type: "input",
                label: "詳細",
                required: true,
                validation: "notEmpty", // 空でないことをチェック
                errorMassage: "項目名を入力してください。"
            },
            {
                name: "calcu_cls",
                type: "select", // Suite 9では type: "select"
                label: "計算の区分",
                required: true,
                options: [
                    { value: "0", content: "加算対象" },
                    { value: "1", content: "階層内集計（加算なし）" },
                    { value: "2", content: "税抜合計" },
                    { value: "3", content: "消費税" }
                ]
            },
            {
                name: "unit_name",
                type: "select",
                label: "単位",
                required: false,
                options: [
                    { value: "", content: "" },

                ]

            },
            {
                name: "unit_name_display",
                type: "input",
                label: "単位",
                required: false
            },
            {
                name: "budget_price",
                type: "input",
                label: "単価",
                required: false
            },
            {
                type: "button",
                name: "save",
                text: "保存",
                view: "flat",
                color: "primary"
            }
        ]
    });
    dhxWindow.attach(form);

    // 3. Unit一覧を取得してGridのプルダウンに反映
    fetch("/api/unit-options/")
        .then(res => res.json())
        .then(data => {
             console.log("取得データ:", data);
            form.getItem("unit_name").setOptions(data.units);
        })
        .catch(err => console.error("データ取得失敗:", err));

    // 4. DRFからデータの読み込む（Django の API から取得する場合）
    const dataset = new dhx.DataCollection();
    fetch("/reference/references/")
        .then(response => response.json())
        .then(data => {
            grid.data.parse(data); // data.reference (配列部分) を渡す
        });

    // 5. Gridの初期化
    const grid = new dhx.Grid("grid_container", {
        columns: [
            { id: "id", header: [{ text: "ID" }], hidden: false },
            { id: "action", header: [{ text: "修正" }], align: "center", width: 80, htmlEnable: true,
                    template:() => "<button class='edit-btn'>修正</button>"
                },
            { id: "detail_name", header: [{ text: "明細名称" }], editable: true },
            {
                id: "calcu_cls",
                header: [{ text: "計算区分" }],
                editable: false,
                editorType: "select", // セレクトボックス形式
                options: [
                    { id: "0", value: "加算対象" },
                    { id: "1", value: "階層内集計（加算なし）" },
                    { id: "2", value: "税抜合計" },
                    { id: "3", value: "消費税" }
                ]
            },
            {
                id: "unit_name_display", // ForeignKeyのIDが入る
                header: [{ text: "予算単位" }],
                editable: false,
            },
            { id: "budget_price", header: [{ text: "予算単価" }], editable: true, type: "number" },
            { id: "delete", header: [{ text: "削除" }], align: "center",  width: 80, htmlEnable: true,
                template: () => "<button class='delete-btn' >削除</button>"
                }
        ],
        autoWidth: true,
        data: dataset, // 作成した DataCollection を直接紐付ける
    });

    // 6. --- イベント制御 ---
    // 6.1 新規作成のウインドウを表示する
    function addRow() {
        if (form) {
            form.clear({});
            }
        dhxWindow.header.data.update("title", { value: "新規登録" });
        dhxWindow.setPosition(100, 50);
        dhxWindow.paint();
        dhxWindow.show();
        }

    // 6.2 グリッド内の「編集」ボタンクリック時
    grid.events.on("cellClick", (row, col) => {
        if (col.id === "action") {
            form.setValue(row); // 選択した行のデータをフォームにセット
            dhxWindow.header.data.update("title", { value: "編集"});
            dhxWindow.paint();
            dhxWindow.show();
        }
    });

    // 7. 保存ボタンの処理
    form.getItem("save").events.on("click", () => { // ボタン自身のイベントなら引数id判定は不要な場合が多いですが、一応残します

        // 1. まずバリデーションを実行
        if (!form.validate()) {
            // エラー時のカーソルセット
            const info = form.getInfo();
            const firstErrorId = Object.keys(info).find(itemId => info[itemId].error);
            if (firstErrorId) {
                form.getItem(firstErrorId).setFocus();
            }
            return; // ← 重要：ここで処理を終了させ、以降のfetchを実行させない
        }

        // 2. バリデーション成功後に値を取得
        const formData = form.getValue();
        console.log("送信データ:", formData);

        const isNew = !formData.id || formData.id === "";

        // 3. 新規(POST)か更新(PUT)の判定
        const url = isNew ? "/reference/references/" : `/reference/references/${formData.id}/`;
        const method = isNew ? "POST" : "PUT";

        // 4. 通信開始
        fetch(url, {
            method: method,
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCookie('csrftoken')
            },
            body: JSON.stringify(formData)
        })
        .then(res => {
            if (!res.ok) {
                // DRFのバリデーションエラー(400)などをキャッチ
                return res.json().then(err => { throw err; });
            }
            return res.json();
        })
        .then(result => {
            dhx.message({
                text: isNew ? "追加されました" : "更新されました",
                css: "dhx_widget--bg_success",
                expire: 3000
            });

            dhxWindow.hide();

            // グリッドの再読み込み
            grid.data.removeAll();
            // fetchの連鎖（async/awaitを使うともっと綺麗に書けます）
            return fetch("/reference/references/");
        })
        .then(res => res && res.json())
        .then(data => {
            if (data) grid.data.parse(data);
        })
        .catch(err => {
            console.error(err);
            // Django(DRF)のエラーは {"field_name": ["error message"]} の形式で来ることが多いです
            let msg = "エラーが発生しました";
            if (typeof err === 'object') {
                // 最初のエラー内容を抽出して表示
                const firstKey = Object.keys(err)[0];
                msg = Array.isArray(err[firstKey]) ? err[firstKey][0] : (err.detail || msg);
            }
            dhx.message({ text: msg, css: "dhx_widget--bg_danger" });
        });
    });



    // 8. 削除処理
    grid.events.on("cellClick", (row, col) => {
        if (col.id === "delete") {
            if (confirm("選択した行を削除してもよろしいですか？")) {
                // 1. サーバー側のデータを削除
                fetch(`/reference/references/${row.id}/`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken') // DjangoのCSRF対策
                    }
                })
                .then(res => {
                    if (res.ok) {
                        // 2. サーバー削除成功後、フロントエンド(Grid)から削除
                        grid.data.remove(row.id);
                        dhx.message({
                            text: "削除しました",
                            css: "dhx_widget--bg_success",
                            expire: 3000
                        });
                    } else {
                         dhx.message({
                            text: "削除に失敗しました",
                            css: "dhx_widget--bg_danger",
                            expire: -1
                           });
                    }
                })
                .catch(err => {
                    //console.error(err);
                    dhx.message({
                        text: "システムエラーが発生しました", css: "dhx_widget--bg_danger"
                    });
                });
            }
        }
    });

</script>
</body>
</html>
