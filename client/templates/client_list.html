{% extends 'base.html' %}
{% block head %}
<title>事業者　一覧表</title>
{% endblock %}

{% block header %}
<div class="my-div-style col-sm mx-auto text-center">
    <h5>事業者一覧表</h5>
</div>
{% endblock %}

{% block contents %}

<body>
    <div id="layout-main-container"></div>
    <script>
        // layoutの準備
        const layout = new dhx.Layout("layout-main-container", MySharedLayoutConfig);

        // TOOLBAR: ツールバーの処理 ---
        const toolbar = new dhx.Toolbar("toolbar_container", { css: "dhx_toolbar--bordered" });
        toolbar.data.add([
            { id: "add", type: "button", value: "新規追加", icon: "dxi dxi-plus", color: "primary", circle: true, },
        ]);
        toolbar.events.on("click", function (id) {
            if (id === "add") {
                addRow(); // 関数を呼ぶ
            }
        })


        //  FORM: モーダルウインドウの準備 ---
        const dhxWindow = new dhx.Window({
            width: 800,
            height: 600,
            title: "新規",
            modal: true
        });

        // 3. --- フォームの準備 ---
        const form = new dhx.Form(null, {

            rows: [
                {
                    cols: [
                        {
                            type: "input",
                            name: "id",
                            hidden: true
                            // 見えないが値は保持される
                        },
                        {
                            name: "client_no",
                            type: "input",
                            label: "事業者番号",
                            required: true,
                            width: "30%"
                        },
                        {
                            type: "spacer",
                            width: 40 // 横に40pxの間隔を開ける
                        },
                        {
                            name: "client_cls",
                            type: "radioGroup",
                            label: "事業者区分",
                            required: true,
                            options: {
                                cols: [
                                    { value: "1", text: "法人" },
                                    { value: "2", text: "個人" }
                                ]
                            },
                            width: "20%"
                        },
                    ]
                },
                {
                    cols: [
                        {
                            name: "client_name",
                            type: "input",
                            label: "事業者名称",
                            required: true,
                            width: "50%"
                        },
                        {
                            type: "spacer",
                            width: 40 // 横に40pxの間隔を開ける
                        },
                        {
                            name: "client_name_kana",
                            type: "input",
                            label: "事業者名称カナ",
                            required: false,
                            width: "50%"
                        },
                    ]
                },
                {
                    cols: [
                        {
                            name: "client_rep_name",
                            type: "input",
                            label: "代表者名称",
                            required: false,
                            width: "50%"
                        }
                    ]
                },
                {
                    cols: [
                        {
                            name: "client_zip_code",
                            type: "input",
                            label: "郵便番号",
                            required: false,
                            width: "20%"
                        },
                        {
                            type: "spacer",
                            width: 40 // 横に40pxの間隔を開ける
                        },
                        {
                            name: "client_address1",
                            type: "input",
                            label: "住所１",
                            required: false,
                            width: "40%"
                        },
                        {
                            type: "spacer",
                            width: 10 // 横に40pxの間隔を開ける
                        },
                        {
                            name: "client_address2",
                            type: "input",
                            label: "住所２",
                            required: false,
                            width: "40%"
                        },

                    ]
                },
                {
                    cols: [
                        {
                            name: "client_phone_no",
                            type: "input",
                            label: "電話番号",
                            required: false,
                            width: "20%"
                        },
                        {
                            type: "spacer",
                            width: 40 // 横に40pxの間隔を開ける
                        },
                        {
                            name: "client_fax_no",
                            type: "input",
                            label: "FAX",
                            required: false,
                            width: "20%"
                        },
                    ]
                },
                {
                    cols: [
                        {
                            type: "button",
                            name: "save",
                            text: "保存",
                            view: "flat",
                            color: "primary"
                        }
                    ]
                },
            ]
        });
        dhxWindow.attach(form);


        // CONNECT: DRFからデータの読み込み
        // 4.1 main dataの取得
        const dataset = new dhx.TreeCollection();
        fetch(`/client/clients/`)
            .then(response => response.json())
            .then(data => {
                grid.data.parse(data); // 配列部分を渡す
            })
            .catch(err => console.error("clientデータ取得失敗:", err));

        // GRID: dhx.Gridの初期化
        const grid = new dhx.Grid("grid_container", {
            columns: [
                {
                    id: "id",
                    header: [{ text: "ID" }],
                    hidden: true,
                },
                {
                    id: "client_no",
                    width: 100,
                    header: [{ text: "事業者番号", align: "center", rowspan: 2 }],
                    align: "center",
                    htmlEnable: true,
                },
                {
                    id: "client_name",
                    width: 400,
                    header: [{ text: "事業者名称", align: "center" }, { content: "inputFilter" }],
                    align: "center",
                    // editable: true
                },
                {
                    id: "client_cls",
                    editorType: "select",
                    header: [{ text: "事業者区分", align: "center" }, { content: "selectFilter" }],
                    // editable: false,label: "事業者区分",
                    required: true,
                    options: [
                        { id: "1", value: "法人" },
                        { id: "2", value: "個人" }
                    ],
                    width: 100
                },
                {
                    id: "action",
                    width: 80,
                    header: [{ text: "修正", align: "center", rowspan: 2 }],
                    align: "center",
                    htmlEnable: true,
                    template: () => "<button class='dxi dxi-pencil'>修正</button>"
                },
                {
                    id: "delete",
                    width: 80,
                    header: [{ text: "削除", align: "center", rowspan: 2 }],
                    align: "center",
                    htmlEnable: true,
                    template: () => "<button class='dxi dxi-delete' >削除</button>"
                }
            ],
            autoWidth: true,
            //rootParent: null
            data: dataset, // 作成した DataCollection を直接紐付ける
        });

        // 💡 修正した「grid_cell」にGridをアタッチ
        layout.getCell("grid_cell").attach(grid);

        // --- ページネーション ---
        const pagination = new dhx.Pagination(null, {
            css: "dhx_widget--bordered dhx_widget--no-border_top",
            data: grid.data,
            pageSize: 50
        });

        // 💡 修正した「pagination_cell」にPaginationをアタッチ
        layout.getCell("pagination_cell").attach(pagination);

        //Grid.data.pase(dataset); // 作成した DataCollection を直接紐付ける


        // 6. --- イベントの処理 ---
        // 6.1 新規作成のウインドウを表示する
        function addRow() {
            if (form) {
                form.clear({});
            }
            dhxWindow.header.data.update("title", { value: "新規登録" });
            dhxWindow.setPosition(100, 50);
            dhxWindow.paint();
            dhxWindow.show();
        }
        // 6.2 グリッド内の「編集」ボタンクリック時
        grid.events.on("cellClick", (row, col) => {
            if (col.id === "action") {
                form.setValue(row); // 選択した行のデータをフォームにセット
                dhxWindow.header.data.update("title", { value: "編集" });
                dhxWindow.paint();
                dhxWindow.show();
            }
        });


        // 6.3. 保存ボタンの処理
        // UPDATE: 6.3. 保存ボタンの処理
        form.getItem("save").events.on("click", () => {

            // 6.3.1 バリデーションを実行
            if (!form.validate()) {
                const info = form.getInfo();
                const firstErrorId = Object.keys(info).find(itemId => info[itemId].error);
                if (firstErrorId) {
                    form.getItem(firstErrorId).setFocus();
                }
                return;
            }

            // 6.3.2. バリデーション成功後に値を取得
            const formData = form.getValue();
            console.log("送信データ:", formData);

            const isNew = !formData.id || formData.id === "";


            // 💡 6.3.3. 新規と更新で「URL」と「HTTPメソッド」を正しく切り替える
            const url = isNew ? `/client/clients/` : `/client/clients/${formData.id}/`;
            const method = isNew ? "POST" : "PUT"; // 新規時はPOST、更新時はPUT


            // 6.3.4. 通信開始
            fetch(url, {
                method: method,
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie('csrftoken')
                },
                body: JSON.stringify(formData)
            })

                .then(res => {
                    if (!res.ok) {
                        // DRFのバリデーションエラー(400)などをキャッチ
                        return res.json().then(err => { throw err; });
                    }
                    return res.json();
                })
                .then(result => {

                    // 💡 成功メッセージの表示
                    dhx.message({
                        text: isNew ? "追加されました" : "更新されました",
                        css: "dhx_widget--bg_success",
                        expire: 3000
                    });

                    dhxWindow.hide();

                    // 💡 グリッドの再読み込み（async/awaitでスッキリ並列・直列処理）
                    grid.data.removeAll();
                    return fetch("/client/clients/");
                })

                .then(res => res && res.json())
                .then(data => {
                    if (data) grid.data.parse(data);
                })
                .catch(err => {
                    console.error(err);
                    // Django(DRF)のエラーは {"field_name": ["error message"]} の形式で来ることが多いです
                    let msg = "エラーが発生しました";
                    if (typeof err === 'object') {
                        // 最初のエラー内容を抽出して表示
                        const firstKey = Object.keys(err)[0];
                        msg = Array.isArray(err[firstKey]) ? err[firstKey][0] : (err.detail || msg);
                    }
                    dhx.message({ text: msg, css: "dhx_widget--bg_danger" });
                });

        });


        // DELETE: 削除ボタンの即時実行
        grid.events.on("cellClick", (row, col) => {
            if (col.id === "delete") {
                if (confirm("選択した行を削除してもよろしいですか？")) {
                    // 6.4.1. サーバー側のデータを削除
                    fetch(`/client/clients/${row.id}/`, {
                        method: 'DELETE',
                        headers: {
                            'X-CSRFToken': getCookie('csrftoken') // DjangoのCSRF対策
                        }
                    })
                        .then(res => {
                            if (res.ok) {
                                // 6.4.2. サーバー削除成功後、フロントエンド(Grid)から削除
                                grid.data.remove(row.id);
                                dhx.message({
                                    text: "削除しました",
                                    css: "dhx_widget--bg_success",
                                    expire: 3000
                                });
                            } else {
                                dhx.message({
                                    text: "削除に失敗しました",
                                    css: "dhx_widget--bg_danger",
                                    expire: -1
                                });
                            }
                        })
                        .catch(err => {
                            //console.error(err);
                            dhx.message({
                                text: "システムエラーが発生しました", css: "dhx_widget--bg_danger"
                            });
                        });
                }
            }
        });
    </script>
</body>

{% endblock %}
