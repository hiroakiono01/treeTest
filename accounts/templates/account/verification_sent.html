{% extends 'base.html' %}
{% block title %}Verify Your E-mail Address | ecoDocuments{% endblock %}
{% block contents %}
<div class="container">
    <div class="row">
        <div class="col-4">
        </div>
        <div class="col-4">
            <div class="my-div-style">
                <div>
                    <h3>メールアドレスを確認してください</h3>
                    <div class="mt-5">
                        <p>確認のメールを送信しました。</p>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
