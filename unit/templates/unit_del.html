{% extends "base.html" %}
{% load static %}

{% block title %}単位の削除{% endblock title %}

{% block active_unit_del %}active{% endblock %}

{% block contents %}
<div class="container">
    <div class="row">
        <div class="my-div-style w-50">
            <form method="POST">
                {% csrf_token %}
                <p>本当に削除しますか？</p>
                <div class="d-flex flex-row">
                    <button class="btn btn-danger btn-sm mx-2"  type="submit">削除</button>
                    <a href="{% url 'unit:unit_edit' user.pk%}" class="btn btn-secondary btn-sm mx-2">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
