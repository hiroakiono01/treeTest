{% extends 'base.html' %}
{% block head %}
<title>Unit list</title>


{% endblock %}

{% block header %}
<div class="my-div-style col-sm mx-auto text-center">
    <h5>Unit List</h5>
</div>
{% endblock %}

{% block contents %}

<body>
    <div id="layout-main-container"></div>
    <script>
        // ===================================================
        //  1. VARIABLES （変数の宣言とデータの準備）
        // ===================================================

        const layout = new dhx.Layout("layout-main-container", MySharedLayoutConfig);
        let grid = null;
        let form = null;
        let toolbar = null;
        let pagination = null;
        let dhxWindow = null;
        const dataset = new dhx.DataCollection();


        // ===================================================
        // 2. INITIALIZE UI COMPONENTS （画面パーツの組み立て）
        // ===================================================



        // TOOLBAR 2.1 ツールバーの作成
        toolbar = new dhx.Toolbar("toolbar_container", { css: "dhx_toolbar--bordered" });
        toolbar.data.add([
            { id: "add", type: "button", value: "新規追加", icon: "dxi dxi-plus", color: "primary", circle: true, },
            { type: "spacer" },
            { id: "resetGrid", type: "button", value: "リセット", icon: "dxi dxi-undo", color: "secondary", circle: true, },
            { id: "update", type: "button", value: "更新", icon: "dxi dxi-vault", color: "success", circle: true, }
        ]);



        // GRID 2.2 dhx.Gridの作成
        grid = new dhx.Grid(null, {
            columns: [
                { id: "id", header: [{ text: "ID" }], hidden: true },
                {
                    id: "unit_no", width: 200,
                    header: [{ text: "表示順 <span style='color:red'>*</span>", align: "center", rowspan: 2 },], htmlEnable: true, // 赤くするため必要
                    type: "number",
                    keyNavigation: true,
                    editable: true
                },
                {
                    id: "unit_name",
                    width: 200,
                    header: [
                        { text: "単位 <span style='color:red'>*</span>", align: "center" },
                        { content: "inputFilter" }
                    ],
                    htmlEnable: true,
                    keyNavigation: true,
                    editable: true
                },
                { id: "delete", header: [{ text: "削除", align: "center", rowspan: 2 }], align: "center", width: 80, htmlEnable: true, template: () => "<button class='dxi dxi-delete' >削除</button>" }
            ],
            autoWidth: false,
            //data: dataset, // 作成した DataCollection を直接紐付ける
            //selection: "row",
            editing: true,
            keyNavigation: true // ★必ずtrueに設定してください
        });

        // ONECLICK: 2.3 ワンクリックで入力ができる ---　
        grid.events.on("cellClick", function (row, column) {
            grid.editCell(row.id, column.id);
        });

        // レイアウトの「grid_cell」にGridをアタッチ
        layout.getCell("grid_cell").attach(grid);


        // PAGINATION: 2.3 ページネーション ---
        pagination = new dhx.Pagination(null, {
            css: "dhx_widget--bordered dhx_widget--no-border_top",
            data: grid.data,
            pageSize: 50
        });
        //「pagination_cell」にPaginationをアタッチ
        layout.getCell("pagination_cell").attach(pagination);


        // ===================================================
        // 3. DATA LOADING （データ通信・サーバーとのやり取り）
        // ===================================================


        // CONNECT: 3.1 DRFからデータの読み込み

        fetch("/unit/units/")
            .then(response => response.json())
            .then(data => {
                grid.data.parse(data); // data.units (配列部分) を渡す
            })
            .catch(err => console.error("unitデータ取得失敗:", err));

        // ===================================================
        // 4. USER EVENTS （ボタン操作・イベントリスナー）
        // ===================================================

        // 4.1 toolbar
        toolbar.events.on("click", function (id) {
            if (id === "add") {
                addRow();
            }
            if (id === "update") {
                updateAll();
            }
            if (id === "resetGrid") {
                resetGrid();
            }
        })


        // BUTTON_ADD_ROW: 4.2  -- 新規ボタンを押した時の振る舞い ---
        function addRow() {

            const newRowData = {
            };
            const newRow = grid.data.add(newRowData, 0); // 第2引数に「0」を指定して、グリッドの先頭に追加
            // 追加した行へフォーカス
            if (newRow) {
                grid.editCell(newRow, "unit_no");
            }
        }



        // RESET: 4.3 リセット処理 ---
        function resetGrid() {
            // 1. サーバーから最新のデータを取得
            fetch("/unit/units/")
                .then(res => {
                    if (!res.ok) {
                        throw new Error(`サーバーレスポンス異常: ${res.status}`);
                    }
                    return res.json();
                })
                .then(result => {
                    // 2. 新データを入れる直前に、古いデータをクリア
                    grid.data.removeAll();
                    // 3. 新しいデータをGridに反映
                    grid.data.parse(result);
                    // 実行前の赤枠をすべてクリアする
                    const requiredFields = ["unit_no", "unit_name"];
                    grid.data.forEach(row => {
                        requiredFields.forEach(field => {
                            grid.removeCellCss(row.id, field, "required-error");
                        });
                    });
                    dhx.message({
                        text: "リセットしました",
                        status: "success",
                        expire: 3000
                    });
                })
                .catch(err => {
                    // ユーザーに「更新には失敗したが、表示は古いデータのままであること」を伝える
                    if (typeof dhx !== "undefined" && dhx.message) {
                        dhx.message({
                            text: "最新データの取得に失敗しました。直前のデータを表示しています。",
                            css: "dhx_widget--bg_error", // Suite 9 の標準エラー背景
                            expire: 5000
                        });
                    }
                });
        }


        //UPDATE:  4.4 保存ボタンで一括更新処理 ---
        function updateAll() {

            const rowsToRemove = [];
            let hasError = false;
            let mainMessage = "";
            const requiredFields = ["unit_no", "unit_name"];// 必須の項目


            grid.data.serialize().forEach(row => {

                // 実行前に前回のサーバーエラー赤枠をすべてクリアする
                requiredFields.forEach(field => {
                    grid.removeCellCss(row.id, field, "required-error");
                });
            });



            // フロントエンドでunito_noの二重登録のチェック
            const unitNoMap = {};
            const unitNameMap = {};
            grid.data.forEach(row => {
                // フロントエンドの必須入力チェック
                requiredFields.forEach(field => {
                    const value = row[field];
                    if (value === null || value === undefined || String(value).trim() === "") {
                        grid.addCellCss(row.id, field, "required-error");
                        mainMessage = "必須項目を入力してください。";
                        hasError = true;
                    }
                });

                // すでに同じunit_noが存在する場合、両方の行に赤枠を付与
                const unitNo = String(row.unit_no || "").trim();
                if (unitNo !== "") {
                    if (unitNoMap[unitNo]) {

                        grid.addCellCss(row.id, "unit_no", "required-error");
                        grid.addCellCss(unitNoMap[unitNo], "unit_no", "required-error");
                        mainMessage = "番号が重複しています。";
                        hasError = true;
                    } else {
                        unitNoMap[unitNo] = row.id; // 行IDを記憶
                    }
                }
                // すでに同じunit_Nameが存在する場合、両方の行に赤枠を付与
                const unitName = String(row.unit_name || "").trim();
                if (unitName !== "") {
                    if (unitNameMap[unitName]) {
                        grid.addCellCss(row.id, "unit_name", "required-error");
                        grid.addCellCss(unitNameMap[unitName], "unit_name", "required-error");
                        mainMessage = "名称が重複しています。";
                        hasError = true;
                    } else {
                        unitNameMap[unitName] = row.id; // 行IDを記憶
                    }
                }
            });
            // エラーを表示する
            if (hasError) {
                dhx.message({
                    text: mainMessage,
                    expire: 3000,
                    css: "dhx_widget--bg_danger",
                });
                return; // 中断で抜ける
            }

            // チェックが終了したら更新作業に移行する
            const allData = grid.data.serialize(); // gridの全データを取得

            fetch("/unit/bulk_sync/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie('csrftoken')
                },
                body: JSON.stringify(allData)
            })
                .then(response => {
                    if (!response.ok) {
                        const contentType = response.headers.get("content-type");
                        if (contentType && contentType.includes("application/json")) {
                            return response.json().then(errData => { throw errData; });
                        } else {
                            throw new Error(`サーバーエラーが発生しました (${response.status})`);
                        }
                    }
                    return response.json();
                })
                .then(result => {
                    dhx.message({
                        text: "更新しました。",
                        expire: 3000,
                        css: "dhx_widget--bg_success",
                    });
                    // グリッドを強制的に再描画する
                    fetch("/unit/units/")
                        .then(response => response.json())
                        .then(data => {
                            grid.data.parse(data); // data.units (配列部分) を渡す
                        })
                        .catch(err => console.error("unitデータ取得失敗:", err));

                })
                .catch(err => {
                    // エラーハンドラや .catch(err => { ... }) の中
                    const responseData = err.response ? err.response.data : null;

                    if (responseData && responseData.row_errors) {
                        const rowErrors = responseData.row_errors; // サーバーから届いた行ごとのエラーオブジェクト
                        let firstErrorMessage = "";

                        // グリッドの全データをループ
                        grid.data.forEach(row => {
                            // この行（row.id）に対するエラーがサーバーから返ってきているか確認
                            if (rowErrors[row.id]) {
                                const errorFields = rowErrors[row.id];

                                // 1. unit_name の重複エラーがある場合
                                if (errorFields.unit_name) {
                                    grid.addCellCss(row.id, "unit_name", "required-error");
                                    if (!firstErrorMessage) firstErrorMessage = errorFields.unit_name;
                                }

                                // 2. unit_no の重複エラーがある場合
                                if (errorFields.unit_no) {
                                    grid.addCellCss(row.id, "unit_no", "required-error");
                                    if (!firstErrorMessage) firstErrorMessage = errorFields.unit_no;
                                }
                            }
                        });

                        // 画面のメインメッセージ（トーストやアラートなど）に、最初のカスタムメッセージを表示する
                        if (firstErrorMessage) {
                            mainMessage = firstErrorMessage;
                            // 例: alert(mainMessage); や UIライブラリの通知関数を呼ぶ
                        }
                    }
                }
                )
        };



        // DELETE: 4.6 削除ボタンの即時実行
        grid.events.on("cellClick", (row, col) => {
            if (col.id === "delete") {
                if (confirm("削除しますか？")) {
                    if (String(row.id).startsWith('u')) {
                        grid.data.remove(row.id);
                    } else {
                        // サーバーへ削除リクエスト
                        fetch(`/unit/units/${row.id}/`, {
                            method: 'DELETE',
                            headers: {
                                'X-CSRFToken': getCookie('csrftoken')  // ここを追加
                            },
                            // body: JSON.stringify(sendingData)
                        })
                            .then(res => {
                                if (!res.ok) {
                                    return res.json().then(err => { throw err; });
                                }
                                return res.json();
                            })
                            .then(result => {
                                grid.data.remove(row.id);
                                dhx.message({
                                    text: "削除しました",
                                    css: "dhx_widget--bg_success",
                                    expire: 3000
                                });
                            })
                            .catch(err => {
                                const errorMsg = err.detail || err.message || "削除に失敗しました";
                                if (typeof grid.editEnd === "function") {
                                    grid.editEnd();
                                }
                                dhx.message({
                                    text: errorMsg,
                                    css: "dhx_message--error",  // 赤いトースト
                                    icon: "dxi dxi-delete-forever",
                                    expire: 6000
                                });

                            });
                    }
                }
            }
        });

    </script>
</body>

{% endblock %}
