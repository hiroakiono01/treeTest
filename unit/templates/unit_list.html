<html lang="ja">

<head>
    {% load static %}
    {% csrf_token %}
    <!-- DHTMLX SuiteのJS/CSSを読み込み -->
    <script src="{% static 'suite/suite.js' %}"></script>
    <link rel="stylesheet" href="{% static 'suite/suite.css' %}">

    <!-- 共通ユーティリティ -->
    <script src="{% static 'js/utils.js' %}"></script>
    <link rel="stylesheet" href="{% static 'suite/myStyle.css' %}">
</head>

<body>
    <div id="toolbar_container"></div>
    <div id="grid_container"></div>
    <style>
        #toolbar_container {
            place-content: center;
            width: 800px;
        }

        /* Gridのサイズを指定 */
        #grid_container {
            width: 800px;
            max-width: 1000px;
            /* 💡 修正：画面の高さ（100vh）からヘッダーなどの高さ（例：150px）を引く */
            height: calc(100vh - 150px);
            min-height: 100px;
            /* 浮き出し効果 */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
    <script>
        // --- ツールバーの処理 ---
        const toolbar = new dhx.Toolbar("toolbar_container", { css: "dhx_toolbar--bordered" });
        toolbar.data.add([
            { id: "add", type: "button", value: "新規追加", icon: "dxi dxi-plus", color: "primary", circle: true, },
            { type: "spacer" },
            { id: "reset", type: "button", value: "リセット", icon: "dxi dxi-undo", color: "secondary", circle: true, },
            { id: "update", type: "button", value: "更新", icon: "dxi dxi-vault", color: "success", circle: true, }
        ]);
        toolbar.events.on("click", function (id) {
            if (id === "add") {
                addRow();
            }
            if (id === "update") {
                updateAll();
            }
            if (id === "reset") {
                resetGrid();
            }
        })



        // --- DRFからMainデータの読み込み
        const dataset = new dhx.DataCollection();
        fetch("/unit/units/")
            .then(response => response.json())
            .then(data => {
                grid.data.parse(data); // data.units (配列部分) を渡す
            })
            .catch(err => console.error("unitデータ取得失敗:", err));

        // --- Gridの初期化 ---
        const grid = new dhx.Grid("grid_container", {
            columns: [
                {
                    id: "id",
                    header: [{ text: "ID" }],
                    hidden: true
                },
                {
                    id: "unit_no",
                    header: [
                        { text: "表示順 <span style='color:red'>*</span>", align: "center" },
                    ],
                    htmlEnable: true, // 赤くするため必要
                    //editable: true
                },
                {
                    id: "unit_name",
                    header: [
                        { text: "単位 <span style='color:red'>*</span>", align: "center" },
                        { content: "inputFilter" }
                    ],
                    htmlEnable: true,
                    //editable: true
                },
                {
                    id: "delete",
                    header: [{ text: "削除", align: "center" }],
                    align: "center",
                    width: 80,
                    htmlEnable: true,
                    template: () => "<button class='dxi dxi-delete' >削除</button>"
                }
            ],
            autoWidth: true,
            data: dataset, // 作成した DataCollection を直接紐付ける
            //keyNavigation: true,
            editing: true,
            //dragMode: "both", // ドラッグ＆ドロップを有効にする
            //selection: "row",
        });

        // --- ページネーション ---
        const pagination = new dhx.Pagination("pagination", {
            css: "dhx_widget--bordered dhx_widget--no-border_top",
            data: grid.data,
            pageSize: 50
        });

        // --- ワンクリックで入力ができる ---　
        grid.events.on("cellClick", function (row, column) {
            grid.editCell(row.id, column.id);
        });

        // -- 新規ボタンを押した時の振る舞い ---
        function addRow() {
            const newRowData = {};
            const newRow = grid.data.add(newRowData, 0); // 第2引数に「0」を指定して、グリッドの先頭に追加
            // 追加した行へフォーカス
            if (newRow) {
                grid.editCell(newRow, "unit_no");
            }
        }

        // --- リセット処理 ---
        function resetGrid() {
            // 1. サーバーから最新のデータを再取得
            fetch("/unit/units/") // 👈 初期読み込み時と同じAPIのURLを指定してください
                .then(res => res.json())
                .then(result => {
                    grid.data.removeAll();// 現在のGridデータをすべてクリア
                    grid.data.parse(result);// 3. 取得したデータを再読み込み
                })
                .catch(err => {
                    console.error("リセット失敗:", err);
                    dhx.message({ text: "データの再取得に失敗しました", status: "error" });
                });
        }

        // --- 保存ボタンで一括更新処理 ---
        function updateAll() {
            let hasError = false;
            let mainMessage = "";
            const requiredFields = ["unit_no", "unit_name"];

            // 実行前に前回のサーバーエラー赤枠をすべてクリアする
            grid.data.forEach(row => {
                requiredFields.forEach(field => {
                    grid.removeCellCss(row.id, field, "required-error");
                });
            });

            // フロントエンドの必須入力チェック
            grid.data.forEach(row => {
                requiredFields.forEach(field => {
                    const value = row[field];
                    if (value === null || value === undefined || String(value).trim() === "") {
                        grid.addCellCss(row.id, field, "required-error");
                        mainMessage = "必須項目を入力してください。";
                        hasError = true;
                    }
                });
            });

            // フロントエンドでunito_noの二重登録のチェック
            const unitNoMap = {};
            grid.data.forEach(row => {
                const unitNo = String(row.unit_no || "").trim();
                if (unitNo !== "") {
                    if (unitNoMap[unitNo]) {
                        // すでに同じunit_noが存在する場合、両方の行に赤枠を付与
                        grid.addCellCss(row.id, "unit_no", "required-error");
                        grid.addCellCss(unitNoMap[unitNo], "unit_no", "required-error");
                        mainMessage = "番号が重複しています。";
                        hasError = true;
                    } else {
                        unitNoMap[unitNo] = row.id; // 行IDを記憶
                    }
                }
            });

            // フロントエンドでunit_nameの二重登録のチェック
            const unitNameMap = {};
            grid.data.forEach(row => {
                const unitName = String(row.unit_name || "").trim();
                if (unitName !== "") {
                    if (unitNameMap[unitName]) {
                        // すでに同じunit_Nameが存在する場合、両方の行に赤枠を付与
                        grid.addCellCss(row.id, "unit_name", "required-error");
                        grid.addCellCss(unitNameMap[unitName], "unit_name", "required-error");
                        mainMessage = "名称が重複しています。";
                        hasError = true;
                    } else {
                        unitNameMap[unitName] = row.id; // 行IDを記憶
                    }
                }
            });

            // エラーを表示する
            if (hasError) {
                dhx.message({
                    text: mainMessage,
                    expire: 3000,
                    css: "dhx_widget--bg_danger",
                });
                return; // 中断
            }

            // チェックが終了したら更新作業に移行する

            const allData = grid.data.serialize(); // gridの全データを取得

            fetch("/unit/bulk_sync/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie('csrftoken')
                },
                body: JSON.stringify(allData)
            })
                .then(response => {
                    if (!response.ok) {
                        const contentType = response.headers.get("content-type");
                        if (contentType && contentType.includes("application/json")) {
                            return response.json().then(errData => { throw errData; });
                        } else {
                            throw new Error(`サーバーエラーが発生しました (${response.status})`);
                        }
                    }
                    return response.json();
                })
                .then(result => {
                    dhx.message({
                        text: "更新しました。",
                        expire: 3000,
                        css: "dhx_widget--bg_success",
                    });
                })
                .catch(err => {
                    // エラーハンドラや .catch(err => { ... }) の中
                    const responseData = err.response ? err.response.data : null;

                    if (responseData && responseData.row_errors) {
                        const rowErrors = responseData.row_errors; // サーバーから届いた行ごとのエラーオブジェクト
                        let firstErrorMessage = "";

                        // グリッドの全データをループ
                        grid.data.forEach(row => {
                            // この行（row.id）に対するエラーがサーバーから返ってきているか確認
                            if (rowErrors[row.id]) {
                                const errorFields = rowErrors[row.id];

                                // 1. unit_name の重複エラーがある場合
                                if (errorFields.unit_name) {
                                    grid.addCellCss(row.id, "unit_name", "required-error");
                                    if (!firstErrorMessage) firstErrorMessage = errorFields.unit_name;
                                }

                                // 2. unit_no の重複エラーがある場合
                                if (errorFields.unit_no) {
                                    grid.addCellCss(row.id, "unit_no", "required-error");
                                    if (!firstErrorMessage) firstErrorMessage = errorFields.unit_no;
                                }
                            }
                        });

                        // 画面のメインメッセージ（トーストやアラートなど）に、最初のカスタムメッセージを表示する
                        if (firstErrorMessage) {
                            mainMessage = firstErrorMessage;
                            // 例: alert(mainMessage); や UIライブラリの通知関数を呼ぶ
                        }
                    }
                }
                )
        };



        // --- 削除ボタンの即時実行 ---
        grid.events.on("cellClick", (row, col) => {
            if (col.id === "delete") {
                if (confirm("削除しますか？")) {
                    // サーバーへ削除リクエスト
                    fetch(`/unit/units/${row.id}/`, {
                        method: 'DELETE',
                        headers: {
                            'X-CSRFToken': getCookie('csrftoken')  // ここを追加
                        },
                        // body: JSON.stringify(sendingData)
                    })
                        .then(res => {
                            if (!res.ok) {
                                return res.json().then(err => { throw err; });
                            }
                            return res.json();
                        })
                        .then(result => {
                            grid.data.remove(row.id);
                            dhx.message({
                                text: "削除しました",
                                css: "dhx_widget--bg_success",
                                expire: 3000
                            });
                        })
                        .catch(err => {
                            const errorMsg = err.detail || err.message || "削除に失敗しました";
                            dhx.message({
                                text: errorMsg,
                                css: "dhx_widget--bg_danger", // 赤いトースト
                                expire: 6000
                            });
                        });
                }
            }
        });

        // --- 
        // grid.events.on("afterEditEnd", (value, row, col) => {
        //     // 必須にしたいカラムIDを指定（例: unit_display）
        //     if (col.id === "unit_name") {
        //         if (!value || value.trim() === "") {
        //             // 空ならエラークラスを適用
        //             grid.addCellCss(row.id, col.id, "required-error");
        //         } else {
        //             // 入力されていればエラークラスを削除
        //             grid.removeCellCss(row.id, col.id, "required-error");
        //         }
        //     }
        // });


    </script>
</body>

</html>
