{% extends 'base.html' %}
{% block head %}
<title>Unit list</title>

<style>
    /* 画面全体にレイアウトを広げるための設定 */
    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    /* 💡 全体の中央寄せと最大幅の制限は、最外枠のコンテナに対して行う */
    #layout-main-container {
        width: 100%;
        max-width: 1000px;
        height: 100vh;
        margin: 0 auto;
        box-shadow: 0 4px 5px rgba(0, 0, 0, 0.1);
        /* 浮き出し効果 */
    }

    /* 必要に応じて各セルの背景色などを指定 */
    .layout-header {
        background-color: #879eba;
    }

    .layout-content {
        background-color: #ffffff;
    }

    .layout-footer {
        background-color: #1a1a1a;
        /* 💡 深みのある黒を指定 */
        color: #ffffff;
        /* 💡 文字色を白に指定 */
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        letter-spacing: 0.5px;
        /* 必要に応じて文字間隔を調整 */
    }
</style>
{% endblock %}

{% block header %}
<div class="my-div-style col-sm mx-auto text-center">
    <h5>Unit List</h5>
</div>
{% endblock %}

{% block contents %}

<body>
    <div id="layout-main-container"></div>
    <script>
        // 1. レイアウトの定義 (Suite 9 準拠)
        // 第一引数には、HTML上のコンテナ要素のIDを指定します。
        const layout = new dhx.Layout("layout-main-container", {
            type: "line",
            rows: [
                {
                    id: "toolbar_container", // Menuを配置するヘッダーセル
                    height: "60px",
                    css: "layout-header"
                },
                {
                    // 💡 構文エラーを修正：rows直下にはオブジェクトを配置し、その中にcolsを定義します
                    id: "main_content_row",
                    cols: [
                        {
                            // 💡 変更点：メインセルの中に、さらにrowsを定義して上下に分割する
                            id: "grid_and_page_container",
                            rows: [
                                {
                                    id: "grid_cell" // 上側：Grid用のセル（高さは自動で引き伸ばされる）
                                },
                                {
                                    id: "pagination_cell", // 下側：Pagination用のセル
                                    height: "60px" // Paginationが収まる高さを指定
                                }
                            ],
                            css: "layout-content"
                        }
                    ]
                },
                {
                    id: "footer_cell",  // フッターセル
                    html: "Copyright &copy; kag holdings inc 2025",
                    height: "30px",
                    css: "layout-footer"
                }
            ]
        });



        // TOOLBAR: ツールバーの処理 ---
        const toolbar = new dhx.Toolbar("toolbar_container", { css: "dhx_toolbar--bordered" });
        toolbar.data.add([
            { id: "add", type: "button", value: "新規追加", icon: "dxi dxi-plus", color: "primary", circle: true, },
            { type: "spacer" },
            { id: "resetGrid", type: "button", value: "リセット", icon: "dxi dxi-undo", color: "secondary", circle: true, },
            { id: "update", type: "button", value: "更新", icon: "dxi dxi-vault", color: "success", circle: true, }
        ]);
        toolbar.events.on("click", function (id) {
            if (id === "add") {
                addRow();
            }
            if (id === "update") {
                updateAll();
            }
            if (id === "resetGrid") {
                resetGrid();
            }
        })


        // CONNECT:DRFからデータの読み込み
        const dataset = new dhx.DataCollection();
        fetch("/unit/units/")
            .then(response => response.json())
            .then(data => {
                grid.data.parse(data); // data.units (配列部分) を渡す
            })
            .catch(err => console.error("unitデータ取得失敗:", err));

        // GRID: dhx.Gridの初期化
        const grid = new dhx.Grid(null, {
            columns: [
                {
                    id: "id",
                    header: [{ text: "ID" }],
                    hidden: true
                },
                {
                    id: "unit_no",
                    width: 200,
                    header: [
                        { text: "表示順 <span style='color:red'>*</span>", align: "center", rowspan: 2 },
                    ],
                    htmlEnable: true, // 赤くするため必要
                    type: "number",
                    keyNavigation: true,
                    editable: true
                },
                {
                    id: "unit_name",
                    width: 200,
                    header: [
                        { text: "単位 <span style='color:red'>*</span>", align: "center" },
                        { content: "inputFilter" }
                    ],
                    htmlEnable: true,
                    keyNavigation: true,
                    editable: true
                },
                {
                    id: "delete",
                    header: [{ text: "削除", align: "center", rowspan: 2 }],
                    align: "center",
                    width: 80,

                    htmlEnable: true,
                    template: () => "<button class='dxi dxi-delete' >削除</button>"
                }
            ],
            autoWidth: false,
            data: dataset, // 作成した DataCollection を直接紐付ける
            //keyNavigation: true,

            // dragMode: "both", // ドラッグ＆ドロップを有効にする
            // selection: "row",
            selection: "cell",
            editing: true,
            // keyNavigation: false // ★必ずtrueに設定してください

        });


        // ATTACH: grid_cell」にGridをアタッチ
        layout.getCell("grid_cell").attach(grid);


        // PAGINATION: ページネーション ---
        const pagination = new dhx.Pagination(null, {
            css: "dhx_widget--bordered dhx_widget--no-border_top",
            data: grid.data,
            pageSize: 50
        });

        // ATTACH: 「pagination_cell」にPaginationをアタッチ
        layout.getCell("pagination_cell").attach(pagination);

        // ONECLICK: ワンクリックで入力ができる ---　
        // TODO: ワンクリックにならない
        grid.events.on("cellClick", function (row, column) {
            grid.editCell(row.id, column.id);
        });


        // AUTO_ADD_ROW: 自動で行を追加しする　この行は何も入力がないときは一括更新で削除
        const AUTO_ADDED_FLAG = "_isAutoAdded"; // 自動追加フラグ

        grid.events.on("afterEditEnd", (value, row, column) => {
            // 新規行（IDが 'u' から始まる）かつ、指定の最終列（unit_name）の編集が終わった場合
            if (column.id === "unit_name" && String(row.id).startsWith('u')) {
                // if (row[AUTO_ADDED_FLAG] === true) {
                // 1. 現在の行のインデックス（上から何番目か）を取得
                const currentIndex = grid.data.getIndex(row.id);
                // 2. 次の行のインデックスを計算（現在の位置 + 1）
                const nextIndex = currentIndex + 1;
                // 新しい行の一意のIDを生成
                const newRowId = "u" + Date.now();
                // 新しい行のデータオブジェクト
                const newRowData = {
                    id: newRowId,
                    unit_no: "",
                    unit_name: "",
                    [AUTO_ADDED_FLAG]: true
                }
                // 3. 第2引数に nextIndex を指定して、すぐ真下に挿入する
                grid.data.add(newRowData, nextIndex);
                // 画面を再描画
                grid.paint();
                // 4. 追加した「すぐ下の行」の最初のセル（unit_no）にフォーカスを移動して編集状態にする
                setTimeout(() => {
                    grid.selection.setCell(newRowId, "unit_no");
                    grid.editCell(newRowId, "unit_no");
                }, 50);
            }
        });




        // BUTTON_ADD_ROW: -- 新規ボタンを押した時の振る舞い ---
        function addRow() {
            const newRowData = {};
            const newRow = grid.data.add(newRowData, 0); // 第2引数に「0」を指定して、グリッドの先頭に追加
            // 追加した行へフォーカス
            if (newRow) {
                grid.editCell(newRow, "unit_no");
            }
        }

        // RESET: リセット処理 ---
        function resetGrid() {
            // 1. サーバーから最新のデータを再取得
            fetch("/unit/units/") // 👈 初期読み込み時と同じAPIのURLを指定してください
                .then(res => res.json())
                .then(result => {
                    grid.data.removeAll();// 現在のGridデータをすべてクリア
                    grid.data.parse(result);// 3. 取得したデータを再読み込み
                })
                .catch(err => {
                    console.error("リセット失敗:", err);
                    dhx.message({ text: "データの再取得に失敗しました", status: "error" });
                });
        }

        //UPDATE: 保存ボタンで一括更新処理 ---
        function updateAll() {
            // 自動追加された行のうち、何も入力されていない行を抽出して削除
            const rowsToRemove = [];
            let hasError = false;
            let mainMessage = "";
            const requiredFields = ["unit_no", "unit_name"];


            grid.data.serialize().forEach(row => {
                // 実行前に前回のサーバーエラー赤枠をすべてクリアする
                requiredFields.forEach(field => {
                    grid.removeCellCss(row.id, field, "required-error");
                });

                // 【判定の修正】IDが文字列であり、かつ 'u_' から始まっている行を自動追加行とみなす

                if (row[AUTO_ADDED_FLAG] === true) {
                    console.log("row[AUTO_ADDED_FLAG]", row[AUTO_ADDED_FLAG])
                    // IDプロパティ以外に、何か文字が入力されているかチェック
                    const hasInput = requiredFields.some(key => {
                        const value = row[key];

                        // 値が存在し、かつトリムした結果が空文字ではない場合「入力あり」と判定
                        return value !== undefined && value !== null && String(value).trim() !== "";
                    });
                    // 何も入力されていなければ削除対象リスト（配列）に追加
                    if (!hasInput) {
                        rowsToRemove.push(row.id);
                    }
                    //console.log("rowsToRemove", row.id, rowsToRemove.length)
                }
                //console.log("rowsToRemove", rowsToRemove.length)
                if (rowsToRemove.length > 0) {
                    rowsToRemove.forEach(id => {
                        grid.data.remove(id);
                    });
                    // 3. グリッドの描画を強制的に更新して画面から消し去る ★最重要
                    grid.paint();
                }
            });

            // フロントエンドの必須入力チェック
            grid.data.forEach(row => {
                requiredFields.forEach(field => {
                    const value = row[field];
                    if (value === null || value === undefined || String(value).trim() === "") {
                        grid.addCellCss(row.id, field, "required-error");
                        mainMessage = "必須項目を入力してください。";
                        hasError = true;
                    }
                });
            });

            // フロントエンドでunito_noの二重登録のチェック
            const unitNoMap = {};
            grid.data.forEach(row => {
                const unitNo = String(row.unit_no || "").trim();
                if (unitNo !== "") {
                    if (unitNoMap[unitNo]) {
                        // すでに同じunit_noが存在する場合、両方の行に赤枠を付与
                        grid.addCellCss(row.id, "unit_no", "required-error");
                        grid.addCellCss(unitNoMap[unitNo], "unit_no", "required-error");
                        mainMessage = "番号が重複しています。";
                        hasError = true;
                    } else {
                        unitNoMap[unitNo] = row.id; // 行IDを記憶
                    }
                }
            });

            // フロントエンドでunit_nameの二重登録のチェック
            const unitNameMap = {};
            grid.data.forEach(row => {
                const unitName = String(row.unit_name || "").trim();
                if (unitName !== "") {
                    if (unitNameMap[unitName]) {
                        // すでに同じunit_Nameが存在する場合、両方の行に赤枠を付与
                        grid.addCellCss(row.id, "unit_name", "required-error");
                        grid.addCellCss(unitNameMap[unitName], "unit_name", "required-error");
                        mainMessage = "名称が重複しています。";
                        hasError = true;
                    } else {
                        unitNameMap[unitName] = row.id; // 行IDを記憶
                    }
                }
            });

            // エラーを表示する

            if (hasError) {
                dhx.message({
                    text: mainMessage,
                    expire: 3000,
                    css: "dhx_widget--bg_danger",
                });
                return; // 中断
            }

            // チェックが終了したら更新作業に移行する
            console.log("hasError", hasError)
            const allData = grid.data.serialize(); // gridの全データを取得

            fetch("/unit/bulk_sync/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie('csrftoken')
                },
                body: JSON.stringify(allData)
            })
                .then(response => {
                    if (!response.ok) {
                        const contentType = response.headers.get("content-type");
                        if (contentType && contentType.includes("application/json")) {
                            return response.json().then(errData => { throw errData; });
                        } else {
                            throw new Error(`サーバーエラーが発生しました (${response.status})`);
                        }
                    }
                    return response.json();
                })
                .then(result => {
                    dhx.message({
                        text: "更新しました。",
                        expire: 3000,
                        css: "dhx_widget--bg_success",
                    });
                    // グリッドを強制的に再描画する
                    fetch("/unit/units/")
                        .then(response => response.json())
                        .then(data => {
                            grid.data.parse(data); // data.units (配列部分) を渡す
                        })
                        .catch(err => console.error("unitデータ取得失敗:", err));
                })
                .catch(err => {
                    // エラーハンドラや .catch(err => { ... }) の中
                    const responseData = err.response ? err.response.data : null;

                    if (responseData && responseData.row_errors) {
                        const rowErrors = responseData.row_errors; // サーバーから届いた行ごとのエラーオブジェクト
                        let firstErrorMessage = "";

                        // グリッドの全データをループ
                        grid.data.forEach(row => {
                            // この行（row.id）に対するエラーがサーバーから返ってきているか確認
                            if (rowErrors[row.id]) {
                                const errorFields = rowErrors[row.id];

                                // 1. unit_name の重複エラーがある場合
                                if (errorFields.unit_name) {
                                    grid.addCellCss(row.id, "unit_name", "required-error");
                                    if (!firstErrorMessage) firstErrorMessage = errorFields.unit_name;
                                }

                                // 2. unit_no の重複エラーがある場合
                                if (errorFields.unit_no) {
                                    grid.addCellCss(row.id, "unit_no", "required-error");
                                    if (!firstErrorMessage) firstErrorMessage = errorFields.unit_no;
                                }
                            }
                        });

                        // 画面のメインメッセージ（トーストやアラートなど）に、最初のカスタムメッセージを表示する
                        if (firstErrorMessage) {
                            mainMessage = firstErrorMessage;
                            // 例: alert(mainMessage); や UIライブラリの通知関数を呼ぶ
                        }
                    }
                }
                )
        };



        // DELETE: 削除ボタンの即時実行
        grid.events.on("cellClick", (row, col) => {
            if (col.id === "delete") {
                if (confirm("削除しますか？")) {
                    if (String(row.id).startsWith('u')) {
                        grid.data.remove(row.id);
                    } else {
                        // サーバーへ削除リクエスト
                        fetch(`/unit/units/${row.id}/`, {
                            method: 'DELETE',
                            headers: {
                                'X-CSRFToken': getCookie('csrftoken')  // ここを追加
                            },
                            // body: JSON.stringify(sendingData)
                        })
                            .then(res => {
                                if (!res.ok) {
                                    return res.json().then(err => { throw err; });
                                }
                                return res.json();
                            })
                            .then(result => {
                                grid.data.remove(row.id);
                                dhx.message({
                                    text: "削除しました",
                                    css: "dhx_widget--bg_success",
                                    expire: 3000
                                });
                            })
                            .catch(err => {
                                const errorMsg = err.detail || err.message || "削除に失敗しました";
                                if (typeof grid.editEnd === "function") {
                                    grid.editEnd();
                                }
                                dhx.message({
                                    text: errorMsg,
                                    css: "dhx_message--error",  // 赤いトースト
                                    icon: "dxi dxi-delete-forever",
                                    expire: 6000
                                });

                            });
                    }
                }
            }
        });

        // TODO:リターンキーで移動
        // 2. エディタ内とGrid全体のEnterキーを制御するイベント
        // grid.events.on("beforeKeyDown", function (e) {
        //     if (e.key === "Enter") {
        //         // 現在アクティブなセル情報を取得
        //         const cell = grid.selection.getCell();
        //         if (!cell || !cell.row || !cell.column) return;

        //         // DHTMLX標準のEnterキー挙動（真下への移動など）を完全に停止
        //         e.preventDefault();
        //         e.stopPropagation();

        //         const currentRowId = cell.row.id;
        //         const currentColumnId = cell.column.id;

        //         // 有効な ID を持つ列オブジェクトを抽出
        //         const validColumns = grid.config.columns.filter(col => col && typeof col.id === "string");
        //         const currentColIndex = validColumns.findIndex(col => col.id === currentColumnId);

        //         let nextRowId = currentRowId;
        //         let nextColumnId = null;

        //         // 1. 右隣に列がある場合は右へ移動
        //         if (currentColIndex > -1 && currentColIndex < validColumns.length - 1) {
        //             nextColumnId = validColumns[currentColIndex + 1].id;
        //         }
        //         // 2. 最後の列だった場合は、次の行の最初の列へ折り返し
        //         else {
        //             nextRowId = grid.data.getNextId(currentRowId);
        //             if (nextRowId && validColumns.length > 0) {
        //                 nextColumnId = validColumns[0].id;
        //             }
        //         }

        //         // 移動先セル情報が揃っている場合のみ実行
        //         if (nextRowId && nextColumnId) {
        //             // 現在の入力を確定してエディタを確実に閉じる
        //             grid.editEnd();

        //             // セルを先に切り替える
        //             grid.selection.setCell(nextRowId, nextColumnId);

        //             const targetRow = nextRowId;
        //             const targetCol = nextColumnId;

        //             // 【最重要】新規行の描画完了をしっかり待ってからスクロールと編集を起動
        //             dhx.awaitRedraw().then(() => {
        //                 try {
        //                     // ★公式仕様通り、第一引数が「行ID」、第二引数が「列ID」で実行

        //                     // スクロール直後に次のセルを編集モードに突入させる
        //                     grid.editCell(targetRow, targetCol);

    </script>
</body>

{% endblock %}
