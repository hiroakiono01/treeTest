<html lang="ja">

<head>
    {% load static %}
    {% csrf_token %}
    <!-- DHTMLX SuiteのJS/CSSを読み込み -->
    <script src="{% static 'suite/suite.js' %}"></script>
    <link rel="stylesheet" href="{% static 'suite/suite.css' %}">

    <!-- 共通ユーティリティ -->
    <script src="{% static 'js/utils.js' %}"></script>
    <link rel="stylesheet" href="{% static 'suite/myStyle.css' %}">
</head>

<body>
    <div id="toolbar_container"></div>
    <div id="grid_container"></div>
    <style>
        #toolbar_container {
            place-content: center;
            width: 800px;
        }

        /* Gridのサイズを指定 */
        #grid_container {
            width: 800px;
            max-width: 1000px;
            /* 💡 修正：画面の高さ（100vh）からヘッダーなどの高さ（例：150px）を引く */
            height: calc(100vh - 150px);
            min-height: 100px;
            /* 浮き出し効果 */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
    <script>
        // --- ツールバーの処理 ---
        const toolbar = new dhx.Toolbar("toolbar_container", { css: "dhx_toolbar--bordered" });
        toolbar.data.add([
            { id: "add", type: "button", value: "新規追加", icon: "dxi dxi-plus", color: "primary", circle: true, },
            { type: "spacer" },
            { id: "reset", type: "button", value: "リセット", icon: "dxi dxi-undo", color: "secondary", circle: true, },
            { id: "update", type: "button", value: "更新", icon: "dxi dxi-vault", color: "success", circle: true, }
        ]);
        toolbar.events.on("click", function (id) {
            if (id === "add") {
                addRow();
            }
            if (id === "update") {
                updateAll();
            }
            if (id === "reset") {
                resetGrid();
            }
        })



        // DRFからデータの読み込む（Django の API から取得する場合）
        const dataset = new dhx.DataCollection();
        fetch("/unit/units/")
            .then(response => response.json())
            .then(data => {
                grid.data.parse(data); // data.units (配列部分) を渡す
            })
            .catch(err => console.error("unitデータ取得失敗:", err));

        // Gridの初期化
        const grid = new dhx.Grid("grid_container", {
            columns: [
                { id: "id", header: [{ text: "ID" }], hidden: true },
                {
                    id: "unit_no",
                    header: [
                        { text: "表示順 <span style='color:red'>*</span>", align: "center" },
                    ],
                    htmlEnable: true,
                    editable: true
                },
                {
                    id: "unit_name",
                    header: [
                        { text: "単位 <span style='color:red'>*</span>", align: "center" },
                        { content: "inputFilter" }
                    ],
                    htmlEnable: true,
                    editable: true
                },
                {
                    id: "delete",
                    header: [{ text: "削除", align: "center" }],
                    align: "center",
                    width: 80,
                    htmlEnable: true,
                    template: () => "<button class='dxi dxi-delete' >削除</button>"
                }
            ],
            autoWidth: true,
            data: dataset, // 作成した DataCollection を直接紐付ける
            //keyNavigation: true,
            editing: true,
            //dragMode: "both", // ドラッグ＆ドロップを有効にする
            selection: "row",
        });

        // ページネーション
        const pagination = new dhx.Pagination("pagination", {
            css: "dhx_widget--bordered dhx_widget--no-border_top",
            data: grid.data,
            pageSize: 50
        });

        // ワンクリックで入力ができる　
        grid.events.on("cellClick", function (row, column) {
            grid.editCell(row.id, column.id);
        });

        // -- 新規登録処理 ---
        function addRow() {
            // 1. 新しい行のデータを定義（空オブジェクトでも自動で一意のIDが生成されます）
            const newRowData = {
                unit_name: "", // 必須項目の初期値を空文字にしておく
                // 必要に応じて他のフィールドも定義
            };

            // 2. 第2引数に「0」を指定して、グリッドの先頭（インデックス0）に追加
            const newRow = grid.data.add(newRowData, 0); // 戻り値で追加された行オブジェクトが取得できます
            // grid.selection.setCell(newRowId, "unit_name");
            console.log("追加された行のID:", newRow);

            // 3. 追加した行へフォーカス
            if (newRow) {
                grid.editCell(newRow, "unit_no");
            }
        }

        // --- リセット処理 ---
        function resetGrid() {
            // ユーザーに確認（キャンセルされたら処理を中断）
            // if (!confirm("編集中の内容を破棄して、元の状態に戻しますか？")) return;

            // 1. サーバーから最新のデータを再取得
            fetch("/unit/units/") // 👈 初期読み込み時と同じAPIのURLを指定してください
                .then(res => res.json())
                .then(result => {
                    // 2. 現在のGridデータをすべてクリア
                    grid.data.removeAll();

                    // 3. 取得したデータを再読み込み
                    grid.data.parse(result);

                    // 💡 必須チェック等で付いたエラーの赤枠CSSも自動で消えます

                    // dhx.message({ text: "変更をリセットしました", expire: 2000 });
                })
                .catch(err => {
                    console.error("リセット失敗:", err);
                    dhx.message({ text: "データの再取得に失敗しました", status: "error" });
                });
        }



        // --- 保存ボタンで一括更新処理 ---
        function updateAll() {
            let hasError = false;
            const requiredFields = ["unit_no", "unit_name"];

            // 1. 実行前に前回のサーバーエラー赤枠をすべてクリアする
            grid.data.forEach(row => {
                requiredFields.forEach(field => {
                    grid.removeCellCss(row.id, field, "required-error");
                });
            });

            // 2. フロントエンドの必須入力チェック
            grid.data.forEach(row => {
                requiredFields.forEach(field => {
                    const value = row[field];
                    if (value === null || value === undefined || String(value).trim() === "") {
                        grid.addCellCss(row.id, field, "required-error");
                        hasError = true;
                    }
                });
            });

            if (hasError) {
                dhx.message({
                    text: "必須項目を入力してください。rr",
                    expire: 3000,
                    css: "dhx_widget--bg_danger",
                });
                return; // 中断
            }

            // 3. データ送信
            const allData = grid.data.serialize();

            fetch("/unit/bulk_sync/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie('csrftoken')
                },
                body: JSON.stringify(allData)
            })
                .then(response => {
                    if (!response.ok) {
                        const contentType = response.headers.get("content-type");
                        if (contentType && contentType.includes("application/json")) {
                            return response.json().then(errData => { throw errData; });
                        } else {
                            throw new Error(`サーバーエラーが発生しました (${response.status})`);
                        }
                    }
                    return response.json();
                })
                .then(result => {
                    dhx.message({
                        text: "データの更新が完了しました。",
                        expire: 3000,
                        css: "dhx_widget--bg_success",
                    });
                })
                .catch(err => {
                    console.error("Error details:", err);
                    let mainMessage = "入力内容を確認してください。";

                    if (typeof err === "object" && err !== null) {
                        // パターンA: サーバーから [ { id: "u177...", unit_name: ["..."] } ] の配列型エラーが返る場合
                        if (Array.isArray(err)) {
                            let firstErrorMessage = "";

                            err.forEach(errorRow => {
                                if (errorRow && errorRow.id) {
                                    const rowId = errorRow.id;
                                    Object.keys(errorRow).forEach(field => {
                                        if (field !== "id") {
                                            // 該当する行・セルに赤枠クラスを付与
                                            grid.addCellCss(rowId, field, "required-error");
                                            // トーストに表示する最初の１つ目のエラー文言を記憶
                                            if (!firstErrorMessage && Array.isArray(errorRow[field])) {
                                                firstErrorMessage = errorRow[field][0];
                                            }
                                        }
                                    });
                                }
                            });
                            if (firstErrorMessage) {
                                mainMessage = firstErrorMessage;
                            }
                        }
                        // パターンB: 単一オブジェクトで全体の共通エラー（例: { "detail": "..." }）などが返る場合
                        else if (err.detail) {
                            mainMessage = err.detail;
                        }
                        // パターンC: 万が一古い単一オブジェクト形式 { "unit_name": ["..."] } で返ってきた場合の互換用
                        else if (err.unit_name) {
                            mainMessage = Array.isArray(err.unit_name) ? err.unit_name[0] : err.unit_name;
                            const values = [];
                            grid.data.forEach(row => {
                                const val = String(row.unit_name || "").trim();
                                if (val !== "") {
                                    if (values.includes(val)) {
                                        grid.addCellCss(row.id, "unit_name", "required-error");
                                    }
                                    values.push(val);
                                }
                            });
                        }
                    } else if (err instanceof Error) {
                        mainMessage = err.message;
                    } else {
                        mainMessage = "サーバーとの通信に失敗しました";
                    }

                    // エラーメッセージをトースト表示
                    dhx.message({
                        text: mainMessage,
                        css: "dhx_widget--bg_danger",
                        expire: 6000,
                        node: document.body
                    });
                });
        }


        // --- 削除ボタンの即時実行 ---
        grid.events.on("cellClick", (row, col) => {
            if (col.id === "delete") {
                if (confirm("即時に削除しますか？")) {
                    // サーバーへ削除リクエスト
                    fetch(`/unit/units/${row.id}/`, {
                        method: 'DELETE',
                        headers: {
                            'X-CSRFToken': getCookie('csrftoken')  // ここを追加
                        },
                        // body: JSON.stringify(sendingData)
                    })
                        .then(res => {
                            if (!res.ok) {
                                return res.json().then(err => { throw err; });
                            }
                            return res.json();
                        })
                        .then(result => {
                            grid.data.remove(row.id);
                            dhx.message({
                                text: "削除しました",
                                css: "dhx_widget--bg_success",
                                expire: 3000
                            });
                        })
                        .catch(err => {
                            const errorMsg = err.detail || err.message || "削除に失敗しました";
                            dhx.message({
                                text: errorMsg,
                                css: "dhx_widget--bg_danger", // 赤いトースト
                                expire: 6000
                            });
                        });
                }
            }
        });

        // --- 
        // grid.events.on("afterEditEnd", (value, row, col) => {
        //     // 必須にしたいカラムIDを指定（例: unit_display）
        //     if (col.id === "unit_name") {
        //         if (!value || value.trim() === "") {
        //             // 空ならエラークラスを適用
        //             grid.addCellCss(row.id, col.id, "required-error");
        //         } else {
        //             // 入力されていればエラークラスを削除
        //             grid.removeCellCss(row.id, col.id, "required-error");
        //         }
        //     }
        // });


    </script>
</body>

</html>
