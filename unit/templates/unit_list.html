<body>
<div id="toolbar_container"></div>
<div id="grid_container" style="width: 600px; height: 400px;"></div>
<style>

<script>
    // 1. --- ツールバーの処理 ---
    // 1.1 ツールバー設定（Unitの時と同じ構成）
    const toolbar = new dhx.Toolbar("toolbar_container", { css: "dhx_toolbar--bordered" });
    toolbar.data.add([
        { id: "add", type: "button", value: "新規追加", icon:  "dxi dxi-plus", color: "primary", circle: true, },
        {type: "spacer" },
        {id: "undo", type: "button", value: "リセット", icon: "dxi dxi-undo", color: "secondary", circle: true, },
        {id: "update", type: "button", value: "更新", icon: "dxi dxi-vault", color: "success", circle: true, }
    ]);
    // 1.2. ツールバーのクリックイベント
    toolbar.events.on("click", function(id) {
        if (id === "add") {
            addRow(); // 前に作った関数を呼ぶ
        }
        if (id === "update") {
            updateAll();
        }
        if (id === "undo") {
            undo();
        }
    })

    // --- コンテキストメニューの処理 ---
    const rowMenu = new dhx.ContextMenu(null, {
        data: [
    {"id": "insertRowAbove", "value": "Insert row above", "icon": "dxi dxi-plus" },
    {"id": "insertRowBelow", "value": "Insert row below", "icon": "dxi dxi-plus" },
    {"id": "clearRow", "value": "Clear row", "icon": "dxi dxi-close" },
    {"id": "deleteRow", "value": "Delete row", "icon": "dxi dxi-delete" }
    ]
    });

    // 4. DRFからデータの読み込む（Django の API から取得する場合）
    const dataset = new dhx.DataCollection();
    fetch("/unit/units/")
        .then(response => response.json())
        .then(data => {
            grid.data.parse(data); // data.units (配列部分) を渡す
        });

    // 5. Gridの初期化
    const grid = new dhx.Grid("grid_container", {
        columns: [
            { id: "id", header: [{ text: "ID" }], hidden: true },
          　{ id: "unit_no", header: [{ text: "表示順" , align: "center"}],  },
           { id: "unit_name", header: [{ text: "単位 <span style='color:red'>*</span>", align: "center" }],
                htmlEnable: true
            },
           {
                id: "actions",
                header: [{ text: "Actions", tooltip: true, align: "center", rowspan: 2 }],
                mark: () => "dhx-demo_color--gray",
                template: () => `<i class="dxi dxi-dots-vertical row-menu"></i>`,
                align: "center",
                tooltip: false, editable: false, sortable: false, htmlEnable: true,

           }
        ],
        eventHandlers: {
            onclick: {
                "row-menu": event => rowMenu.showAt(event.target)
                }
            },
        autoWidth: true,
        data: dataset, // 作成した DataCollection を直接紐付ける
        keyNavigation: true,
        editing: true,
        selection: "row",
        // ドラッグ＆ドロップを有効にする
        dragMode: "both",
    });

        // ワンクリックでエディタを開く　https://docs.dhtmlx.com/suite/grid/configuration/#opening-editor-with-one-click
    grid.events.on("cellClick", function (row, column) {

        grid.editCell(row.id, column.id);

    });

    function addRow() {
            // 2. グリッドのデータストアに直接追加
             grid.data.add();
                 // 3. 追加した行へフォーカス（任意）
             // grid.selection.setCell(newRowData.id);


    }


    // 6. --- イベント制御 ---

        // ---　コンテキストメニューの処理 ---
    rowMenu.events.on("click", id => {
        const row = grid.selection.getCell()?.row;
                    const rowIndex = grid.data.getIndex(row.id);
                    switch (id) {
            case "insertRowAbove":
                    grid.data.add({

                }, rowIndex);
                    break;
                    case "insertRowBelow":
                    grid.data.add({

                }, rowIndex + 1);
                    break;
                    case "clearRow":
                    grid.data.update(row.id, {
                        property: "",
                    status: "",
                    client: "",
                    startDate: "",
                    endDate: ""
                });
                    break;
                    case "deleteRow":
                    deleteRow(row.id);
                    // grid.data.remove(row.id);
                    break;
        }
    });

    // --- 行を右クリックでコンテキストメニューを表示する ---
    grid.events.on("cellRightClick", (row, column, event) => {
                        event.preventDefault();
                    grid.selection.setCell(row, column);
                    rowMenu.showAt(event.target);
    });


    // 7. 保存ボタンの処理
        function updateAll() {
            const allData = grid.data.serialize();
            if (allData.length === 0) return;
            fetch("/unit/bulk_sync/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie('csrftoken')
                },
            body: JSON.stringify(allData)
        })
        .then(res => {
            if(!res.ok) {
                return res.json().then(err => { throw err; });
            }
            return res.json();
        })
        .then(result => {
            // 3. 成功時の処理（DRFは成功時にオブジェクトを返す）
            dhx.message({
                text: isNew ? "追加されました" : "更新されました",
                css: "dhx_widget--bg_success",
                expire: 3000
            });
            grid.data.removeAll();
            grid.data.parse(result);
        })
        .catch(err => {
            console.error("Error details:", err);
            let mainMessage = "入力内容を確認してください";
            // サーバーからのバリデーションエラーがある場合
            if (typeof err === "object" && err !== null) {
                for (const fieldId in err) {
                    const item = form.getItem(fieldId);
                    if (item) {
                        const errorMsg = Array.isArray(err[fieldId]) ? err[fieldId][0] : err[fieldId];
                        item.setProperties({
                            error: true,
                            errorMessage: errorMsg
                        });
                        mainMessage = errorMsg;
                    }
                }
            } else {
                // 通信断絶などの致命的エラー
                mainMessage = "サーバーとの通信に失敗しました";
            }
            // 2. トースト（メッセージ）を表示
            dhx.message({
                text: mainMessage,
                css: "dhx_widget--bg_danger", // Suite 9 の赤い背景
                expire: 6000,                // 6秒間表示
                node: document.body
            });
        });
        }

    // 8. 削除処理
    // 削除ボタンの即時実行
    function deleteRow(rowId) {
        if (confirm("即時に削除しますか？")) {
            // サーバーへ削除リクエスト
            fetch(`/unit/units/${row.id}/`, {
                method: 'DELETE',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')  // ここを追加
                    }
                })
            .then(res => {
                if (!res.ok) {
                    return res.json().then(err => { throw err; });
                }
                return res.json();
            })
            .then(result => {
                grid.data.remove(row.id);
                dhx.message({
                    text: "削除しました",
                    css: "dhx_widget--bg_success",
                    expire: 3000
                });
            })
            .catch(err => {
                const errorMsg = err.detail || err.message || "削除に失敗しました";
                dhx.message({
                    text: errorMsg,
                    css: "dhx_widget--bg_danger", // 赤いトースト
                    expire: 6000
                });

            });

        };

    };

    grid.events.on("afterEditEnd", (value, row, col) => {
    // 必須にしたいカラムIDを指定（例: unit_display）
    if (col.id === "unit_name") {
        if (!value || value.trim() === "") {
            // 空ならエラークラスを適用
            grid.addCellCss(row.id, col.id, "required-error");
        } else {
            // 入力されていればエラークラスを削除
            grid.removeCellCss(row.id, col.id, "required-error");
        }
    }
});

    grid.events.on("afterRowDrag", (data, id, targetId) => {
        console.log("移動した行のID:", id);
        console.log("移動先の場所（行ID）:", targetId);

        // ここでサーバーに新しい並び順を保存する処理を書くのが一般的です
        const newState = grid.data.serialize();
    });
</script>
</body>
</html>
