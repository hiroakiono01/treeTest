{% extends 'base.html' %}
{% block head %}
<title>見積一覧</title>
{% endblock %}

{% block contents %}

<body>
    <div id="layout-main-container" style="margin-top: 6rem;"></div>

    <script>
        // ===================================================
        //  1. VARIABLES （変数の宣言とデータの準備）
        // ===================================================
        const layout = new dhx.Layout("layout-main-container", MySharedLayoutConfig);
        let client_id = "";
        let grid = null;
        let form = null;
        let toolbar = null;
        let pagination = null;
        let dhxWindow = null;
        const dataset = new dhx.DataCollection();

        // ===================================================
        // 2. INITIALIZE UI COMPONENTS （画面パーツの組み立て）
        // ===================================================

        // TOOLBAR 2.1 ツールバーの作成
        toolbar = new dhx.Toolbar("toolbar_container", { css: "dhx_toolbar--bordered" });
        toolbar.data.add([
            { id: "add", type: "button", value: "新規追加", icon: "dxi dxi-plus", color: "primary", circle: true, },
        ]);




        // 1. 日本語のロケールデータを定義
        const localeJa = {
            monthsShort: ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"],
            months: ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"],
            daysShort: ["日", "月", "火", "水", "木", "金", "土"],
            days: ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"]
        };

        // 2. フォーム初期化前にロケールを適用
        dhx.i18n.setLocale("calendar", localeJa);

        //  2. --- モーダルウインドウの準備 ---
        dhxWindow = new dhx.Window({
            width: 1200,
            height: 1200,
            title: "新規",
            modal: true
        });

        // 3. --- フォームの準備 ---
        form = new dhx.Form(null, {
            css: "dhx_widget--bordered",
            rows: [

                {
                    type: "input",
                    name: "id",
                    hidden: true
                    // 見えないが値は保持される
                },
                {
                    name: "client",
                    type: "input",
                    label: "事業者",
                    required: true,
                    hidden: true
                },
                { type: "input", name: "id", hidden: true }, // 見えないが値は保持される

                {
                    cols: [

                        {
                            name: "fiscalyear",
                            type: "combo",
                            label: "受注年度",
                            required: true,
                            width: 100,
                            css: "my-custom-required" // 任意のクラス名を追加
                        },
                        {
                            type: "spacer",
                            width: 20 // 横に20pxの間隔を開ける
                        },
                        {
                            name: "estimate_no",
                            type: "input",
                            label: "見積番号",
                            required: true,
                            width: 200,
                            css: "my-custom-required" // 任意のクラス名を追加
                        },
                        {
                            type: "spacer",
                            width: 20 // 横に20pxの間隔を開ける
                        },
                        {
                            name: "estimate_branch_no",
                            type: "input",
                            label: "見積枝番号",
                            width: 80,
                        },
                        {
                            type: "spacer",
                            width: 40 // 横に20pxの間隔を開ける
                        },
                        {
                            name: "estimate_date",
                            type: "datepicker",
                            label: "見積年月日",
                            dateFormat: "%Y年%m月%d日",
                            required: true,
                            width: 180,
                            css: "my-custom-required" // 任意のクラス名を追加

                        },
                        {
                            type: "spacer",
                            width: 20 // 横に20pxの間隔を開ける
                        },
                        {
                            name: "estimate_print_date",
                            type: "datepicker",
                            dateFormat: "%Y年%m月%d日",
                            label: "見積書作成日",
                            width: 180

                        },
                    ]

                },

                {
                    name: "estimate_name",
                    type: "input",
                    label: "工事名称",
                    required: true,
                    css: "my-custom-required" // 任意のクラス名を追加

                },
                {
                    name: "estimate_branch_name",
                    type: "input",
                    label: "工事枝番名称",

                },
                {
                    cols: [
                        {
                            name: "ordere_name1",
                            type: "input",
                            label: "発注者名 上段",
                            required: true,
                            css: "my-custom-required" // 任意のクラス名を追加

                        },
                        {
                            type: "spacer",
                            width: 20 // 横に20pxの間隔を開ける
                        },
                        {
                            name: "ordere_name2",
                            type: "input",
                            label: "発注者名 下段",
                        },
                    ]
                },
                {
                    cols: [
                        {
                            name: "orderer_representative",
                            type: "input",
                            label: "発注代表者",
                        },
                        {
                            type: "spacer",
                            width: 20 // 横に20pxの間隔を開ける
                        },
                        {
                            name: "orderer_person",
                            type: "input",
                            label: "発注担当者",
                        }

                    ]
                },
                {
                    cols: [
                        {
                            name: "contract_zip_code",
                            type: "input",
                            label: "郵便番号",
                            width: "10%"
                        },
                        {
                            type: "spacer",
                            width: 20 // 横に20pxの間隔を開ける
                        },
                        {
                            name: "contract_address1",
                            type: "input",
                            label: "現場住所１",
                            width: "45%"
                        },
                        {
                            type: "spacer",
                            width: 20 // 横に20pxの間隔を開ける
                        },
                        {
                            name: "contract_address2",
                            type: "input",
                            label: "現場住所２",
                        },
                    ]
                },
                {
                    rows: [
                        {
                            alingn: "between",
                            cols: [
                                {
                                    type: "fieldset",
                                    name: "estimate_info",
                                    label: "工事利益情報",
                                    labelAlignment: "center",
                                    width: "30%",
                                    rows: [
                                        {
                                            name: "estimate_amount",
                                            type: "input",
                                            label: "見積金額(税抜)",
                                            width: "100%"
                                        },
                                        {
                                            name: "estimate_budget",
                                            type: "input",
                                            label: "実行予算額",
                                            width: "100%"
                                        },
                                        {
                                            name: "estimate_income",
                                            type: "text",
                                            label: "粗利益",
                                            width: "100%"
                                        },
                                        {
                                            name: "estimate_tax_amount",
                                            type: "input",
                                            label: "消費税額",
                                            width: "100%"
                                        },


                                        {
                                            name: "consumption_rate",
                                            type: "input",
                                            label: "消費税率",
                                            width: "100%"
                                        },

                                        {
                                            name: "consumption_cls",
                                            type: "radioGroup",
                                            label: "消費税区分",
                                            required: true,
                                            labelPosition: "top",  // ラベルを左側に配置
                                            labelWidth: "100px",    // ラベルの横幅を固定
                                            css: "custom-radio-align",
                                            options: {
                                                cols: [
                                                    { value: "1", text: "内税" },
                                                    { value: "2", text: "外税" },
                                                    { value: "3", text: "非課税" },
                                                ]
                                            },
                                            width: "100%"
                                        },



                                    ]
                                },
                                {
                                    type: "fieldset",
                                    name: "athore",
                                    label: "その他条件",
                                    labelAlignment: "center",
                                    width: "30%",
                                    rows: [
                                        {

                                            name: "estimate_limit_date",
                                            type: "input",
                                            label: "見積有効期限",
                                            width: "100%"
                                        },

                                        {
                                            name: "payment_term",
                                            type: "input",
                                            label: "支払条件",
                                            width: "100%"
                                        },
                                        {
                                            name: "estimate_start_date",
                                            type: "input",
                                            label: "工事開始予定日",
                                            width: "100%"
                                        },
                                        {
                                            name: "estimate_end_date",
                                            type: "input",
                                            label: "工事完成予定日",
                                            width: "100%"
                                        },
                                        {
                                            name: "delivery_location",
                                            type: "input",
                                            label: "受渡場所",
                                            width: "100%"
                                        },
                                        {
                                            name: "summary",
                                            type: "input",
                                            label: "備考",
                                            width: "100%"
                                        },
                                    ]
                                }

                            ]

                        }

                    ]
                },
                {
                    type: "button",
                    name: "save",
                    text: "保存",
                    view: "flat",
                    color: "primary"
                }
            ]
        });
        // ★外部ファイルの共通関数を呼び出す（これだけでEnter移動が有効になります）
        enableFormEnterNavigation(form);
        //setupJapaneseCalendar(form, "estimate_date"); // 日本のカレンダー
        dhxWindow.attach(form);


        // 5. Gridの初期化
        grid = new dhx.Grid("grid_container", {
            columns: [
                { id: "id", header: [{ text: "ID" }], hidden: true, isTreeColum: true },
                {
                    id: "detail",
                    width: 100,
                    header: [{ text: "見積明細", align: "center", rowspan: 2 }],
                    align: "center",
                    htmlEnable: true,
                    template: () => "<button class='grid-btn-detail'>明細</button>"
                },
                {
                    id: "estimate_year",
                    header: [
                        { text: "年度" },
                        {
                            content: "selectFilter",
                            // 💡 フィルターの選択肢を降順にする設定
                            filterConfig: {
                                sort: (a, b) => {
                                    if (a < b) return 1;   // aが小さければ、bを前にする
                                    if (a > b) return -1;  // aが大きければ、aを前にする
                                    return 0;              // 同じならそのまま
                                }
                            }
                        }
                    ],
                    width: 100,
                    // editorType: "input"
                },
                {
                    id: "estimate_no",
                    header: [{ text: "受注番号", align: "center", rowspan: 2 }],
                    width: 100,
                    align: "center",
                },
                {
                    id: "estimate_name",
                    header: [{ text: "工事名称", align: "center" }, { content: "inputFilter" }],
                    width: 400
                },
                {
                    id: "action",
                    width: 80,
                    header: [{ text: "修正", align: "center", rowspan: 2 }],
                    align: "center",
                    htmlEnable: true,
                    template: () => "<button class='dxi dxi-pencil'>修正</button>"
                },
                {
                    id: "delete",
                    width: 80,
                    header: [{ text: "削除", align: "center", rowspan: 2 }],
                    align: "center",
                    htmlEnable: true,
                    template: () => "<button class='dxi dxi-delete' >削除</button>"
                }
            ],
            autoWidth: true,
            //rootParent: null
            //data: dataset, // 作成した DataCollection を直接紐付ける
        });


        // 💡 修正した「grid_cell」にGridをアタッチ
        layout.getCell("grid_cell").attach(grid);

        // --- ページネーション ---
        pagination = new dhx.Pagination(null, {
            css: "dhx_widget--bordered dhx_widget--no-border_top",
            data: grid.data,
            pageSize: 50
        });

        // 💡 修正した「pagination_cell」にPaginationをアタッチ
        layout.getCell("pagination_cell").attach(pagination);

        //Grid.data.pase(dataset); // 作成した DataCollection を直接紐付ける


        // ===================================================
        // 3. DATA LOADING （データ通信・サーバーとのやり取り）
        // ===================================================

        // CONNECT: 3.1 DRFからデータの読み込み
        fetch("/api/get_current_client/")
            .then(res => res.json())
            .then(data => {
                client_id = data['current-client'].client_id;
                client_no = data['current-client'].client_no;
                client_name = data['current-client'].client_name;


                // 💡 今回追加した「ヘッダー」の要素に文字をセット
                const headerNoElem = document.getElementById("header_client_no");
                const headerNameElem = document.getElementById("header_client_name");
                const headerReportTitleElem = document.getElementById("header_report_title");
                if (headerNoElem) headerNoElem.textContent = client_no ? `[${client_no}]` : '';
                if (headerNameElem) headerNameElem.textContent = client_name || '';
                if (headerReportTitleElem) headerReportTitleElem.textContent = "部門マスタ保守";


                // 💡 フォームの初期化が終わっているので、安全に初期値をセットできる
                if (client_id && form) {
                    form.setValue({ client: String(client_id) });
                }

                // 💡 1つ目のデータが取れたので、2つ目のfetch（Grid用データ）を呼ぶ
                if (client_id && grid) {
                    fetch(`/estimate/lists/${client_id}/`)
                        .then(response => response.json())
                        .then(data => { grid.data.parse(data); })
                        .catch(err => console.error("部門データ取得失敗:", err));
                }
            })
            .catch(err => console.error("estimateデータ取得失敗:", err));

        // 2. コンボボックスのインスタンスを取得して、DjangoのURLから動的ロード
        const fiscalYearCombo = form.getItem("fiscalyear");
        fiscalYearCombo.data.load("/api/fiscalyears/");

        // ===================================================
        // 4. EVENTS （ボタン操作・イベントリスナー）
        // ===================================================

        // 4.1 toolbar
        toolbar.events.on("click", function (id) {
            if (id === "add") {
                addRow(); // 関数を呼ぶ
            }
        })

        // 6. --- イベントの処理 ---
        // 6.1 新規作成のウインドウを表示する
        function addRow() {
            if (form) {
                form.clear({});
            }
            dhxWindow.header.data.update("title", { value: "新規登録" });
            dhxWindow.setPosition(100, 50);
            dhxWindow.paint();
            dhxWindow.show();
        }

        // 6.2 グリッド内の「編集」ボタンクリック時
        grid.events.on("cellClick", (row, col) => {
            if (col.id === "action") {
                form.setValue(row); // 選択した行のデータをフォームにセット
                dhxWindow.header.data.update("title", { value: "編集" });
                dhxWindow.paint();
                dhxWindow.show();
            }
        });

        // 6.3 グリッド内の「」から違うプログラムをコールする
        grid.events.on("cellClick", (row, col, e) => {
            if (col.id === "detail") {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }

                // 1. estimate_no を取得（なければ id）
                const rawId = row.estimate_no || row.id;

                // 2. 💡「001」などの文字列を数値の「1」に変換（Djangoの <int:> に合わせるため）
                const targetId = parseInt(rawId, 10);

                // 3. 💡 Djangoのルーティング構造に合わせたルート相対パスを作成
                // ※ もし task アプリケーション内なら /task/lists/1/、直下なら /lists/1/ に調整してください
                const targetUrl = `/task/lists/${targetId}/`;

                if (window.parent && typeof window.parent.changeMainContent === "function") {
                    window.parent.changeMainContent(targetUrl);
                } else {
                    window.top.location.href = targetUrl;
                }
            }
        });

        //　UPDATE: 6.3. 保存ボタンの処理
        form.getItem("save").events.on("click", () => {

            // 6.3.1 バリデーションを実行
            if (!form.validate()) {
                // エラー時のカーソルセット
                const info = form.getInfo();
                const firstErrorId = Object.keys(info).find(itemId => info[itemId].error);
                if (firstErrorId) {
                    form.getItem(firstErrorId).setFocus();
                }
                return; // ← 重要：ここで処理を終了させ、以降のfetchを実行させない
            }

            // 6.3.2. バリデーション成功後に値を取得
            const formData = form.getValue();
            console.log("送信データ:", formData);

            const isNew = !formData.id || formData.id === "";

            // 6.3.3. 新規(POST)か更新(PUT)の判定
            const url = isNew ? `/estimate/lists/${client_id}/` : `/estimate/estimates/${formData.id}/`;
            const method = isNew ? "POST" : "PUT";

            // 6.3.4. 通信開始
            fetch(url, {
                method: method,
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie('csrftoken')
                },
                body: JSON.stringify(formData)
            })
                .then(res => {
                    if (!res.ok) {
                        // DRFのバリデーションエラー(400)などをキャッチ
                        return res.json().then(err => { throw err; });
                    }
                    return res.json();
                })
                .then(result => {
                    dhx.message({
                        text: isNew ? "追加されました" : "更新されました",
                        css: "dhx_widget--bg_success",
                        expire: 3000
                    });

                    dhxWindow.hide();

                    // グリッドの再読み込み
                    grid.data.removeAll();
                    // fetchの連鎖（async/awaitを使うともっと綺麗に書けます）
                    return fetch("/estimate/estimates/");
                })
                .then(res => res && res.json())
                .then(data => {
                    if (data) grid.data.parse(data);
                    // grid.data.forEach(row => {
                    //     if (row.estimate_year) years.push(Number(row.estimate_year));
                    // });

                    // if (years.length > 0) {
                    //     const maxYear = Math.max(...years);
                    //     grid.getHeaderFilter("estimate_year").setValue(String(maxYear));
                    // }
                })
                .catch(err => {
                    console.error(err);
                    // Django(DRF)のエラーは {"field_name": ["error message"]} の形式で来ることが多いです
                    let msg = "エラーが発生しました";
                    if (typeof err === 'object') {
                        // 最初のエラー内容を抽出して表示
                        const firstKey = Object.keys(err)[0];
                        msg = Array.isArray(err[firstKey]) ? err[firstKey][0] : (err.detail || msg);
                    }
                    dhx.message({ text: msg, css: "dhx_widget--bg_danger" });
                });
        });

        // 6.4. 削除処理
        grid.events.on("cellClick", (row, col) => {
            if (col.id === "delete") {
                if (confirm("選択した行を削除してもよろしいですか？")) {
                    // 6.4.1. サーバー側のデータを削除
                    fetch(`/estimate/estimates/${row.id}/`, {
                        method: 'DELETE',
                        headers: {
                            'X-CSRFToken': getCookie('csrftoken') // DjangoのCSRF対策
                        }
                    })
                        .then(res => {
                            if (res.ok) {
                                // 6.4.2. サーバー削除成功後、フロントエンド(Grid)から削除
                                grid.data.remove(row.id);
                                dhx.message({
                                    text: "削除しました",
                                    css: "dhx_widget--bg_success",
                                    expire: 3000
                                });
                            } else {
                                dhx.message({
                                    text: "削除に失敗しました",
                                    css: "dhx_widget--bg_danger",
                                    expire: -1
                                });
                            }
                        })
                        .catch(err => {
                            //console.error(err);
                            dhx.message({
                                text: "システムエラーが発生しました", css: "dhx_widget--bg_danger"
                            });
                        });
                }
            }
        });


    </script>
</body>

{% endblock %}
