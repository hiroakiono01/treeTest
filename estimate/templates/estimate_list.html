    // 6.2 グリッド内の「編集」ボタンクリック時
    grid.events.on("cellClick", (row, col) => {
        if (col.id === "action") {
            form.setValue(row); // 選択した行のデータをフォームにセット
            dhxWindow.header.data.update("title", {value: "編集"});
            dhxWindow.paint();
            dhxWindow.show();
        }
    });

    // 6.3 グリッド内の「」から違うプログラムをコールする
    grid.events.on("cellClick", (row, col, e) => {
        if (col.id === "detail") {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            // 1. estimate_no を取得（なければ id）
            const rawId = row.estimate_no || row.id;

            // 2. 💡「001」などの文字列を数値の「1」に変換（Djangoの <int:> に合わせるため）
            const targetId = parseInt(rawId, 10);

            // 3. 💡 Djangoのルーティング構造に合わせたルート相対パスを作成
            // ※ もし task アプリケーション内なら /task/lists/1/、直下なら /lists/1/ に調整してください
            const targetUrl = `/task/lists/${targetId}/`;

            if (window.parent && typeof window.parent.changeMainContent === "function") {
                window.parent.changeMainContent(targetUrl);
            } else {
                window.top.location.href = targetUrl;
            }
        }
    });

    //　UPDATE: 6.3. 保存ボタンの処理
    form.getItem("save").events.on("click", () => {

        // 6.3.1 バリデーションを実行
        const isValid = form.validate();

        if (!isValid) {
            // フォーム全体の「現在の入力値（各キー）」を取得
            const info = form.getValue();

            // 最初のエラーアイテムのIDを特定する
            const firstErrorId = Object.keys(info).find(itemId => {
                const item = form.getItem(itemId);
                if (item && typeof item.validate === "function") {
                    // 画面表示を変えずにバリデーション結果（成否）のみ判定
                    return item.validate(true) === false;
                }
                return false;
            });

            if (firstErrorId) {
                // 【重要】Suite 9 の正しいフォーカス設定方法（フォーム本体のメソッドを使用）
                if (typeof form.setFocus === "function") {
                    form.setFocus(firstErrorId);
                }

                // 念のため、Comboコンポーネントなどの特殊なコントロールだった場合のフォールバック処理
                const item = form.getItem(firstErrorId);
                if (item && typeof item.getWidget === "function") {
                    const widget = item.getWidget();
                    if (widget && typeof widget.focus === "function") {
                        widget.focus();
                    }
                }
            }

            console.log('firstErrorId:', firstErrorId, 'formData:', info);
            return;
        }

        // 6.3.2. バリデーション成功後に値を取得
        const formData = form.getValue();
        console.log("送信データ:", formData);
        const isNew = !formData.id || formData.id === "";
        console.log("送信データ:", formData);
        // 6.3.3. 新規(POST)か更新(PUT)の判定
        const url = isNew ? `/estimate/add/${client_id}/` : `/estimate/estimates/${formData.id}/`;
        const method = isNew ? "POST" : "PUT";
        // 6.3.4. 通信開始
        fetch(url, {
            method: method,
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCookie('csrftoken')
            },
            body: JSON.stringify(formData)
        })
            .then(res => {
                if (!res.ok) {
                    // DRFのバリデーションエラー(400)などをキャッチ
                    return res.json().then(err => {
                        throw err;
                    });
                }
                return res.json();
            })
            .then(result => {
                dhx.message({
                    text: isNew ? "追加されました" : "更新されました",
                    css: "dhx_widget--bg_success",
                    expire: 3000
                });
                // 2. ウィンドウを閉じる
                dhxWindow.hide();
                // 3. 古いグリッドデータをクリア
                grid.data.removeAll();
                // fetchの連鎖（async/awaitを使うともっと綺麗に書けます）
                return fetch(`/estimate/lists/${client_id}/${sql}/`);
            })
            .then(res => {
                if (!res || !res.ok) {
                    throw new Error("データの再読み込みに失敗しました");
                }
                return res.json();
            })
            .then(data => {
                if (data) grid.data.parse(data);
                // grid.data.forEach(row => {
                //     if (row.estimate_year) years.push(Number(row.estimate_year));
                // });

                // if (years.length > 0) {
                //     const maxYear = Math.max(...years);
                //     grid.getHeaderFilter("estimate_year").setValue(String(maxYear));
                // }
            })
            .catch(err => {
                console.error(err);
                // Django(DRF)のエラーは {"field_name": ["error message"]} の形式で来ることが多いです
                let msg = "エラーが発生しました";
                if (typeof err === 'object') {
                    // 最初のエラー内容を抽出して表示
                    const firstKey = Object.keys(err)[0];
                    msg = Array.isArray(err[firstKey]) ? err[firstKey][0] : (err.detail || msg);
                }
                dhx.message({text: msg, css: "dhx_widget--bg_danger"});
            });
    });

    // 6.4. 削除処理
    grid.events.on("cellClick", (row, col) => {
        if (col.id === "delete") {
            if (confirm("選択した行を削除してもよろしいですか？")) {
                // 6.4.1. サーバー側のデータを削除
                fetch(`/estimate/estimates/${row.id}/`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken') // DjangoのCSRF対策
                    }
                })
                    .then(res => {
                        if (res.ok) {
                            // 6.4.2. サーバー削除成功後、フロントエンド(Grid)から削除
                            grid.data.remove(row.id);
                            dhx.message({
                                text: "削除しました",
                                css: "dhx_widget--bg_success",
                                expire: 3000
                            });
                        } else {
                            dhx.message({
                                text: "削除に失敗しました",
                                css: "dhx_widget--bg_danger",
                                expire: -1
                            });
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        dhx.message({
                            text: "システムエラーが発生しました", css: "dhx_widget--bg_danger"
                        });
                    });
            }
        }
    });

    // フォームのボタンクリックイベント
    sidebarForm.events.on("click", function (name) {
        if (name === "search_btn") {
            let data;
            data = sidebarForm.getValue();

            const sql = JSON.stringify(data);
            console.log("検索条件:", sql);
            fetch(`/estimate/lists/${client_id}/${sql}/`)
                .then(response => response.json())
                .then(result => {
                    grid.data.removeAll();
                    grid.data.parse(result);
                })
                .catch(err => console.error("データ取得失敗:", err));

        }
    });

    // サイドバーのボタンでリセットを実行
    sidebarForm.events.on("click", function (name) {
        if (name === "reset_btn") {
            sidebarForm.clear(); // すべての入力値が初期状態に戻ります
        }
    });

</script>
</body>
