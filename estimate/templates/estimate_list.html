    async function loadInitialData() {
        try {

            const clientRes = await fetch("/api/get_current_client/");
            const clientData = await clientRes.json();
            const currentClient = clientData['current-client'] || {};

            // 外側の変数にデータを格納（editGrid等で利用可能になる）
            client_id = currentClient['client_id'] || 0;
            // client_markup_rate = currentClient['current-client']["markup_rate"];
            const client_no = currentClient["client_no"];
            const client_name = currentClient['client_name'];


            // 💡 今回追加した「ヘッダー」の要素に文字をセット
            const headerNoElem = document.getElementById("header_client_no");
            const headerNameElem = document.getElementById("header_client_name");
            const headerReportTitleElem = document.getElementById("header_report_title");
            if (headerNoElem) headerNoElem.textContent = client_no ? `[${client_no}]` : '';
            if (headerNameElem) headerNameElem.textContent = client_name || '';
            if (headerReportTitleElem) headerReportTitleElem.textContent = "見積一覧表";

            await Promise.all([
                fetchFiscalYears(),
                fetchCurrentUsers(),
                fetchAllUsers(),
                fetchCurrentCustomers(),
                fetchAllCustomers(),
                fetchCurrentSegments(),
                fetchAllSegments(),
                fetchConstructions(),
                fetchEstimateLists()

            ]);


        } catch (err) {
            console.error("get_current_clientロードエラーが発生しました:", err);
        }
    }


    async function fetchFiscalYears() {
        try {
            const res = await fetch(`/api/fiscalyear-options/${client_id}/`);
            const data = await res.json()
            fiscalyearOptions = data.fiscalyears.map(item => ({
                id: Number(item.id),
                value: item.value
            }));
            const fiscalyearCombo = form.getItem("fiscalyear").getWidget();
            fiscalyearCombo.data.parse(fiscalyearOptions)
            // console.log("fiscalyearOptions", fiscalyearOptions)
        } catch (err) {
            console.error("fiscalyearデータ取得失敗", err)
        }
    }

        if (col.id === "detail") {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            // 1. estimate_no を取得（なければ id）
            const rawId = row.estimate_no || row.id;

            // 2. 💡「001」などの文字列を数値の「1」に変換（Djangoの <int:> に合わせるため）
            //const targetId = parseInt(rawId, 10);

            // 3. 💡 Djangoのルーティング構造に合わせたルート相対パスを作成
            // ※ もし task アプリケーション内なら /task/lists/1/、直下なら /lists/1/ に調整してください
            const targetUrl = `/task/lists/${rawId}/`;

            if (window.parent && typeof window.parent.changeMainContent === "function") {
                window.parent.changeMainContent(targetUrl);
            } else {
                window.top.location.href = targetUrl;
            }
        }
    });

    // 4.5 保存ボタンの処理
    form.getItem("save").events.on("click", () => {

        // 6.3.1 バリデーションを実行
        const isValid = form.validate();

        if (!isValid) {
            // フォーム全体の「現在の入力値（各キー）」を取得
            const info = form.getValue();

            // 最初のエラーアイテムのIDを特定する
            const firstErrorId = Object.keys(info).find(itemId => {
                const item = form.getItem(itemId);
                if (item && typeof item.validate === "function") {
                    // 画面表示を変えずにバリデーション結果（成否）のみ判定
                    return item.validate(true) === false;
                }
                return false;
            });

            if (firstErrorId) {
                // 【重要】Suite 9 の正しいフォーカス設定方法（フォーム本体のメソッドを使用）
                if (typeof form.setFocus === "function") {
                    form.setFocus(firstErrorId);
                }

                // 念のため、Comboコンポーネントなどの特殊なコントロールだった場合のフォールバック処理
                const item = form.getItem(firstErrorId);
                if (item && typeof item.getWidget === "function") {
                    const widget = item.getWidget();
                    if (widget && typeof widget.focus === "function") {
                        widget.focus();
                    }
                }
            }

            // console.log('firstErrorId:', firstErrorId, 'formData:', info);
            return;
        }

        // 6.3.2. バリデーション成功後に値を取得
        const formData = form.getValue();
        // console.log("送信データ:", formData);
        const isNew = !formData.id || formData.id === "";
        //console.log("送信データdesu:", formData, 'sql',sql);
        //const sql = "nonSQL"
        // 6.3.3. 新規(POST)か更新(PUT)の判定
        const url = isNew ? `/estimate/lists/${client_id}/${sql}/` : `/estimate/detail/${formData.id}/`;
        const method = isNew ? "POST" : "PUT";
        // 6.3.4. 通信開始
        fetch(url, {
            method: method,
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCookie('csrftoken')
            },
            body: JSON.stringify(formData)
        })
            .then(res => {
                if (!res.ok) {
                    // DRFのバリデーションエラー(400)などをキャッチ
                    return res.json().then(err => {
                        throw err;
                    });
                }
                return res.json();
            })
            .then(() => {
                dhx.message({
                    text: isNew ? "追加されました" : "更新されました",
                    css: "dhx_widget--bg_success",
                    expire: 3000
                });
                // 2. ウィンドウを閉じる
                dhxWindow.hide();
                // 3. 古いグリッドデータをクリア
                grid.data.removeAll();
                // fetchの連鎖（async/awaitを使うともっと綺麗に書けます）
                return fetch(`/estimate/lists/${client_id}/${sql}/`);
            })
            .then(res => {
                if (!res || !res.ok) {
                    throw new Error("データの再読み込みに失敗しました");
                }
                return res.json();
            })
            .then(data => {
                if (data) grid.data.parse(data);
            })
            .catch(err => {
                console.error(err);
                // Django(DRF)のエラーは {"field_name": ["error message"]} の形式で来ることが多いです
                let msg = "エラーが発生しました";
                if (typeof err === 'object') {
                    // 最初のエラー内容を抽出して表示
                    const firstKey = Object.keys(err)[0];
                    msg = Array.isArray(err[firstKey]) ? err[firstKey][0] : (err.detail || msg);
                }
                dhx.message({text: msg, css: "dhx_widget--bg_danger"});
            });
    });

    function reloadCombo(useFlgValue) {
        const promises = []; // 各通信の完了を監視するための配列

        // 1. まず現在のCombo（またはDataCollection）のデータをすべてクリアする
        const customerNameCombo = form.getItem("customer").getWidget();

        if (customerNameCombo) {

        const segmentNameCombo = form.getItem("segment").getWidget();

        const userNameCombo = form.getItem("estimate_person").getWidget();
        if (userNameCombo) {
            userNameCombo.clear();
            userNameCombo.data.removeAll();
            promises.push(userNameCombo.data.parse(currentUserOptions));
        }

        // すべてのコンボボックスのデータロード（通信）が完了したら通知する
        return Promise.all(promises);
    }
