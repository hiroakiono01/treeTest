<html lang="ja">
<head>
    {% load static %}
    {% csrf_token %}
    <!-- DHTMLX SuiteのJS/CSSを読み込み -->
    <script src="{% static 'suite/suite.js' %}"></script>
    <link rel="stylesheet" href="{% static 'suite/suite.css' %}">

    <!-- 共通ユーティリティ -->
    <script src="{% static 'js/utils.js' %}"></script>
    <link rel="stylesheet" href="{% static 'suite/myStyle.css' %}">
    <title>Estimate Information</title>
</head>
<body>
<div id="toolbar_container"></div>
<div id="grid_container"></div>
</body>
</html>
<style>
    /* コンテンツ全体を包むコンテナ */
    .main-container {
        max-width: 1200px;    /* 全体の最大幅（お好みで調整） */
        margin: 0 auto;       /* 左右を中央に寄せる */
        padding: 20px;        /* 左右に少し余白を作る */
    }

    /* 画面全体を中央寄せの土台にする */
    .grid-wrapper {
        display: flex;
        justify-content: center; /* 左右中央 */
        align-items: center;    /* 上下中央（必要なら） */
        height: 100vh;          /* 画面全体の高さ */
        background-color: #f5f5f5;
    }

    /* Gridのサイズを指定 */
    #grid_container {
        width: 80%;             /* 画面幅の80% */
        max-width: 1000px;      /* 広がりすぎないように制限 */
        height: 600px;          /* 高さを指定（Suite 9は高さ指定が必須） */
        box-shadow: 0 4px 10px rgba(0,0,0,0.1); /* 浮き出し効果 */
    }
</style>
<script>
    // 1. --- ツールバーの処理 ---
    const toolbar = new dhx.Toolbar("toolbar_container", { css: "dhx_toolbar--bordered" });
    toolbar.data.add([
        { id: "add", type: "button", value: "新規追加", icon: "dxi dxi-plus", color: "primary", circle: true,},
    ]);
    toolbar.events.on("click", function(id) {
        if (id === "add") {
            addRow(); // 関数を呼ぶ
        }
    })


    //  2. --- モーダルウインドウの準備 ---
        const dhxWindow = new dhx.Window({
        width: 400,
        height: 400,
        title: "新規",
        modal: true
    });

    // 3. --- フォームの準備 ---
    const form = new dhx.Form(null, {
        rows: [
            { type: "input", name: "id", hidden: true }, // 見えないが値は保持される
            {
                name: "estimate_year",
                type: "input",
                label: "受注年度",
                required: true
            },
            {
                name: "estimate_no",
                type: "input",
                label: "受注番号",
                required: true
            },
            {
                name: "estimate_name",
                type: "input",
                label: "工事名称",
                required: true
            },
            {
                type: "button",
                name: "save",
                text: "保存",
                view: "flat",
                color: "primary"
            }
        ]
    });
    dhxWindow.attach(form);

    // 4. --- DRFからデータの読み込み ---
    // 4.1 main dataの取得
    const dataset = new dhx.DataCollection();
    fetch("/estimate/estimates/")
        .then(response => response.json())
        .then(data => {
            grid.data.parse(data); // 配列部分を渡す
        });

    // 5. Gridの初期化
    const grid = new dhx.Grid("grid_container", {
        columns: [
            { id: "id", header: [{ text: "ID" }], hidden: true },
            {
                id: "action",
                header: [{ text: "修正" , align: "center"}],
                align: "center",
                width: 80,
                htmlEnable: true,
                template:() => "<button class='grid-btn-edit'>修正</button>"
            },
            {
                id: "estimate_year",
                header: [{ text: "受注年度", align: "center" }, { content: "selectFilter" }],
                width: 100,
                editable: true
            },
          　{ id: "estimate_no", header: [{ text: "受注番号" , align: "center"}],  width: 100},
          　{ id: "estimate_name", header: [{ text: "工事名称" , align: "center"}, { content: "inputFilter" }],  },
            {
                id: "delete",
                header: [{ text: "削除" , align: "center"}],
                align: "center",
                width: 80,
                htmlEnable: true,
                template: () => "<button class='grid-btn-delete' >削除</button>"
            }
        ],
        autoWidth: true,
        data: dataset, // 作成した DataCollection を直接紐付ける
    });

    // 6. --- イベントの処理 ---
    // 6.1 新規作成のウインドウを表示する
    function addRow() {
        if (form) {
            form.clear({});
            }
        dhxWindow.header.data.update("title", { value: "新規登録" });
        dhxWindow.setPosition(100, 50);
        dhxWindow.paint();
        dhxWindow.show();
    }
    // 6.2 グリッド内の「編集」ボタンクリック時
    grid.events.on("cellClick", (row, col) => {
        if (col.id === "action") {
            form.setValue(row); // 選択した行のデータをフォームにセット
            dhxWindow.header.data.update("title", { value: "編集"});
            dhxWindow.paint();
            dhxWindow.show();
        }
    });

    // 6.3. 保存ボタンの処理
    form.getItem("save").events.on("click", () => {

        // 6.3.1 バリデーションを実行
        if (!form.validate()) {
            // エラー時のカーソルセット
            const info = form.getInfo();
            const firstErrorId = Object.keys(info).find(itemId => info[itemId].error);
            if (firstErrorId) {
                form.getItem(firstErrorId).setFocus();
            }
            return; // ← 重要：ここで処理を終了させ、以降のfetchを実行させない
        }

        // 6.3.2. バリデーション成功後に値を取得
        const formData = form.getValue();
        console.log("送信データ:", formData);

        const isNew = !formData.id || formData.id === "";

        // 6.3.3. 新規(POST)か更新(PUT)の判定
        const url = isNew ? "/estimate/estimates/" : `/estimate/estimates/${formData.id}/`;
        const method = isNew ? "POST" : "PUT";

        // 6.3.4. 通信開始
        fetch(url, {
            method: method,
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCookie('csrftoken')
            },
            body: JSON.stringify(formData)
        })
        .then(res => {
            if (!res.ok) {
                // DRFのバリデーションエラー(400)などをキャッチ
                return res.json().then(err => { throw err; });
            }
            return res.json();
        })
        .then(result => {
            dhx.message({
                text: isNew ? "追加されました" : "更新されました",
                css: "dhx_widget--bg_success",
                expire: 3000
            });

            dhxWindow.hide();

            // グリッドの再読み込み
            grid.data.removeAll();
            // fetchの連鎖（async/awaitを使うともっと綺麗に書けます）
            return fetch("/estimate/estimates/");
        })
        .then(res => res && res.json())
        .then(data => {
            if (data) grid.data.parse(data);
        })
        .catch(err => {
            console.error(err);
            // Django(DRF)のエラーは {"field_name": ["error message"]} の形式で来ることが多いです
            let msg = "エラーが発生しました";
            if (typeof err === 'object') {
                // 最初のエラー内容を抽出して表示
                const firstKey = Object.keys(err)[0];
                msg = Array.isArray(err[firstKey]) ? err[firstKey][0] : (err.detail || msg);
            }
            dhx.message({ text: msg, css: "dhx_widget--bg_danger" });
        });
    });

    // 6.4. 削除処理
    grid.events.on("cellClick", (row, col) => {
        if (col.id === "delete") {
            if (confirm("選択した行を削除してもよろしいですか？")) {
                // 6.4.1. サーバー側のデータを削除
                fetch(`/estimate/estimates/${row.id}/`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken') // DjangoのCSRF対策
                    }
                })
                .then(res => {
                    if (res.ok) {
                        // 6.4.2. サーバー削除成功後、フロントエンド(Grid)から削除
                        grid.data.remove(row.id);
                        dhx.message({
                            text: "削除しました",
                            css: "dhx_widget--bg_success",
                            expire: 3000
                        });
                    } else {
                         dhx.message({
                            text: "削除に失敗しました",
                            css: "dhx_widget--bg_danger",
                            expire: -1
                           });
                    }
                })
                .catch(err => {
                    //console.error(err);
                    dhx.message({
                        text: "システムエラーが発生しました", css: "dhx_widget--bg_danger"
                    });
                });
            }
        }
    });
</script>
