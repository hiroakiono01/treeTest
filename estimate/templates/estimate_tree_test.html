<!-- template.html -->


<html>
<head>
    <meta charset="utf-8">
    <title>見積明細一覧</title>
</head>
<body>
<div id="product-app" data-url="{% url 'estimate:estimateD_list' %}"></div>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>見積番号</th>
        <th>見積名</th>
        <th>予算額</th>
    </tr>
    </thead>
    <tbody id="product-list">
    <!-- ここにJavaScriptでデータが挿入されます -->
    <tr>
        <td colspan="4" align="center">読み込み中...</td>
    </tr>
    </tbody>
</table>

{% verbatim %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // URLを取得
        const appElement = document.getElementById('product-app');
        if (!appElement) return;
        const apiUrl = appElement.dataset.url ;


        // 実際にアクセスする最終的なURLもチェック
        const finalUrl = apiUrl + (apiUrl.includes('?') ? '&' : '?') + "format=json";
        console.log("実際にfetchするURL:", finalUrl);


        // FetchでAPIを叩く
        fetch(apiUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error('サーバーエラーが発生しました');
                }
                return response.json();
            })
            .then(data => {
                const tbody = document.getElementById('product-list');
                tbody.innerHTML = ''; // 「読み込み中」を消去

                // 取得したデータ（配列）をループしてテーブル行を作成
                data.forEach(item => {
                    const row = `
                        <tr>
                            <td align="center">${item.id}</td>
                            <td align="center">${item.estimate_no}</td>
                            <td align="center">${item.detail_name}</td>
                            <td align="center">${item.budget_price ? item.budget_price.toLocaleString() : '0'}</td>

                        </tr>
                    `;
                    // 行をtbodyの最後に追加
                    tbody.insertAdjacentHTML('beforeend', row);
                });
            })
            .catch(error => {
                console.error('Fetch Error:', error);
                document.getElementById('product-list').innerHTML =
                    `<tr><td colspan="4" style="color:red">データの取得に失敗しました</td></tr>`;
            });
    });
</script>
{% endverbatim %}
</body>
