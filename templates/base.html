<body>
<!-- 画面全体を覆うレイアウト用の器だけを用意します -->
<div id="layout" style="height: 100vh; width: calc(100vw - 100px); margin: 0 auto;"></div>

<script>
    // 1. レイアウトの定義（htmlプロパティを空にして、後からMenuやGridを入れられるようにします）
    const config = {
        type: "line",
        rows: [
            {
                id: "toolbar_cell", // Menuを配置するヘッダーセル
                height: "46px"      // DHTMLX Menuの標準的な高さに合わせるのが綺麗です
            },
            {
                cols: [
                    {
                        id: "grid_cell",    // メインコンテンツ（Gridなど）を表示するセル
                        html: "ここにメインコンテンツが表示されます"
                    },
                ]
            },
            {
                id: "footer_cell",  // フッターセル
                html: "Copyright &copy; kag holdings inc 2025",
                height: "30px",
                css: "footer-cell"
            }
        ]
    };

    // レイアウトを初期化
    const layout = new dhx.Layout("layout", {
        config,
        });

<!--        // 💡 子画面（iframe）からいつでも呼び出せるように、window全体に公開します-->
<!--        window.changeMainContent = function(url) {-->
<!--            console.log("親画面側でコンテンツ切り替え関数が実行されました。URL:", url);-->

<!--            // DHTMLX Suite 9 の正しいメソッド-->
<!--            const mainCell = layout.getCell("grid_cell");-->

<!--            if (mainCell) {-->
<!--                // 中央のセルの中身を、新しい詳細画面の iframe で上書きする-->
<!--                mainCell.attachHTML(-->
<!--                    `<iframe src="${url}" style="width:100%; height:100%; border:none;"></iframe>`-->
<!--                );-->
<!--            } else {-->
<!--                console.error("親画面側：grid_cell が見つかりません。configのIDを確認してください。");-->
<!--            }-->
<!--        };-->


    // 2. メニューのデータ定義
    const dataset = [
        { "id": "unit", "value": "Unit" },
        { "type": "separator" },
        { "id": "reference", "value": "Reference" },
        { "type": "separator" },
        { "id": "estimate", "value": "Estimate" },
        { "type": "separator" },
        { "type": "spacer" },
        { "type": "separator" },
        { "id": "account_signup", "value": "Sign Up" }, // IDをイベント側の初期値に合わせました
        { "type": "separator" },
        { "id": "account_login", "value": "Log In" }    // IDをイベント側の初期値に合わせました
    ];

    // 💡 修正ポイント①: メモリ上だけでMenuを生成（第一引数を null にする）
    const menu = new dhx.Menu("menu", {
        css: "custom",
    });
    menu.data.parse(dataset);

    // 💡 修正ポイント②: レイアウトの最上部セル（toolbar_cell）にMenuを合体させる
    layout.getCell("toolbar_cell").attach(menu);

    // 3. メニュークリック時の遷移イベント（ID名をデータと一致させました）
    menu.events.on("click", function(id) {
        // メインコンテンツを表示するセルを取得
        const mainCell = layout.getCell("grid_cell");

        if (id === "estimate") {
            // iframeを使って、指定したURLのページをセルいっぱいに表示する
            mainCell.attachHTML(
                `<iframe src="{% url 'estimate:estimate_list' %}" style="width:100%; height:100%; border:none;"></iframe>`
            );
        }
        if (id === "unit") {
            mainCell.attachHTML(
                `<iframe src="{% url 'unit:unit-list' %}" style="width:100%; height:100%; border:none;"></iframe>`
            );
        }
        if (id === "reference") {
            mainCell.attachHTML(
                `<iframe src="{% url 'reference:reference-list' %}" style="width:100%; height:100%; border:none;"></iframe>`
            );
        }
        // サインアップやログインは画面全体を遷移させることが多いためそのまま
        if (id === "account_signup") window.location.href = "{% url 'account_signup' %}";
        if (id === "account_login")  window.location.href = "{% url 'account_login' %}";
    });
</script>
</body>
