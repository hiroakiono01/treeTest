    // URLの末尾から estimateNo を安全に取得して即座に代入

    // 3.1 DRFからデータを一括で読み込み
    async function loadInitialData() {
        try {
            // 3.1 現在のクライアントデータを取得（全ての基盤）
            const clientRes = await fetch("/api/get_current_client/");
            const clientData = await clientRes.json();
            const currentClient = clientData['current-client'] || {};

            // 外側の変数にデータを格納（editGrid等で利用可能になる）
            clientId = currentClient['client_id'] || 0;

            const clientNo = currentClient['client_no'];
            const clientName = currentClient['client_name'];

            // ヘッダー要素への文字セット
            const headerNoElem = document.getElementById("header_client_no");
            if (headerNoElem) headerNoElem.textContent = clientNo ? `[${clientNo}]` : '';

            const headerNameElem = document.getElementById("header_client_name");
            if (headerNameElem) headerNameElem.textContent = clientName || '';

            const headerReportTitleElem = document.getElementById("header_report_title");
            if (headerReportTitleElem) headerReportTitleElem.textContent = "見積明細一覧";

            // estimateIdの取得
            const estimateRes = await fetch(`/api/get_estimate_name/${clientId}/${estimateNo}/`);
            const estimateData = await estimateRes.json();
            estimateId = estimateData['estimateId']
            const estimateName = estimateData['estimate_name'];

            const headerEstimateNameElem = document.getElementById("header_estimate_name");
            if (headerEstimateNameElem) headerEstimateNameElem.textContent = estimateName;

            const headerEstimateNoElem = document.getElementById("header_estimate_no");
            if (headerEstimateNoElem) headerEstimateNoElem.textContent = estimateNo ? `(${estimateNo})` : '';

            // clientId が確定したため、依存するAPIリクエストを並列で実行
            await Promise.all([
                //fetchEstimateInfo(),
                fetchCurrentUnits(),
                fetchAllUnits(),
                fetchAggregationOptions(),
                fetchTaskLists()
            ]);
        } catch (err) {
            console.error("get_current_clientロードエラーが発生しました:", err);
        }
    }

    async function fetchEstimateInfo() {
        try {
            const res = await fetch(`/api/get_estimate_name/${clientId}/${estimateNo}/`);
            const data = await res.json();
            const estimateName = data['estimate_name'];
            const estimateId = data['estimateId'];
            console.log("estimateId", estimateId)

            const headerEstimateNameElem = document.getElementById("header_estimate_name");
            if (headerEstimateNameElem) headerEstimateNameElem.textContent = estimateName;

            const headerEstimateNoElem = document.getElementById("header_estimate_no");
            if (headerEstimateNoElem) headerEstimateNoElem.textContent = estimateNo ? `(${estimateNo})` : '';
        } catch (err) {
            console.error("estimateデータ取得失敗:", err);
        }
    }

            console.error("currentUnitデータ取得失敗:", err);

    async function fetchAllUnits() {
        try {
            use_flg = "9"
            //const unitFields = ["budget_unit", "unit"]
            const res = await fetch(`/api/unit-options/${clientId}/${use_flg}/`);
            const data = await res.json();
            allUnitOptions = data.units.map(item => ({

    // 3.4 Aggregation一覧を取得してGridおよびeditGridのプルダウンに反映
    async function fetchAggregationOptions() {
        try {
            const aggrFields = ["aggregation"];
            const res = await fetch(`/api/aggr-options/${clientId}/`);
            const data = await res.json();
            const formattedAggregations = data.aggregations.map(item => ({
                id: Number(item.id),
                value: item.value
            }));

            // ★ 先頭に「未選択用」の空の選択肢を差し込む（必要に応じて）
            formattedAggregations.unshift({id: null, value: "（選択解除）"});
            // 親Gridへの反映
            const currentColumns = treeGrid.config.columns.map(col => {
                if (aggrFields.includes(col.id)) {
                    return {...col, options: formattedAggregations};
                }
                // console.log("col", col)
                return col;
            });
            treeGrid.setColumns(currentColumns);
            // 2. データを変数にキャッシュしておく
            globalAggregationOptions = formattedAggregations;
            //editGrid.setColumns(currentColumns);
            //treeGrid.paint();

            //     // treeGridと同様に setColumns を使って安全に反映させます
            //     const currentChildColumns = editGrid.config.columns.map(col => {
            //         if (aggrFields.includes(col.id)) {

            //         }
            //         return col;
            //     });
            //     editGrid.setColumns(currentChildColumns);
            // }


        } catch (err) {
            console.error("aggregationデータ取得失敗:", err);
        }
    }

    // 3.5 タスク一覧の取得
    async function fetchTaskLists() {
        try {
            console.log("estimateId", estimateId)
            const res = await fetch(`/task/lists/${estimateId}/`);
            const data = await res.json();

    // 4.1.1 新規作成のウインドウを表する
    function addRow() {
        // .log("estimateNo", estimateNo)

        collapseAll();

            }, 50);
        });

        // 2.5 Enterで移動する
        enableGridEnterNavigation(treeGrid);
        //treeGrid.paint();
        const newRowData = {

            //id: dhx.uid(),          // DHTMLXの機能で一意のIDを生成
            estimate_no: estimateNo, // ★ここにセットしたい番号を指定
            task_name: "",  // 初期表示名（任意）

            isNew: true,

        use_flg = "0";

        treeGrid.data.add(newRowData);

        // 3. (オプション) 追加した行を自動でフォーカスしてスクロール
        // treeGrid.selection.setCell(newRowData.id, "estimate_no");
    }


    // 4.1.2 自動で行を追加する処理
    treeGrid.events.on("cellClick", function (row, col, e) {
        console.log("1. cellClickが発生:", row.id, col.id);
    });
    treeGrid.events.on("beforeKeyDown", function (event, e) {

        if (e.keyCode === 13) {
            // console.log('event', e.keyCode)

            // 現在選択（編集）されているセル情報を取得
            const selection = treeGrid.selection.getCell();
            if (!selection) return true;

            const current_row = selection.row;
            const current_col = selection.column;

            // 全体の行配列と列配列を取得
            const all_rows = treeGrid.data.map(item => item.id);
            const all_cols = treeGrid.config.columns;

            // 「最後の行」かつ「最後の列」であるか判定
            const isLastRow = current_row.id === all_rows[all_rows.length - 1];
            const isLastCol = current_col.id === all_cols[all_cols.length - 1].id;

            if (isLastRow && isLastCol) {
                // デフォルトのEnterキー挙動（フォーカスアウトや改行など）をキャンセル
                event.preventDefault();
                // 1. 新しい空の行を追加（ユニークIDを自動生成など）
                const newRowId = "u" + Date.now();
                treeGrid.data.add({id: newRowId, title: "", price: ""})

                // 2. 画面を更新し、即座に新しい行の最初の列を選択・編集状態にする
                setTimeout(() => {
                    // const firstColId = all_cols[2].id;
                    treeGrid.selection.setCell(newRowId, "estimate_no");
                    //treeGrid.editCell(newRowId, firstColId);
                }, 50)
                return false;

            }

        }
        return true
    })

    // 4.1.3 rowを上に移動させる
    function moveRowUp() {
        // console.log("moveRowUp");
        const selectedCell = treeGrid.selection.getCell();
        if (!selectedCell || !selectedCell.row) {
            alert("移動する行を選択してください。");
            return;
        }
        const targetId = selectedCell.row.id;
        const currentIndex = treeGrid.data.getIndex(targetId);
        // 最上行の制御
        if (currentIndex <= 0) {
            return;
        }
        // 1. 位置を移動
        treeGrid.data.move(targetId, currentIndex - 1);
        // 2. すべての行の sort_order を再配分
        updateAllSortOrders();
        // 💡 3. グリッドを強制的に再描画（画面を動かす）
        treeGrid.paint();
        // 移動後も選択状態をキープ
        treeGrid.selection.setCell(targetId, selectedCell.column.id);
    }

    // 4.1.4 rowを下に移動させる
    function moveRowDown() {
        const selectedCell = treeGrid.selection.getCell();
        //console.log("moveRowDown", selectedCell);
        if (!selectedCell || !selectedCell.row) {
            alert("移動する行を選択してください。");
            return;
        }
        const targetId = selectedCell.row.id;
        const currentIndex = treeGrid.data.getIndex(targetId);
        const totalCount = treeGrid.data.getLength();
        // 最下行の制御
        if (currentIndex >= totalCount - 1) {
            return;
        }
        // 1. 位置を移動
        treeGrid.data.move(targetId, currentIndex + 1);
        // 2. すべての行の sort_order を再配分
        updateAllSortOrders();
        // 💡 3. グリッドを強制的に再描画（画面を動かす）
        treeGrid.paint();
        // 移動後も選択状態をキープ
        treeGrid.selection.setCell(targetId, selectedCell.column.id);
    }

    // 4.1.5 展開する
    function expandAll() {
        treeGrid.expandAll();
    }

    // 4.1.6 折りたたむ
    function collapseAll() {
        treeGrid.collapseAll();
    }

    // 4.1.7 リセット処理
    function resetGrid() {
        // ユーザーに確認（キャンセルされたら処理を中断）
        // if (!confirm("編集中の内容を破棄して、元の状態に戻しますか？")) return;

        // 1. サーバーから最新のデータを再取得
        fetch(`/task/lists/${estimateNo}/`)
            .then(res => res.json())
            .then(result => {
                // 2. treeGridデータを削除
                treeGrid.data.removeAll();
                // 3. 取得したデータを再読み込み
                treeGrid.data.parse(result);
                dhx.message({text: "変更をリセットしました", expire: 2000});
            })
            .catch(err => {
                console.error("リセット失敗:", err);
                dhx.message({text: "データの再取得に失敗しました", css: "dhx_message--error"});
            });
    }

        treeGrid.selection.setCell(row, column);

            case "deleteRow":

    //             // 2. 現在のgridデータをすべてクリア

    //

    // 4.2.6 値の自動計算
    treeGrid.events.on("afterEditEnd", function (value, row, column) {

        // 1. 数量（budget_quantity=>quantity）のコピー処理
        if (column.id === "quantity" || column.id === "budget_quantity") {
            const currentQty = parseFloat(row.quantity);
            if (isNaN(currentQty) || row.quantity === "" || row.quantity === null) {
                treeGrid.data.update(row.id, {
                    quantity: row.budget_quantity
                });
            }
        }

        // 2. 単位（budget_unit=>unit）のコピー処理
        if (column.id === "unit" || column.id === "budget_unit") {
            const currentUnit = row.unit;
            if (!currentUnit || currentUnit.toString().trim() === "") {
                treeGrid.data.update(row.id, {
                    unit: row.budget_unit
                });
            }
        }

        if (column.id === "quantity" || column.id === "price") {
            const qty = parseFloat(row.quantity);
            const price = parseFloat(row.price);
            if (!isNaN(qty) && !isNaN(price)) {
                // 計算結果を「生データ」として直接treeGridに保存（これが出荷データになります）
                treeGrid.data.update(row.id, {
                    amount: Math.round(qty * price)
                });
            }
        }

        // 4. 予算数量または予算単価が変更された場合の、予算金額（budget_amount）計算
        if (column.id === "budget_quantity" || column.id === "budget_price") {
            const qty = parseFloat(row.budget_quantity);
            const price = parseFloat(row.budget_price);
            if (!isNaN(qty) && !isNaN(price)) {
                treeGrid.data.update(row.id, {
                    budget_amount: Math.round(qty * price)
                });
            } else {
                treeGrid.data.update(row.id, {
                    budget_amount: 0
                });
            }
        }


        // 2. 単価（price）の計算処理（空なら budget_price * markup_rate をセット）★変更
        if (column.id === "price" || column.id === "quantity" || column.id === "markup_rate") {
            const currentPrice = parseFloat(row.price);
            if (isNaN(currentPrice) || row.price === "" || row.price === null) {
                const bPrice = parseFloat(row.budget_price);
                const rate = parseFloat(row.markup_rate);

                // 両方に有効な数値が入っている場合のみ掛け算（片方でも無ければ予算単価をそのままコピー）
                if (!isNaN(bPrice) && !isNaN(rate)) {
                    treeGrid.data.update(row.id, {
                        price: Math.round((bPrice * rate) / 100)
                    });
                } else if (!isNaN(bPrice)) {
                    treeGrid.data.update(row.id, {
                        price: bPrice
                    });
                }
            }
        }
    });

                if (isLastRow && isLastCol) {

        // 6.2 editGridの行を上に移動
        function moveRowUp() {
            // console.log("moveRowUp");
            const selectedCell = editGrid.selection.getCell();
            if (!selectedCell || !selectedCell.row) {
                alert("移動する行を選択してください。");
                return;
            }
            const targetId = selectedCell.row.id;
            const currentIndex = editGrid.data.getIndex(targetId);
            // 最上行の制御
            if (currentIndex <= 0) {
                return;
            }
            // 1. 位置を移動
            editGrid.data.move(targetId, currentIndex - 1);
            // 2. すべての行の sort_order を再配分
            updateAllSortOrders();
            // 💡 3. グリッドを強制的に再描画（画面を動かす）
            editGrid.paint();
            // 移動後も選択状態をキープ
            editGrid.selection.setCell(targetId, selectedCell.column.id);
        }

        // 6.3 editGridの行を下に移動

            const selectedCell = editGrid.selection.getCell();
            //console.log("moveRowDown", selectedCell);
            if (!selectedCell || !selectedCell.row) {
                alert("移動する行を選択してください。");
                return;
            }
            const targetId = selectedCell.row.id;
            const currentIndex = editGrid.data.getIndex(targetId);
            const totalCount = editGrid.data.getLength();
            // 最下行の制御
            if (currentIndex >= totalCount - 1) {
                return;
            }
            // 1. 位置を移動
            editGrid.data.move(targetId, currentIndex + 1);
            // 2. すべての行の sort_order を再配分
            updateAllSortOrders();
            // 💡 3. グリッドを強制的に再描画（画面を動かす）
            editGrid.paint();
            // 移動後も選択状態をキープ
            editGrid.selection.setCell(targetId, selectedCell.column.id);
        }

        // 6.4 editGridの変更をtreeGridに反映させる
        function saveRow() {
            editGrid.editEnd();

            const oldChildren = treeGrid.data.getItems(currentParentId);
            oldChildren.forEach(function (child) {
                treeGrid.data.remove(child.id);
            });

            // 2. 通常Gridから最新の編集後データを取得
            const updatedData = editGrid.data.serialize();
            //console.log('updatedData', updatedData)

            // 3. 取得したデータをTreeGridの指定した親（currentParentId）の直下に再挿入
            updatedData.forEach(function (item) {
                treeGrid.data.add(item, -1, currentParentId);
            });
            // 4. 親のTreeGridを明示的に再描画（念のため追加）
            treeGrid.paint();
        }

        // 6.5 リセット処理
        function resetGrid() {
            // ユーザーに確認（キャンセルされたら処理を中断）
            if (!confirm("編集中の内容を破棄して、元の状態に戻しますか？")) return;

            // 1. editGridのデータをすべて削除
            editGrid.data.removeAll();

            // 2. treeGridから元のデータを取得
            const oldChildren = treeGrid.data.getItems(currentParentId);

            if (oldChildren && oldChildren.length > 0) {
                // 3. データのディープコピーを作成（参照を切る）
                const copiedData = JSON.parse(JSON.stringify(oldChildren));

                // 4. コピーしたデータをeditGridに再読み込み
                editGrid.data.parse(copiedData);
            }

            // 5. グリッドの再描画（Suite 9のparseは自動描画されますが明示的に行う場合）
            editGrid.paint();
        }

        // 6.6 値の自動計算
        editGrid.events.on("afterEditEnd", function (value, row, column) {

            // 1. 数量（budget_quantity=>quantity）のコピー処理
            if (column.id === "quantity" || column.id === "budget_quantity") {
                const currentQty = parseFloat(row.quantity);
                if (isNaN(currentQty) || row.quantity === "" || row.quantity === null) {
                    editGrid.data.update(row.id, {
                        quantity: row.budget_quantity
                    });
                }
            }

            // 2. 単位（budget_unit=>unit）のコピー処理
            if (column.id === "unit" || column.id === "budget_unit") {
                const currentUnit = row.unit;
                if (!currentUnit || currentUnit.toString().trim() === "") {
                    editGrid.data.update(row.id, {
                        unit: row.budget_unit
                    });
                }
            }

            if (column.id === "quantity" || column.id === "price") {
                const qty = parseFloat(row.quantity);
                const price = parseFloat(row.price);
                if (!isNaN(qty) && !isNaN(price)) {
                    // 計算結果を「生データ」として直接treeGridに保存（これが出荷データになります）
                    editGrid.data.update(row.id, {
                        amount: Math.round(qty * price)
                    });
                }
            }

            // 4. 予算数量または予算単価が変更された場合の、予算金額（budget_amount）計算
            if (column.id === "budget_quantity" || column.id === "budget_price") {
                const qty = parseFloat(row.budget_quantity);
                const price = parseFloat(row.budget_price);
                if (!isNaN(qty) && !isNaN(price)) {
                    editGrid.data.update(row.id, {
                        budget_amount: Math.round(qty * price)
                    });
                } else {
                    editGrid.data.update(row.id, {
                        budget_amount: 0
                    });
                }
            }


            // 2. 単価（price）の計算処理（空なら budget_price * markup_rate をセット）★変更
            if (column.id === "price" || column.id === "quantity" || column.id === "markup_rate") {
                const currentPrice = parseFloat(row.price);
                if (isNaN(currentPrice) || row.price === "" || row.price === null) {
                    const bPrice = parseFloat(row.budget_price);
                    const rate = parseFloat(row.markup_rate);

                    // 両方に有効な数値が入っている場合のみ掛け算（片方でも無ければ予算単価をそのままコピー）
                    if (!isNaN(bPrice) && !isNaN(rate)) {
                        editGrid.data.update(row.id, {
                            price: Math.round((bPrice * rate) / 100)
                        });
                    } else if (!isNaN(bPrice)) {
                        editGrid.data.update(row.id, {
                            price: bPrice
                        });
                    }
                }
            }
        });

        // 6.7 editGridを解放
        editWindow.events.on("afterHide", function () {
            editWindow.destructor(); // ウィンドウと内包するレイアウト・グリッドを一括破棄
            editWindow = null;       // 変数をクリア
            return true;             // trueを返さないと実際に閉じないので注意
        });

        // 4. ウィンドウを閉じてメモリを解放
        // editWindow.hide();
        // editWindow.destructor();
        // editWindow = null;


    });


</script>
</body>
