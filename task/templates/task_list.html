            level = (grid.data.getItem(item.parent).$level || 0) + 1;

    // 7. 保存ボタンの処理
    function updateAll() {
        const allData = grid.data.serialize().map(item => {
            return {
                ...item,
                // parentが0や空文字ならnullとして送信する
                parent: (item.parent === 0 || item.parent === "0" || item.parent === "") ? null : item.parent
            };
        });

    if (allData.length === 0) return;


        fetch("/task/bulk_sync/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCookie('csrftoken')
            },
            body: JSON.stringify(allData)
        })
        .then(res => {
            if (!res.ok) throw res;
            return res.json();
        })
        .then(result => {
            dhx.message({ text: "一括保存を完了しました", css: "dhx_widget--bg_success" });

            // サーバー側で採番されたIDなどを含む最新データでグリッドを更新
            grid.data.removeAll();
            grid.data.parse(result);
        })
        .catch(err => {
            dhx.message({ text: "保存失敗: 入力内容を確認してください", css: "dhx_widget--bg_danger" });
        });
    }
