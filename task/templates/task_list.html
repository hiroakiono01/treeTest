        // --- Gridの初期化 ---

            eventHandlers: {

                }

            // autoEmptyRow: true

        // ワンクリックでエディタを開く　https://docs.dhtmlx.com/suite/grid/configuration/#opening-editor-with-one-click
        grid.events.on("cellClick", function (row, column) {

            grid.editCell(row.id, column.id);

        });

        // ---　コンテキストメニューの処理 ---
        rowMenu.events.on("click", id => {
            const row = grid.selection.getCell()?.row;
            const rowIndex = grid.data.getIndex(row.id);
            switch (id) {
                case "insertRowAbove":
                    grid.data.add({
                        estimate_no: estimateNo
                    }, rowIndex);
                    break;
                case "insertRowBelow":
                    grid.data.add({
                        estimate_no: estimateNo
                    }, rowIndex + 1);
                    break;
                case "clearRow":
                    grid.data.update(row.id, {
                        property: "",
                        status: "",
                        client: "",
                        startDate: "",
                        endDate: ""
                    });
                    break;
                case "deleteRow":
                    deleteRow(row.id);
                    // grid.data.remove(row.id);
                    break;

        // --- 新規作成のウインドウを表示する ---

            const newRowData = {
                //id: dhx.uid(),          // DHTMLXの機能で一意のIDを生成
                estimate_no: estimateNo, // ★ここにセットしたい番号を指定
                task_name: "新規タスク",  // 初期表示名（任意）
                parent: null            // 親階層（任意）
            };

            // 2. グリッドのデータストアに直接追加
            grid.data.add(newRowData);

            // 3. (オプション) 追加した行を自動でフォーカスしてスクロール
            grid.selection.setCell(newRowData.id);
        }
        // --- 行を右クリックでコンテキストメニューを表示する ---
        grid.events.on("cellRightClick", (row, column, event) => {
            event.preventDefault();
            grid.selection.setCell(row, column);
            rowMenu.showAt(event.target);
        });

        function getPriorityTemplate(value) {
            if (!value) return;
            let status = "dhx-demo_grid-status--suspended";
            if (value === "Completed") status = "dhx-demo_grid-status--completed";
            if (value === "In progress") status = "dhx-demo_grid-status--in-progress";
            return `
            <div class='dhx-demo_grid-status ${status}'>
                <div class='dhx-demo_grid-status-indicator'></div>
                <span class='dhx-demo_grid-status-text'>${value}</span>
            </div>
        `
        }

        function collapseAll() {
            grid.collapseAll();

        //         level = (grid.data.getItem(item.parent).$level || 0) + 1;
        //     }

        // });

        // --- Unit一覧を取得してGridのプルダウンに反映 ---
        // const combobox = new dhx.Combobox("combobox",);
        const unitFields = ["budget_unit_display", "unit_display"];
        fetch("/api/unit-options/")
            .then(res => res.json())
            .then(data => {
                /// 1. Suite 9 の Grid が解釈できる形式に整形-->
                // value ではなく id を使うのが一般的です-->
                const formattedOptions = data.units.map(u => ({
                    id: String(u.value),        // DjangoのID（値）
                    value: u.content // ★ここを 'content' に変換する
                }));
                // 先頭に「空欄」の選択肢を追加する
                // formattedOptions.unshift({ value: "", content: "" });
                // フォームのアイテムに反映
                //form.getItem("unit_name").setOptions(formattedOptions);

                // 2. Grid のカラムに適用
                unitFields.forEach(fieldId => {
                    const column = grid.getColumn(fieldId);
                    if (column) {
                        column.options = formattedOptions;
                    }
                });
                // 重要：ループの後に再描画を実行
                grid.paint();
            })
            .catch(err => console.error("データ取得失敗:", err));

        // // オプション反映後に値をセット

        const pathSegments = window.location.pathname.split('/');
        const estimateNo = pathSegments[pathSegments.length - 1] || pathSegments[pathSegments.length - 2];
        const dataset = new dhx.TreeCollection()

        fetch(`/task/lists/${estimateNo}/`, {

        const rawData = grid.data.serialize();
        // 7. 保存ボタンの処理
        function updateAll() {
            const allData = grid.data.serialize();

            if (allData.length === 0) return;


            fetch("/task/bulk_sync/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie('csrftoken')
                },
                body: JSON.stringify(allData)
            })
                .then(res => {
                    if (!res.ok) throw res;
                    return res.json();
                })
                .then(result => {
                    dhx.message({ text: "一括保存を完了しました", css: "dhx_widget--bg_success", expire: 3000, });

                    // サーバー側で採番されたIDなどを含む最新データでグリッドを更新
                    grid.data.removeAll();
                    grid.data.parse(result);
                })
                .catch(err => {
                    dhx.message({ text: "保存失敗: 入力内容を確認してください", css: "dhx_widget--bg_danger" });
                });
        }



        // 8. 削除処理
        // 削除ボタンの即時実行
        function deleteRow(rowId) {
            if (confirm("即時に削除しますか？")) {
                // サーバーへ削除リクエスト
                fetch(`/task/detail/${rowId}/`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')  // ここを追加
                    }
                })
                    .then(res => {
                        if (!res.ok) {
                            return res.json().then(err => { throw err; });
                        }
                        return res.json();
                    })
                    .then(result => {
                        grid.data.load(`/task/lists/${estimateNo}/`).then(() => {
                            dhx.message({
                                text: "削除しました",
                                css: "dhx_widget--bg_success",
                                expire: 3000
                            });
                        });
                    })
                    .catch(err => {
                        const errorMsg = err.detail || err.message || "削除に失敗しました";
                        dhx.message({
                            text: errorMsg,
                            css: "dhx_widget--bg_danger", // 赤いトースト
                            expire: 6000
                        });

                    });
