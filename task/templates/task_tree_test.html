<script>
    // 1. --- ツールバーの処理 ---
    // 1.1 ツールバー設定（Unitの時と同じ構成）
    const toolbar = new dhx.Toolbar("toolbar_container", { css: "dhx_toolbar--bordered" });
    toolbar.data.add([
        { id: "add", type: "button", value: "新規追加", icon: "mi-plus", color: "primary" },
    ]);
    // 1.2. ツールバーのクリックイベント
    toolbar.events.on("click", function(id) {
        if (id === "add") {
            addRow(); // 前に作った関数を呼ぶ
        }
    })

    // 2. --- モーダルウインドウの準備 ---
    //  2.1 ウィンドウとフォームの準備
    const dhxWindow = new dhx.Window({
        width: 400,
        height: 400,
        title: "新規",
        modal: true
    });
    // 2.2 フォームの準備
    const form = new dhx.Form(null, {
        rows: [
            { type: "input", name: "id", hidden: true }, // 見えないが値は保持される
            {
                name: "estimate_no",
                type: "input",
                label: "摘要",
                required: true
            },
            {
                type: "button",
                name: "save",
                text: "保存",
                view: "flat",
                color: "primary"
            }
        ]
    });
    dhxWindow.attach(form);



    // 4. DRFからデータの読み込む（Django の API から取得する場合）
    const dataset = new dhx.TreeCollection();
    fetch(`/task/tasks_test/`, {
        headers: {'Accept': 'application/json' }
        })
        .then(response => response.json())
        .then(data => {
            console.log("--- Data Check Start ---");
            console.log("データの型:", typeof data);
            console.log("データの生中身:", data);

            if (Array.isArray(data)) {
                data.forEach((item, index) => {
                    if (item.data) {
                        console.log(`インデックス ${index} (ID: ${item.id}) に子要素 'data' を発見:`, item.data);
                    }
                });
            } else {
                console.error("エラー: データが配列形式ではありません。");
            }
            console.log("--- Data Check End ---");




            grid.data.parse(data);
            //grid.data.load("/task/tasks_test/");
            // grid.expandAll();
        });
        //.catch(error => console.error("Error:", error));



    // 5. Gridの初期化
    const grid = new dhx.Grid("grid_container", {
        type: "tree",
        columns: [
            { id: "id", header: [{ text: "ID" }], hidden: true , isTreeColumn: true },
            {
                id: "task_name",
                header: [{ text: "名称" , align: "center"}],
                //isTreeColumn: true, // この列に 展開/折りたたみ アイコンを表示
                gravity: 1.5 },
            { id: "material_dimensions", header: [{ text: "材質・寸法" , align: "center"}], },
            {
                id: "budget_quantity",
                header: [{ text: "予算数量", align: "center"}],
                type: "number",
                numberMask: { maxDecLength: 2 }
            },
            {
                id: "budget_unit",
                header: [{ text: "予算単位", align: "center"}],
            },
            {
                id: "budget_price",
                header: [{ text: "予算単価", align: "center"}],
                type: "number",
                numberMask: { maxDecLength: 2 }
            },
            {
                id: "budget_amount",
                header: [{ text: "予算金額", align: "center"}],
                type: "number" ,
            },
            {
                id: "markup_rate",
                header: [{ text: "掛率", align: "center"}],
                type: "number" ,
            },
            {
                id: "quantity",
                header: [{ text: "見積数量", align: "center"}],
                type: "number",
                numberMask: { maxDecLength: 2 }
            },
            {
                id: "unit",
                header: [{ text: "見積単位", align: "center"}],
            },
            {
                id: "price",
                header: [{ text: "見積単価", align: "center"}],
                type: "number",
                numberMask: { maxDecLength: 2 }
            },
            {
                id: "amount",
                header: [{ text: "見積金額", align: "center"}],
                type: "number" ,
            },
            {
                id: "parent", header: [{ text: "parent"}],
            },
            {
                id: "sort_order", header: [{ text: "sort_order"}]
            },
            {
                id: "action",
                header: [{ text: "修正" , align: "center"}],
                align: "center",
                width: 80,
                htmlEnable: true,
                template: () => "<button class='dxi dxi-pencil'>修正</button>"
            },
            { id: "delete", header: [{ text: "削除" , align: "center"}], align: "center",  width: 80, htmlEnable: true,
            template: () => "<button class='dxi dxi-delete' >削除</button>"
            }
        ],
        autoWidth: true,
       // rootParent: null

    });
    // Grid.data.pase(dataset); // 作成した DataCollection を直接紐付ける

    // 6. --- イベント制御 ---

    // 6.1 新規作成のウインドウを表示する
    function addRow() {
        if (form) {
            form.clear({});
            }
        dhxWindow.header.data.update("title", { value: "新規登録" });
        dhxWindow.setPosition(100, 50);
        dhxWindow.paint();
        dhxWindow.show();
    }

    // 6.2 グリッド内の「編集」ボタンクリック時
    grid.events.on("cellClick", (row, col) => {
        if (col.id === "action") {
            form.setValue(row); // 選択した行のデータをフォームにセット
            dhxWindow.header.data.update("title", { value: "編集"});
            dhxWindow.paint();
            dhxWindow.show();
        }
    });

    // 7. 保存ボタンの処理
    form.getItem("save").events.on("click", () => {

        const formData = form.getValue();
        const isNew = !formData.id || formData.id === "";

        const url = isNew ? "/unit/units/" : `/unit/units/${formData.id}/`;
        const method = isNew ? "POST" : "PUT";

        // Djangoへ送信
        fetch(url, {
            method: method,
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCookie('csrftoken') // DjangoのCSRF対策
            },
            body: JSON.stringify(formData)
        })
        .then(res => {
            if(!res.ok) {
                return res.json().then(err => { throw err; });
            }
            return res.json();
        })
        .then(result => {

            // 3. 成功時の処理（DRFは成功時にオブジェクトを返す）
            dhx.message({
                text: isNew ? "追加されました" : "更新されました",
                css: "dhx_widget--bg_success",
                expire: 3000
            });
            dhxWindow.hide();

            grid.data.removeAll();
            fetch("/unit/units/")
                .then(response => response.json())
                .then(data => {
                    grid.data.parse(data);
                });

        })
        .catch(err => {
            console.error("Error details:", err);
            let mainMessage = "入力内容を確認してください";
            // サーバーからのバリデーションエラーがある場合
            if (typeof err === "object" && err !== null) {
                for (const fieldId in err) {
                    const item = form.getItem(fieldId);
                    if (item) {
                        const errorMsg = Array.isArray(err[fieldId]) ? err[fieldId][0] : err[fieldId];
                        item.setProperties({
                            error: true,
                            errorMessage: errorMsg
                        });
                        mainMessage = errorMsg;
                    }
                }
            } else {
                // 通信断絶などの致命的エラー
                mainMessage = "サーバーとの通信に失敗しました";
            }
            // 2. トースト（メッセージ）を表示
            dhx.message({
                text: mainMessage,
                css: "dhx_widget--bg_danger", // Suite 9 の赤い背景
                expire: 6000,                // 6秒間表示
                node: document.body
            });
        });
    });

    // 8. 削除処理
    // 削除ボタンの即時実行
    grid.events.on("cellClick", (row, col) => {
        if (col.id === "delete") {
            if (confirm("即時に削除しますか？")) {
                // サーバーへ削除リクエスト
                fetch(`/unit/units/${row.id}/`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')  // ここを追加
                        }
                    })
                .then(res => {
                    if (!res.ok) {
                        return res.json().then(err => { throw err; });
                    }
                    return res.json();
                })
                .then(result => {
                    grid.data.remove(row.id);
                    dhx.message({
                        text: "削除しました",
                        css: "dhx_widget--bg_success",
                        expire: 3000

                    });

                })
                .catch(err => {
                    const errorMsg = err.detail || err.message || "削除に失敗しました";
                    dhx.message({
                        text: errorMsg,
                        css: "dhx_widget--bg_danger", // 赤いトースト
                        expire: 6000
                    });

                });

            }
        }
    });

</script>
</body>
</html>
