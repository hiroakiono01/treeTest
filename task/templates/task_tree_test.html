{% extends 'base.html' %}

{% block head %}
<title>見積明細</title>
{% endblock %}

{% block contents %}

<body>
<div id="layout-main-container" style="margin-top: 6rem;--layout-max-width: 1800px;"></div>
<script>
    // ==========================================
    // 1.  VARIABLES  (変数の宣言とデータの準備）
    // ==========================================

    const layout = new dhx.Layout("layout-main-container", MySharedLayoutConfig);
    layout.getCell("sidebar_container").hide();
    let treeGrid = null;
    const columns = [
        {id: "id", header: [{text: "ID"}], hidden: false, isTreeColumn: true},
        {id: "estimate_no_display", header: [{text: "工事名称"}], hidden: true,},
        {id: "estimate_no", header: [{text: "工事番号"}], hidden: true,},
        {id: "task_name", width: 200, header: [{text: "名称", align: "center"}], footer: [{text: "合計"}]},
        {id: "material_dimensions", width: 200, header: [{text: "材質・寸法", align: "center"}],},
        {
            id: "calcu_cls",
            width: 100,
            header: [{text: "計算区分", align: "center"}],
            editable: false,
            editorType: "select", // セレクトボックス形式
            options: [
                {id: "0", value: "加算対象"},
                {id: "1", value: "加算しない"},
                {id: "2", value: "税抜合計"},
                {id: "3", value: "消費税"}
            ],
            // 💡 セルにカスタムCSSクラスを適用するための関数
            htmlEnable: true,
            css: function (value, row, col) {
                // 区分が "2" または "3" の場合はグレーにするクラスを返す
                if (row.calcu_cls === "2" || row.calcu_cls === "3") {
                    return "cell-disabled";
                }
                return "";
            }
        },
        {id: "budget_quantity", header: [{text: "予算数量", align: "center"}], type: "string", numberMask: {maxDecLength: 2}, align: "right"},
        {id: "budget_unit_display", header: [{text: "予算単位", align: "center"}], editorType: "combobox", width: 100, options: [], align: "center"},
        {id: "budget_price", header: [{text: "予算単価", align: "center"}], type: "string", numberMask: {maxDecLength: 2}, align: "right"},
        {
            id: "budget_amount",
            header: [{text: "予算金額", align: "center"}],
            footer: [{text: ({sum}) => sum, align: "right"}],
            summary: "sum",
            type: "string",
            numberMask: {customFormat: "#,##0"},
            align: "right"
        },
        {id: "markup_rate", width: 70, header: [{text: "掛率", align: "center"}], align: "right"},
        {id: "quantity", header: [{text: "見積数量", align: "center"}], type: "string", numberMask: {maxDecLength: 2}, align: "right"},
        {id: "unit_display", header: [{text: "見積単位", align: "center"}], editorType: "combobox", width: 100, options: [], align: "center"},
        {id: "price", header: [{text: "見積単価", align: "center"}], type: "string", numberMask: {maxDecLength: 2}, align: "right"},

        {
            id: "amount",
            header: [{text: "見積金額", align: "center"}], type: "string",

            numberMask: {groupSeparator: ","},
            footer: [{text: ({sum}) => sum, align: "right"}],
            summary: "sum",
            numberMask: {customFormat: "#,##0"}, align: "right",
        },
        {id: "parent", header: [{text: "parent"}], hidden: true},
        {id: "sort_order", header: [{text: "sort_order"}], hidden: true},
        {
            id: "actions",
            header: [{text: "Actions", tooltip: true, align: "center"}],
            mark: () => "dhx-demo_color--gray",
            template: () => `<i class="dxi dxi-dots-vertical row-menu"></i>`,
            align: "center",
            tooltip: false,
            editable: false,
            sortable: false,
            htmlEnable: true,
        }
    ];
    // ===================================================
    // 2. INITIALIZE UI COMPONENTS （画面パーツの組み立て）
    // ===================================================


    // const dataset = new dhx.TreeCollection()

    treeGrid = new dhx.Grid(null, {
        type: "tree",
        columns,
        rootParent: null,
        //data: dataset // 階層構造を持つデータ
    });

    // 💡 修正した「grid_cell」にGridをアタッチ
    layout.getCell("grid_cell").attach(treeGrid);

    // Windowと通常Gridのインスタンス保持用変数
    let editWindow = null;
    let editGrid = null;
    let currentParentId = null;

    // ===================================================
    // 3. DATA LOADING （データ通信・サーバーとのやり取り）
    // ===================================================
    let estimateNo = 1
    // 1. Unit一覧を取得してGridのプルダウンに反映 ---

    // const unitFields = ["budget_unit"]
    // fetch("/api/unit-options/")
    //     .then(res => res.json())
    //     .then(data => {
    //         const formattedUnits = data.units.map(item => ({
    //             id: Number(item.id),
    //             value: item.value
    //         }));
    //
    //         // ★ 先頭に「未選択用」の空の選択肢を差し込む
    //         formattedUnits.unshift({id: null, value: "（選択解除）"}); // 「未選択」などの文字にしても親切です
    //
    //         const currentColumns = editGrid.config.columns.map(col => {
    //             if (unitFields.includes(col.id)) {
    //                 return {...col, options: formattedUnits};
    //             }
    //             console.log("col", col)
    //             return col;
    //         });
    //
    //         editGrid.setColumns(currentColumns);
    //         editGrid.paint();
    //
    //     })
    //     .catch(err => console.error("unitデータ取得失敗:", err));

    fetch(`/task/lists/${estimateNo}/`, {
        headers: {'Accept': 'application/json'}
    })
        .then(response => response.json())
        .then(data => {
            treeGrid.data.parse(data)
            // ここでloadイベントが発生し計算が走る
            //treeGrid.collapseAll();
        });

    // ==========================================
    // 2. TreeGridのセルクリックイベント
    // ==========================================
    // ==========================================
    // 2. TreeGridのセルクリックイベント（ここを丸ごと差し替えてください）
    // ==========================================
    treeGrid.events.on("cellClick", function (row, col, e) {
        currentParentId = row.id;

        // 選択された行の直下にある子要素（配列）を取得
        const childItems = treeGrid.data.getItems(currentParentId);

        // 既にWindowが開いている場合は重複防止のため一度破棄する
        if (editWindow) {
            editWindow.destructor();
        }

        // --- ① ウィンドウ（Window）の初期化 ---
        editWindow = new dhx.Window({
            title: `「${row.task_name || row.id}」の子階層を編集`,
            width: 1800,
            height: 450,
            modal: true,    // 背景をロック
            closable: true, // 右上の×ボタン
            movable: true,  // ドラッグ可能
            resizable: true // サイズ変更可能
        });

        // --- ② ウィンドウ内部を「上（ボタン）」「下（Grid）」の2行に分割するレイアウトを作る ---
        // HTML文字列（<div id="...">）を使わず、DHTMLXの機能で枠を組むためエラーが起きません
        const layout = new dhx.Layout(null, {
            rows: [
                {id: "toolbar_cell", height: "auto"}, // 上段：ボタン用の領域
                {id: "grid_cell"}                     // 下段：通常Grid用の領域
            ]
        });

        // Windowにレイアウトを結合し、表示
        editWindow.attach(layout);
        editWindow.show();

        // --- ③ 上段に Toolbar（ボタン群）を配置 ---
        const toolbar = new dhx.Toolbar(null, {
            css: "dhx_widget--bg-white",
            data: [
                {id: "add", value: "同じレベルに項目追加", type: "button", circle: true},
                {id: "save", value: "変更を保存", type: "button", color: "primary"}
            ]
        });
        layout.getCell("toolbar_cell").attach(toolbar);


        // --- ④ 下段に 編集用の通常Grid を配置 ---
        editGrid = new dhx.Grid(null, {
            columns: [
                {id: "id", header: [{text: "ID"}], hidden: false},
                {id: "estimate_no_display", header: [{text: "工事名称"}], hidden: true,},
                {id: "estimate_no", header: [{text: "工事番号"}], editable: true},
                {id: "task_name", header: [{text: "名称"}], editable: true, width: 200, footer: [{text: "合計"}]},
                {id: "material_dimensions", width: 200, header: [{text: "材質・寸法", align: "center"}], editable: true,},
                {
                    id: "calcu_cls",
                    width: 100,
                    header: [{text: "計算区分", align: "center"}],
                    editable: true,
                    editorType: "select", // セレクトボックス形式
                    options: [
                        {id: "0", value: "加算対象"},
                        {id: "1", value: "加算しない"},
                        {id: "2", value: "税抜合計"},
                        {id: "3", value: "消費税"}
                    ],
                    // 💡 セルにカスタムCSSクラスを適用するための関数
                    htmlEnable: true,
                    css: function (value, row, col) {
                        // 区分が "2" または "3" の場合はグレーにするクラスを返す
                        if (row.calcu_cls === "2" || row.calcu_cls === "3") {
                            return "cell-disabled";
                        }
                        return "";
                    }
                },
                {id: "budget_quantity", header: [{text: "予算数量", align: "center"}], type: "string", numberMask: {maxDecLength: 2}, align: "right", editable: true},
                {
                    id: "budget_unit",
                    header: [{text: "予算単位", align: "center"}],
                    editorType: "combobox",
                    width: 100,
                    options: [],
                    align: "center",
                    editable: true
                },
                {id: "budget_price", header: [{text: "予算単価", align: "center"}], type: "number", numberMask: {maxDecLength: 2}},
                {id: "budget_amount", header: [{text: "予算金額", align: "center"}], type: "number", footer: [{text: ({sum}) => sum}], summary: "sum", numberMask: {customFormat: "#,##0"},},
                {id: "markup_rate", width: 70, header: [{text: "掛率", align: "center"}], type: "number",},
                {id: "quantity", header: [{text: "見積数量", align: "center"}], type: "number", numberMask: {maxDecLength: 2}},
                {id: "unit", header: [{text: "見積単位", align: "center"}], editorType: "combobox", width: 100, options: []},
                {id: "price", header: [{text: "見積単価", align: "center"}], type: "number", numberMask: {maxDecLength: 2}},
                {
                    id: "amount",
                    header: [{text: "見積金額", align: "center"}],
                    type: "number",
                    numberMask: {groupSeparator: ","},
                    footer: [{text: ({sum}) => sum}],
                    summary: "sum",
                    numberMask: {customFormat: "#,##0"},
                },
                {id: "parent", header: [{text: "parent"}], hidden: true},
                {id: "sort_order", header: [{text: "sort_order"}], hidden: true},
                {
                    id: "actions",
                    header: [{text: "Actions", tooltip: true, align: "center"}],
                    mark: () => "dhx-demo_color--gray",
                    template: () => `<i class="dxi dxi-dots-vertical row-menu"></i>`,
                    align: "center",
                    tooltip: false, editable: false, sortable: false, htmlEnable: true,
                }
            ],
            // 元のツリーデータを汚さないように複製してロード
            data: JSON.parse(JSON.stringify(childItems))
        });
        const unitFields = ["budget_unit", "unit"]
        fetch("/api/unit-options/")
            .then(res => res.json())
            .then(data => {
                const formattedUnits = data.units.map(item => ({
                    id: Number(item.id),
                    value: item.value
                }));

                // ★ 先頭に「未選択用」の空の選択肢を差し込む
                formattedUnits.unshift({id: null, value: "（選択解除）"}); // 「未選択」などの文字にしても親切です

                const currentColumns = editGrid.config.columns.map(col => {
                    if (unitFields.includes(col.id)) {
                        return {...col, options: formattedUnits};
                    }
                    console.log("col", col)
                    return col;
                });

                editGrid.setColumns(currentColumns);
                editGrid.paint();

            })
            .catch(err => console.error("unitデータ取得失敗:", err));
        layout.getCell("grid_cell").attach(editGrid);

        // ==========================================
        // 3. ボタンイベントの実装（DHTMLX Toolbarのイベント機能を使用）
        // ==========================================
        // ※注意: 従来の document.getElementById().onclick 方式を完全に廃止しました。
        // これにより「Cannot set properties of null (setting 'onclick')」は100%発生しなくなります。
        toolbar.events.on("click", function (id) {
            if (id === "add") {
                // 【同じレベルに項目追加】ボタンが押されたとき
                const newId = "new_item_" + Date.now();
                editGrid.data.add({
                    id: newId,
                    task_name: "新しい項目",
                    estimate_no: row.estimate_no || ""
                });
            } else if (id === "save") {
                // 【変更を保存】ボタンが押されたとき
                // 1. TreeGrid側の古い子要素を一度すべて削除
                const oldChildren = treeGrid.data.getItems(currentParentId);
                oldChildren.forEach(function (child) {
                    treeGrid.data.remove(child.id);
                });

                // 2. 通常Gridから最新の編集後データを取得
                const updatedData = editGrid.data.serialize();

                // 3. 取得したデータをTreeGridの指定した親（currentParentId）の直下に再挿入
                updatedData.forEach(function (item) {
                    treeGrid.data.add(item, -1, currentParentId);
                });

                // 4. ウィンドウを閉じてメモリを解放
                editWindow.hide();
                editWindow.destructor();
                editWindow = null;
            }
        });
    });
</script>
</body>
{% endblock %}
