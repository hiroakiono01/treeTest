        function calculateTreeTotal(item) {
            const children = grid.data.getDirectKids(item.id);
            let totalValue = 0;

            if (children.length > 0) {
                // 子要素がある場合子の合計を算出
                let sum = 0;
                children.forEach(child => {
                    const childItem = grid.data.getItem(childId);
                    sum += calculateTreeTotal(childItem);
                });

                totalValue = sum;
            } else {
                // 子要素がない場合数量 * 単価 を返す
                const qty = parseFloat(item.budget_quantity) || 0;
                const price = parseFloat(item.budget_price) || 0;
                totalValue = qty * price;
            }

            // 変更がある場合のみ更新（無限ループ防止）
            if (item.budget_amount !== totalValue) {
                teeGrid.data.update(item.id, { budget_amount: totalValue });
            }
            return totalValue;
        }
