                    required: true,

                    required: true,

                        {id: "1", value: "未契約先"}
                    ],

        // PAGINATION: 2.3 ページネーション ---

        const pagination = new dhx.Pagination("pagination", paginationConfig);
        //「pagination_cell」にPaginationをアタッチ

        // FORM: 3. --- フォームの準備 ---

                {

                        },
                        {

                        },
                    ]
                },
                {
                    cols: [
                        {
                            name: "customer_phone_no",
                            type: "input",

                        },

                {

                    ]
                },
                {

                    rows: [
                        {
                            align: "between",
                            cols: [
                                {
                                    type: "fieldset",
                                    name: "personal",
                                    label: "== 入金情報 ==",
                                    labelAlignment: "center",
                                    width: "71%",
                                    rows: [

                                        {

                                                {

                                                {

                                                {

                                        },

                                            labelPosition: "left",  // ラベルを左側に配置
                                            labelWidth: "70px",    // ラベルの横幅を固定

                                            options: {

                                                    {value: "2", text: "民間"}
                                                ],

                                        },
                                        {

                                            label: "利用状況",
                                            required: false,
                                            labelPosition: "left",  // ラベルを左側に配置
                                            labelWidth: "70px",    // ラベルの横幅を固定
                                            css: "custom-radio-align",
                                            options: {
                                                cols: [
                                                    {value: "0", text: "利用中"},
                                                    {value: "9", text: "停止"}
                                                ]
                                            },
                                            //: "30%"
                                        },
                                        {
                                            name: "client_flg",
                                            type: "radioGroup",
                                            label: "顧客区分",
                                            required: false,
                                            labelPosition: "left",  // ラベルを左側に配置
                                            labelWidth: "70px",    // ラベルの横幅を固定
                                            css: "custom-radio-align",
                                            options: {
                                                cols: [
                                                    {value: "0", text: "既契約先"},
                                                    {value: "1", text: "未契約先"}
                                                ]
                                            },
                                            //width: "30%"
                                        },
                                    ]

                            ]
                        }
                    ]
                },
                {
                    cols: [
                        {type: "input", name: "id", required: false, hidden: true},                  // 見えないが値は保持される                },
                        {
                            type: "button",
                            name: "save",
                            text: "保存",
                            view: "flat",
                            color: "primary"
                        }
                    ]
                },
            ]
        })
        ;
        // ★外部ファイルの共通関数を呼び出す（これだけでEnter移動が有効になります）
        enableFormEnterNavigation(form);
        dhxWindow.attach(form);

        // ==========================================
        // ★ 追加：移動・縮小時のクリック座標ズレ対策
        // ==========================================

        // 1. ウインドウのドラッグ移動が終わった瞬間に再描画
        dhxWindow.events.on("moveEnd", function () {
            dhxWindow.paint(); // ウインドウ自体の再描画
            if (typeof form.paint === "function") {
                form.paint();  // 内部フォームのサイズ・クリック領域を再計算
            }
        });

        // 2. ブラウザ画面を縮小・リサイズした瞬間に再描画
        window.addEventListener("resize", function () {
            if (dhxWindow.isVisible()) {
                dhxWindow.paint();
                if (typeof form.paint === "function") {
                    form.paint();
                }
            }
        });
        // =======================================================
        //  3. DATA LOADING （データ通信・サーバーとのやり取り）
        // =======================================================

        // CONNECT: 3.1 DRFからデータの読み込み
        fetch("/api/get_current_client/")
            .then(res => res.json())
            .then(data => {
                client_id = data['current-client'].client_id;
                const client_no = data['current-client']['client_no'];
                const client_name = data['current-client']['client_name'];

                // 💡 今回追加した「ヘッダー」の要素に文字をセット
                const headerNoElem = document.getElementById("header_client_no");
                const headerNameElem = document.getElementById("header_client_name");
                const headerReportTitleElem = document.getElementById("header_report_title");
                if (headerNoElem) headerNoElem.textContent = client_no ? `[${client_no}]` : '';
                if (headerNameElem) headerNameElem.textContent = client_name || '';
                if (headerReportTitleElem) headerReportTitleElem.textContent = "得意先マスタ保守";


                // 💡 フォームの初期化が終わっているので、安全に初期値をセットできる
                if (client_id && form) {
                    form.setValue({client: String(client_id)});
                }

                // 💡 1つ目のデータが取れたので、2つ目のfetch（Grid用データ）を呼ぶ
                if (client_id && grid) {
                    fetch(`/customer/lists/${client_id}/`)
                        .then(response => response.json())
                        .then(data => {
                            grid.data.parse(data);
                        })
                        .catch(err => console.error("顧客データ取得失敗:", err));
                }
            })
            .catch(err => console.error("current clientデータ取得失敗:", err));


        //Grid.data.pase(dataset); // 作成した DataCollection を直接紐付ける
        // =======================================================
        //  4. EVENTS （ボタン操作・関数）
        // =======================================================

        // 6. --- イベントの処理 ---
        // 6.1 新規作成のウインドウを表示する
        function addRow() {
            if (form) {
                form.clear({}); // フォームをクリア
                // 💡 新規作成時の初期値をセットするオブジェクトを作成
                form.setValue({
                        use_flg: String("0")
                    }
                )

                // 💡 4. 保存しておいた変数をここで安全に使う！
                if (client_id) {
                    form.setValue({
                        client: String(client_id) // フォームの「name: "client"」にセット
                    });
                    // console.log("Formにセットしました:", client_id);
                } else {
                    // console.warn("まだclient_idのデータが届いていません。");
                }
            }
            dhxWindow.header.data.update("title", {value: "新規登録"});
            dhxWindow.setPosition(100, 50);
            dhxWindow.paint();
            dhxWindow.show();
        }

        // 6.2 グリッド内の「編集」ボタンクリック時
        grid.events.on("cellClick", (row, col) => {
            if (col.id === "action") {
                form.setValue(row); // 選択した行のデータをフォームにセット
                dhxWindow.header.data.update("title", {value: "編集"});
                dhxWindow.paint();
                dhxWindow.show();
            }
        });


        // 6.3. 保存ボタンの処理
        // UPDATE: 6.3. 保存ボタンの処理
        form.getItem("save").events.on("click", async () => {

            const info = form.getValue();

            let customerNo = String(info.customer_no || "").trim();
            if (customerNo !== "") {
                // 数字以外が含まれているかチェック
                if (!/^\d+$/.test(customerNo)) {
                    // 数字以外が含まれている場合は、フォームにエラーを表示して処理を中断
                    form.getItem("customer_no").setProperties({
                        errorMessage: "得意先管理番号は数字のみで入力してください。",
                        validation: false
                    });
                    return;

                } else {
                    // 数字のみなら8桁に0埋めしてグリッドのデータを更新
                    const paddedNo = customerNo.padStart(8, "0");
                    form.setValue({customer_no: paddedNo});

                    form.getItem("customer_no").setProperties({
                        errorMessage: "",
                        validation: true
                    });
                }
            }


            // 6.3.1 バリデーションを実行
            if (!form.validate()) {
                const info = form.getValue();
                // 【修正ポイント】info[itemId] の中身（値）が空のものを探すように変更
                const firstErrorId = Object.keys(info).find(itemId => !info[itemId] || String(info[itemId]).trim() === "");

                if (firstErrorId) {
                    // DHTMLX Suite 9の正しいフォーカス方法に修正
                    form.setFocus(firstErrorId);
                }
                return;

            }

            // 6.3.2. バリデーション成功後に値を取得
            const formData = form.getValue();
            // console.log("送信データ:", formData);

            // 　6.3.3 新規か更新かの判定
            const isNew = !formData.id || formData.id === "";
            const url = isNew ? `/customer/lists/${client_id}/` : `/customer/detail/${formData.id}/`;
            const method = isNew ? "POST" : "PUT"; // 新規時はPOST、更新時はPUT

            // 6.3.4. 通信開始
            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCookie('csrftoken')
                    },
                    body: JSON.stringify(formData)
                });

                // DRFのバリデーションエラー(400)などをキャッチ
                if (!res.ok) {
                    console.log('res', res)
                    const err = await res.json();
                    throw err;
                }


                // 💡 成功メッセージの表示
                dhx.message({
                    text: isNew ? "追加されました" : "更新されました",
                    css: "dhx_widget--bg_success",
                    expire: 3000
                });

                dhxWindow.hide();

                // 💡 グリッドの再読み込み（async/awaitでスッキリ並列・直列処理）
                grid.data.removeAll();
                const listRes = await fetch(`/customer/lists/${client_id}/`);

                if (listRes.ok) {
                    const data = await listRes.json();
                    if (data) grid.data.parse(data);
                }

            } catch (err) {
                // console.error(err);

                let serverErrorField = null;

                if (err && typeof err === 'object') {
                    const firstKey = Object.keys(err)[0];

                    // サーバーから返ってきたエラー項目名（field_name）を記録
                    if (firstKey && firstKey !== 'detail') {
                        serverErrorField = firstKey;
                    }
                    // 1. サーバーから返ってきた元のメッセージを取得
                    let serverMsg = Array.isArray(err[firstKey]) ? err[firstKey][0] : (err.detail || msg);
                    // 2. エラーが発生した項目のフォーム定義から「ラベル名」を動的に取得
                    const itemLabel = form.getItem(firstKey)?.config?.label || "この項目";
                    // 3. 「この項目が」の部分を、取得した実際のラベル名に置き換える
                    msg = serverMsg.replace("この項目が", `${itemLabel}が`);
                    console.log('msg', msg, "err", err)
                }

                // 💡 サーバー側のバリデーションエラー項目がある場合、赤枠をセットしてフォーカス
                if (serverErrorField) {
                    const item = form.getItem(serverErrorField);
                    if (item && typeof item.setValidation === "function") {
                        // 強制的にエラーの赤枠をセットし、エラー文言を表示
                        item.setValidation(false, msg);
                        // その項目へ自動でカーソルを移動
                        form.setFocus(serverErrorField);
                    }
                }

                dhx.message({
                    text: msg,
                    css: "dhx_widget--bg_danger",
                    expire: 6000
                });
            }
        })
        ;


        // DELETE: 削除ボタンの即時実行
        grid.events.on("cellClick", (row, col) => {
            if (col.id === "delete") {
                if (confirm("削除しますか？")) {
                    // 6.4.1. サーバー側のデータを削除
                    fetch(`/customer/detail/${row.id}/`, {
                        method: 'DELETE',
                        headers: {
                            'X-CSRFToken': getCookie('csrftoken') // DjangoのCSRF対策
                        }
                    })
                        .then(res => {
                                return res.json().then(data => {
                                    if (!res.ok) {
                                        // 💡 400や404エラーの場合は、サーバーから届いたメッセージ(data.detail)をエラーとして投げる
                                        throw new Error(data.detail || "削除に失敗しました");
                                    }
                                    return data; // 200 OK の場合は次へ
                                });
                            }
                        )
                        .then(() => {
                            // 💡 削除成功時のトースト
                            grid.data.remove(row.id);
                            dhx.message({
                                text: "削除しました",
                                css: "dhx_widget--bg-success", // 💡 ハイフンに修正
                                expire: 3000                    // 💡 delay に修正
                            });
                        })
                        .catch(err => {
                            //let errorMsg = "削除に失敗しました";
                            dhx.message({
                                text: err.message,
                                css: "dhx_message--error",  // 赤いトースト
                                icon: "dxi dxi-delete-forever",
                                expire: 6000
                            });
                        })
                }
            }
        });

        // ===================================================
        // 5. START APPLICATION （実行）
        // ===================================================
        // loadInitialData();
    </script>

</div>
</body>

{% endblock %}
