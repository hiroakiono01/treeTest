{% extends 'base.html' %}
{% block head %}
<title>得意先　一覧表</title>
{% endblock %}

{% block header %}
<div class="my-div-style col-sm mx-auto text-center">
    <h5>得意先一覧表</h5>
</div>
{% endblock %}

{% block contents %}
<style>
    #layout-main-container {
        width: 1000;
    }
</style>

<body>
    <div id="layout-main-container"></div>
    <script>

        /* ===================================================
         * 1. VARIABLES （変数の宣言）
         * =================================================== */
        let client_id = "";
        let grid = null;
        let form = null;
        let toolbar = null;
        let dataset = null;
        const dhxWindow = null;
        // layoutの準備
        const layout = new dhx.Layout("layout-main-container", MySharedLayoutConfig);

        // 1〜30日、末日 の選択肢を自動生成する例
        const closeDateOptions = [
            { value: "", content: "" }
        ];
        for (let i = 1; i <= 28; i++) {
            closeDateOptions.push({ value: String(i), content: `${i}日` });
        }
        closeDateOptions.push({ value: "last", content: "末日" });

        /* ===================================================
         * 2. INITIALIZE UI COMPONENTS （画面パーツの組み立て）
         * =================================================== */

        // TOOLBAR: ツールバーの処理 ---
        toolbar = new dhx.Toolbar("toolbar_container", { css: "dhx_toolbar--bordered" });
        toolbar.data.add([
            { id: "add", type: "button", value: "新規追加", icon: "dxi dxi-plus", color: "primary", circle: true, },
        ]);



        //  FORM: モーダルウインドウの準備 ---
        dataset = new dhx.Window({
            width: 1000,
            height: 1000,
            title: "新規",
            modal: true
        });


        // GRID: dhx.Gridの初期化
        grid = new dhx.Grid("grid_container", {
            columns: [
                {
                    id: "id",
                    header: [{ text: "ID" }],
                    hidden: true,
                },
                {
                    id: "client",
                    width: 100,
                    header: [{ text: "事業者番号", align: "center", rowspan: 2 }],
                    align: "center",
                    htmlEnable: true,
                },
                {
                    id: "customer_no",
                    width: 100,
                    header: [{ text: "得意先管理番号", align: "center" }],
                    align: "center",
                    // editable: true
                },
                {
                    id: "customer_name",
                    width: 300,
                    header: [{ text: "得意先名称", align: "center" }, { content: "inputFilter" }],
                    align: "center",
                    // editable: true
                },
                {
                    id: "customer_phone_no",
                    width: 100,
                    header: [{ text: "電話番号", align: "center" }],
                    align: "center",
                    // editable: true
                },
                {
                    id: "customer_fax_no",
                    width: 100,
                    header: [{ text: "FAX", align: "center" }],
                    align: "center",
                    // editable: true
                },
                {
                    id: "customer_person",
                    width: 100,
                    header: [{ text: "得意先担当者名", align: "center" }, { content: "inputFilter" }],
                    align: "center",
                    // editable: true
                },
                {
                    id: "customer_personal_phone",
                    width: 100,
                    header: [{ text: "携帯電話番号", align: "center" }],
                    align: "center",
                    // editable: true
                },
                {
                    id: "group_cls",
                    editorType: "select",
                    header: [{ text: "グループ", align: "center" }, { content: "selectFilter" }],
                    // editable: false,label: "事業者区分",
                    required: true,
                    options: [
                        { id: "1", value: "官庁" },
                        { id: "2", value: "民間" }
                    ],
                    width: 100
                },
                {
                    id: "action",
                    width: 80,
                    header: [{ text: "修正", align: "center", rowspan: 2 }],
                    align: "center",
                    htmlEnable: true,
                    template: () => "<button class='dxi dxi-pencil'>修正</button>"
                },
                {
                    id: "delete",
                    width: 80,
                    header: [{ text: "削除", align: "center", rowspan: 2 }],
                    align: "center",
                    htmlEnable: true,
                    template: () => "<button class='dxi dxi-delete' >削除</button>"
                }
            ],
            autoWidth: true,
            //rootParent: null
            data: dataset, // 作成した DataCollection を直接紐付ける
        });

        // 💡 修正した「grid_cell」にGridをアタッチ
        layout.getCell("grid_cell").attach(grid);

        // FORM: 3. --- フォームの準備 ---
        form = new dhx.Form(null, {

            rows: [
                {

                    type: "input",
                    name: "id",
                    hidden: true
                    // 見えないが値は保持される
                },
                {
                    name: "client",
                    type: "input",
                    label: "事業者",
                    required: true,
                },
                {
                    cols: [
                        {
                            name: "customer_no",
                            type: "input",
                            label: "得意先管理番号",
                            required: true,
                            width: "20%"
                        },
                        {
                            type: "spacer",
                            width: 20 // 横に20pxの間隔を開ける
                        },
                        {
                            name: "customer_name",
                            type: "input",
                            label: "得意先名称",
                            required: true,
                        },
                    ]
                },

                {
                    cols: [
                        {
                            name: "customer_short_name",
                            type: "input",
                            label: "得意先略称",
                            required: false,
                        },
                        {
                            type: "spacer",
                            width: 20 // 横に20pxの間隔を開ける
                        },
                        {
                            name: "customer_kana",
                            type: "input",
                            label: "検索",
                            required: false,
                        },
                    ]

                },

                {
                    cols: [
                        {
                            name: "customer_zip_code",
                            type: "input",
                            label: "郵便番号",
                            required: false,
                            width: "20%"
                        }
                    ]

                },
                {
                    cols: [
                        {
                            name: "customer_address1",
                            type: "input",
                            label: "住所１",
                            required: false,
                        },
                        {
                            type: "spacer",
                            width: 20 // 横に20pxの間隔を開ける
                        },
                        {
                            name: "customer_address2",
                            type: "input",
                            label: "住所２",
                            required: false,
                        },
                    ]
                },
                {
                    cols: [
                        {
                            name: "customer_phone_no",
                            type: "input",
                            label: "電話番号",
                            required: false,

                        },
                        {
                            type: "spacer",
                            width: 20 // 横に20pxの間隔を開ける
                        },
                        {
                            name: "customer_fax_no",
                            type: "input",
                            label: "FAX",
                            required: false,
                        },
                    ]

                },

                {
                    cols: [
                        {
                            name: "customer_person",
                            type: "input",
                            label: "得意先担当者名",
                            required: false,
                        },
                        {
                            type: "spacer",
                            width: 20 // 横に20pxの間隔を開ける
                        },
                        {
                            name: "customer_personal_phone",
                            type: "input",
                            label: "携帯電話番号",
                            required: false,
                        },
                    ]

                },




                {

                },
                {
                    type: "fieldset",
                    name: "account",
                    label: "Account info",
                    labelAlignment: "center",
                    width: "100%",


                    rows: [
                        {


                            alingn: "between",
                            cols: [
                                {

                                    type: "fieldset",
                                    name: "personal",
                                    label: "Personal info",
                                    width: "60%",

                                    rows: [
                                        {
                                            cols: [

                                                {
                                                    name: "payment_limit_date",
                                                    type: "input",
                                                    label: "請求書提出期限",
                                                    required: false,
                                                },

                                                {
                                                    type: "spacer",
                                                    width: 20 // 横に20pxの間隔を開ける
                                                },
                                                {
                                                    name: "payment_close_date",
                                                    type: "select",
                                                    label: "請求締め日",
                                                    required: false,
                                                    options: closeDateOptions
                                                },
                                                {
                                                    type: "spacer",
                                                    width: 20 // 横に20pxの間隔を開ける
                                                },
                                                {
                                                    name: "payment_sight",
                                                    type: "select",
                                                    label: "請求サイト",
                                                    required: false,
                                                    options: [
                                                        { value: "", content: "" },
                                                        { value: "0", content: "当月" },
                                                        { value: "1", content: "翌月" },
                                                        { value: "2", content: "翌々月" },
                                                    ]
                                                },
                                                {
                                                    type: "spacer",
                                                    width: 20 // 横に20pxの間隔を開ける
                                                },
                                                {
                                                    name: "payment_payday",
                                                    type: "select",
                                                    label: "入金予定日",
                                                    required: false,
                                                    options: closeDateOptions
                                                },
                                            ]

                                        },

                                        {
                                            cols: [
                                                {
                                                    name: "customer_bank",
                                                    type: "input",
                                                    label: "銀行コード",
                                                    required: false,
                                                },
                                                {
                                                    type: "spacer",
                                                    width: 20 // 横に20pxの間隔を開ける
                                                },
                                                {
                                                    name: "customer_branch",
                                                    type: "input",
                                                    label: "支店コード",
                                                    required: false,
                                                }
                                            ]
                                        },
                                        {
                                            cols: [
                                                {
                                                    name: "customer_bank_number",
                                                    type: "input",
                                                    label: "口座番号",
                                                    required: false,
                                                    width: "30%"
                                                },
                                                {
                                                    type: "spacer",
                                                    width: 20 // 横に20pxの間隔を開ける
                                                },
                                                {
                                                    name: "customer_bank_holder",
                                                    type: "input",
                                                    label: "名義人名",
                                                    required: false,
                                                },

                                            ]
                                        },
                                    ]

                                },

                                {
                                    type: "fieldset",
                                    name: "account2",
                                    label: "Account info",
                                    labelAlignment: "center",
                                    width: "50%",

                                    rows: [
                                        {
                                            name: "group_cls",
                                            type: "radioGroup",
                                            label: "グループ",
                                            required: false,
                                            labelPosition: "left",  // ラベルを左側に配置
                                            labelWidth: "120px",    // ラベルの横幅を固定
                                            options: {
                                                cols: [
                                                    { value: "1", text: "官庁" },
                                                    { value: "2", text: "民間" }
                                                ]
                                            },
                                        },

                                        {
                                            name: "use_flg",
                                            type: "radioGroup",
                                            label: "利用状況",
                                            required: false,
                                            labelPosition: "left",  // ラベルを左側に配置
                                            labelWidth: "120px",    // ラベルの横幅を固定
                                            options: {
                                                cols: [
                                                    { value: "0", text: "利用中" },
                                                    { value: "9", text: "停止" }
                                                ]
                                            },
                                        },
                                        {
                                            name: "client_flg",
                                            type: "radioGroup",
                                            label: "顧客区分",
                                            required: false,
                                            labelPosition: "left",  // ラベルを左側に配置
                                            labelWidth: "120px",    // ラベルの横幅を固定
                                            options: {
                                                cols: [
                                                    { value: "0", text: "既契約先" },
                                                    { value: "1", text: "未契約先" }
                                                ]
                                            },
                                        },

                                    ]
                                },
                            ]
                        }




                    ]
                },





                {
                    cols: [
                        {
                            type: "button",
                            name: "save",
                            text: "保存",
                            view: "flat",
                            color: "primary"
                        }
                    ]
                },
            ]
        });
        dhxWindow.attach(form);
        // =======================================================
        //  3. DATA LOADING （データ通信・サーバーとのやり取り）
        // =======================================================

        // CONNECT: DRFからデータの読み込み
        // 1. client一覧を取得してGridのプルダウンに反映 ---

        fetch("/api/get_current_client/")
            .then(res => res.json())
            .then(data => {
                currentClientId = data['current-client'].client_id;

                // 💡 フォームの初期化が終わっているので、安全に初期値をセットできる
                if (client_id && form) {
                    form.setValue({ client: String(client_id) });
                }

                // 💡 1つ目のデータが取れたので、2つ目のfetch（Grid用データ）を呼ぶ
                if (client_id && grid) {
                    fetch(`/customer/customers/${client_id}/`)
                        .then(response => response.json())
                        .then(data => { grid.data.parse(data); })
                        .catch(err => console.error("顧客データ取得失敗:", err));
                }
            })
            .catch(err => console.error("current clientデータ取得失敗:", err));

        // 4.1 main dataの取得



        // --- ページネーション ---
        const pagination = new dhx.Pagination(null, {
            css: "dhx_widget--bordered dhx_widget--no-border_top",
            data: grid.data,
            pageSize: 50
        });

        // 💡 修正した「pagination_cell」にPaginationをアタッチ
        layout.getCell("pagination_cell").attach(pagination);

        //Grid.data.pase(dataset); // 作成した DataCollection を直接紐付ける
        // =======================================================
        // 4. 【最下部】ユーザーが操作したときのイベント関数（addRowなど）
        // =======================================================
        toolbar.events.on("click", function (id) {
            if (id === "add") {
                addRow();
            }
        });
        // 6. --- イベントの処理 ---
        // 6.1 新規作成のウインドウを表示する
        function addRow() {
            if (form) {
                form.clear({}); // フォームをクリア

                // 💡 4. 保存しておいた変数をここで安全に使う！
                if (currentClientId) {
                    form.setValue({
                        client: String(currentClientId) // フォームの「name: "client"」にセット
                    });
                    console.log("Formにセットしました:", currentClientId);
                } else {
                    console.warn("まだclient_idのデータが届いていません。");
                }
            }
            dhxWindow.header.data.update("title", { value: "新規登録" });
            dhxWindow.setPosition(100, 50);
            dhxWindow.paint();
            dhxWindow.show();
        }
        // 6.2 グリッド内の「編集」ボタンクリック時
        grid.events.on("cellClick", (row, col) => {
            if (col.id === "action") {
                form.setValue(row); // 選択した行のデータをフォームにセット
                dhxWindow.header.data.update("title", { value: "編集" });
                dhxWindow.paint();
                dhxWindow.show();
            }
        });


        // 6.3. 保存ボタンの処理
        // UPDATE: 6.3. 保存ボタンの処理
        form.getItem("save").events.on("click", () => {

            // 6.3.1 バリデーションを実行
            if (!form.validate()) {
                const info = form.getInfo();
                const firstErrorId = Object.keys(info).find(itemId => info[itemId].error);
                if (firstErrorId) {
                    form.getItem(firstErrorId).setFocus();
                }
                return;
            }

            // 6.3.2. バリデーション成功後に値を取得
            const formData = form.getValue();
            console.log("送信データ:", formData);

            const isNew = !formData.id || formData.id === "";


            // 💡 6.3.3. 新規と更新で「URL」と「HTTPメソッド」を正しく切り替える
            const url = isNew ? `/client/clients/` : `/client/clients/${formData.id}/`;
            const method = isNew ? "POST" : "PUT"; // 新規時はPOST、更新時はPUT


            // 6.3.4. 通信開始
            fetch(url, {
                method: method,
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie('csrftoken')
                },
                body: JSON.stringify(formData)
            })

                .then(res => {
                    if (!res.ok) {
                        // DRFのバリデーションエラー(400)などをキャッチ
                        return res.json().then(err => { throw err; });
                    }
                    return res.json();
                })
                .then(result => {

                    // 💡 成功メッセージの表示
                    dhx.message({
                        text: isNew ? "追加されました" : "更新されました",
                        css: "dhx_widget--bg_success",
                        expire: 3000
                    });

                    dhxWindow.hide();

                    // 💡 グリッドの再読み込み（async/awaitでスッキリ並列・直列処理）
                    grid.data.removeAll();
                    return fetch("/client/clients/");
                })

                .then(res => res && res.json())
                .then(data => {
                    if (data) grid.data.parse(data);
                })
                .catch(err => {
                    console.error(err);
                    // Django(DRF)のエラーは {"field_name": ["error message"]} の形式で来ることが多いです
                    let msg = "エラーが発生しました";
                    if (typeof err === 'object') {
                        // 最初のエラー内容を抽出して表示
                        const firstKey = Object.keys(err)[0];
                        msg = Array.isArray(err[firstKey]) ? err[firstKey][0] : (err.detail || msg);
                    }
                    dhx.message({ text: msg, css: "dhx_widget--bg_danger" });
                });

        });


        // DELETE: 削除ボタンの即時実行
        grid.events.on("cellClick", (row, col) => {
            if (col.id === "delete") {
                if (confirm("選択した行を削除してもよろしいですか？")) {
                    // 6.4.1. サーバー側のデータを削除
                    fetch(`/client/clients/${row.id}/`, {
                        method: 'DELETE',
                        headers: {
                            'X-CSRFToken': getCookie('csrftoken') // DjangoのCSRF対策
                        }
                    })
                        .then(res => {
                            if (res.ok) {
                                // 6.4.2. サーバー削除成功後、フロントエンド(Grid)から削除
                                grid.data.remove(row.id);
                                dhx.message({
                                    text: "削除しました",
                                    css: "dhx_widget--bg_success",
                                    expire: 3000
                                });
                            } else {
                                dhx.message({
                                    text: "削除に失敗しました",
                                    css: "dhx_widget--bg_danger",
                                    expire: -1
                                });
                            }
                        })
                        .catch(err => {
                            //console.error(err);
                            dhx.message({
                                text: "システムエラーが発生しました", css: "dhx_widget--bg_danger"
                            });
                        });
                }
            }
        });
    </script>
</body>

{% endblock %}
