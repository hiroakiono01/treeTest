{% extends 'base.html' %}
{% block head %}
<title>得意先一覧表</title>
{% endblock %}


{% block contents %}

<body>

    <div id="layout-main-container" style="margin-top: 6rem; --layout-max-width: 1500px;">
        <script>

            // ===================================================
            //  1. VARIABLES （変数の宣言）
            // ===================================================
            let client_id = "";
            let grid = null;
            let form = null;
            let toolbar = null;
            let dataset = null;       // 【修正】Gridのデータ管理用（DataCollection）
            let pagination = null;    // 【修正】タイポを修正 (paginnation -> pagination)
            let dhxWindow = null;  // 【修正】モーダルウインドウ用変数を別途定義


            // layoutの準備
            const layout = new dhx.Layout("layout-main-container", MySharedLayoutConfig);
            layout.getCell("sidebar_container").hide();
            
            // 1〜30日、末日 の選択肢を自動生成する例
            const closeDateOptions = [
                { value: "", content: "" }
            ];
            for (let i = 1; i <= 28; i++) {
                closeDateOptions.push({ value: String(i), content: `${i}日` });
            }
            closeDateOptions.push({ value: "last", content: "末日" });

            // ===================================================
            // 2. INITIALIZE UI COMPONENTS （画面パーツの組み立て）
            // ===================================================

            // DATA: Grid用のデータコレクションを初期化
            // dataset = new dhx.DataCollection();

            // TOOLBAR: ツールバーの処理 ---
            toolbar = new dhx.Toolbar("toolbar_container", { css: "dhx_toolbar--bordered" });
            toolbar.data.add([
                { id: "add", type: "button", value: "新規追加", icon: "dxi dxi-plus", color: "primary", circle: true, },
            ]);
            toolbar.events.on("click", function (id) {
                if (id === "add") {
                    addRow();
                }
            });


            //  FORM: モーダルウインドウの準備 ---
            dhxWindow = new dhx.Window({
                width: 1000,
                height: 1000,
                title: "新規",
                modal: true,
                closable: true // 閉じられるように設定
            });

            // GRID: dhx.Gridの初期化
            grid = new dhx.Grid(null, {
                columns: [
                    { id: "id", header: [{ text: "ID" }], hidden: true },
                    { id: "client", width: 100, header: [{ text: "事業者番号", align: "center" }], align: "center", htmlEnable: true, hidden: true },
                    { id: "action", width: 80, header: [{ text: "修正", align: "center" }], align: "center", htmlEnable: true, template: () => "<button class='dxi dxi-pencil'>修正</button>" },
                    { id: "customer_no", width: 100, header: [{ text: "管理番号", align: "center" }, { content: "inputFilter" }], align: "center" },
                    { id: "customer_name", width: 300, header: [{ text: "得意先名称", align: "center" }, { content: "inputFilter" }], align: "left" },
                    { id: "customer_phone_no", width: 120, header: [{ text: "電話番号", align: "center" }], align: "center" },
                    { id: "customer_fax_no", width: 120, header: [{ text: "FAX", align: "center" }], align: "center" },
                    { id: "customer_person", width: 200, header: [{ text: "得意先担当者名", align: "center" }, { content: "inputFilter" }], align: "left" },
                    { id: "customer_personal_phone", width: 120, header: [{ text: "携帯番号", align: "center" }], align: "center" },
                    {
                        id: "group_cls",
                        editorType: "select",
                        header: [{ text: "グループ", align: "center" }, { content: "selectFilter" }],
                        required: true,
                        options: [
                            { id: "1", value: "官庁" },
                            { id: "2", value: "民間" }
                        ],
                        align: "center",
                        width: 100
                    },
                    {
                        id: "use_flg",
                        editorType: "select",
                        header: [{ text: "利用状況", align: "center" }, { content: "selectFilter" }],
                        required: true,
                        options: [
                            { id: "0", value: "利用中" },
                            { id: "9", value: "停止" }
                        ],
                        align: "center",
                        width: 100
                    },
                    {
                        id: "client_flg",
                        editorType: "select",
                        header: [{ text: "顧客区分", align: "center" }, { content: "selectFilter" }],
                        required: true,
                        options: [
                            { id: "0", value: "既契約先" },
                            { id: "1", value: "未契約先" }
                        ],
                        align: "center",
                        width: 100
                    },

                    { id: "delete", width: 80, header: [{ text: "削除", align: "center" }], align: "center", htmlEnable: true, template: () => "<button class='dxi dxi-delete'>削除</button>" }
                ],
                autoWidth: true,
                data: dataset // 修正された DataCollection を紐付け
            });


            // ★外部ファイルの共通関数を呼び出す（これだけでEnter移動が有効になります）
            enableGridEnterNavigation(grid);

            // 💡 修正した「grid_cell」にGridをアタッチ
            layout.getCell("grid_cell").attach(grid);



            // --- ページネーション ---
            pagination = new dhx.Pagination(null, {
                css: "dhx_widget--bordered dhx_widget--no-border_top",
                data: grid.data,
                pageSize: 50
            });

            // 💡 修正した「pagination_cell」にPaginationをアタッチ
            layout.getCell("pagination_cell").attach(pagination);

            // FORM: 3. --- フォームの準備 ---
            form = new dhx.Form(null, {
                css: "dhx_widget--bordered",
                rows: [
                    {
                        type: "input",
                        name: "id",
                        hidden: true
                        // 見えないが値は保持される
                    },
                    {
                        name: "client",
                        type: "input",
                        label: "事業者",
                        required: true,
                        hidden: true
                    },
                    {
                        cols: [
                            {
                                name: "customer_no",
                                type: "input",
                                label: "得意先管理番号",
                                required: true,
                                width: "20%"
                            },
                            {
                                type: "spacer",
                                width: 20 // 横に20pxの間隔を開ける
                            },
                            {
                                name: "customer_name",
                                type: "input",
                                label: "得意先名称",
                                required: true,
                            },
                        ]
                    },

                    {
                        cols: [
                            {
                                name: "customer_short_name",
                                type: "input",
                                label: "得意先略称",
                                required: false,
                            },
                            {
                                type: "spacer",
                                width: 20 // 横に20pxの間隔を開ける
                            },
                            {
                                name: "customer_kana",
                                type: "input",
                                label: "検索",
                                required: false,
                            },
                        ]

                    },

                    {
                        cols: [
                            {
                                name: "customer_zip_code",
                                type: "input",
                                label: "郵便番号",
                                required: false,
                                width: "20%"
                            }
                        ]

                    },
                    {
                        cols: [
                            {
                                name: "customer_address1",
                                type: "input",
                                label: "住所１",
                                required: false,
                            },
                            {
                                type: "spacer",
                                width: 20 // 横に20pxの間隔を開ける
                            },
                            {
                                name: "customer_address2",
                                type: "input",
                                label: "住所２",
                                required: false,
                            },
                        ]
                    },
                    {
                        cols: [
                            {
                                name: "customer_phone_no",
                                type: "input",
                                label: "電話番号",
                                required: false,

                            },
                            {
                                type: "spacer",
                                width: 20 // 横に20pxの間隔を開ける
                            },
                            {
                                name: "customer_fax_no",
                                type: "input",
                                label: "FAX",
                                required: false,
                            },
                        ]

                    },

                    {
                        cols: [
                            {
                                name: "customer_person",
                                type: "input",
                                label: "得意先担当者名",
                                required: false,
                            },
                            {
                                type: "spacer",
                                width: 20 // 横に20pxの間隔を開ける
                            },
                            {
                                name: "customer_personal_phone",
                                type: "input",
                                label: "携帯電話番号",
                                required: false,
                            },
                        ]
                    },
                    {

                        rows: [
                            {
                                alingn: "between",
                                cols: [
                                    {
                                        type: "fieldset",
                                        name: "personal",
                                        label: "入金情報",
                                        labelAlignment: "center",
                                        width: "68%",
                                        rows: [
                                            {
                                                cols: [
                                                    {
                                                        name: "payment_limit_date",
                                                        type: "select",
                                                        label: "請求書提出期限",
                                                        required: false,
                                                        options: closeDateOptions,
                                                        width: "20%"
                                                    },
                                                    {
                                                        type: "spacer",
                                                        width: 20 // 横に20pxの間隔を開ける
                                                    },
                                                    {
                                                        name: "payment_close_date",
                                                        type: "select",
                                                        label: "請求締め日",
                                                        required: false,
                                                        options: closeDateOptions,
                                                        width: "20%"
                                                    },
                                                    {
                                                        type: "spacer",
                                                        width: 20 // 横に20pxの間隔を開ける
                                                    },
                                                    {
                                                        name: "payment_sight",
                                                        type: "select",
                                                        label: "請求サイト",
                                                        required: false,
                                                        options: [
                                                            { value: "", content: "" },
                                                            { value: "0", content: "当月" },
                                                            { value: "1", content: "翌月" },
                                                            { value: "2", content: "翌々月" },
                                                        ],
                                                        width: "20%"
                                                    },
                                                    {
                                                        type: "spacer",
                                                        width: 20 // 横に20pxの間隔を開ける
                                                    },
                                                    {
                                                        name: "payment_payday",
                                                        type: "select",
                                                        label: "入金予定日",
                                                        required: false,
                                                        options: closeDateOptions,
                                                        width: "20%"
                                                    },
                                                ]
                                            },
                                            {
                                                cols: [
                                                    {
                                                        name: "customer_bank",
                                                        type: "input",
                                                        label: "銀行コード",
                                                        required: false,
                                                    },
                                                    {
                                                        type: "spacer",
                                                        width: 25 // 横に20pxの間隔を開ける
                                                    },
                                                    {
                                                        name: "customer_branch",
                                                        type: "input",
                                                        label: "支店コード",
                                                        required: false,
                                                    },
                                                    {
                                                        type: "spacer",
                                                        width: 25 // 横に20pxの間隔を開ける
                                                    },
                                                    {
                                                        name: "customer_deposit_cls",
                                                        type: "radioGroup",
                                                        label: "預金種目",
                                                        required: false,
                                                        labelPosition: "top",  // ラベルを左側に配置
                                                        labelWidth: "30px",    // ラベルの横幅を固定

                                                        options: {
                                                            cols: [
                                                                { value: "1", text: "普通" },
                                                                { value: "2", text: "当座" }
                                                            ],


                                                        },
                                                        //width: "40%"
                                                    },
                                                ]
                                            },
                                            {
                                                cols: [
                                                    {
                                                        name: "customer_bank_number",
                                                        type: "input",
                                                        label: "口座番号",
                                                        required: false,
                                                        width: "30%"
                                                    },
                                                    {
                                                        type: "spacer",
                                                        width: 20 // 横に20pxの間隔を開ける
                                                    },
                                                    {
                                                        name: "customer_bank_holder",
                                                        type: "input",
                                                        label: "名義人名",
                                                        required: false,
                                                    },
                                                ]
                                            },
                                        ]
                                    },
                                    {
                                        type: "spacer",
                                        width: "2%"
                                    },
                                    {
                                        type: "fieldset",
                                        name: "account2",
                                        label: "その他区分",
                                        labelAlignment: "center",
                                        width: "30%",
                                        rows: [
                                            {
                                                name: "group_cls",
                                                type: "radioGroup",
                                                label: "グループ",
                                                required: false,
                                                labelPosition: "top",  // ラベルを左側に配置
                                                labelWidth: "100px",    // ラベルの横幅を固定

                                                options: {
                                                    cols: [
                                                        { value: "1", text: "官庁" },
                                                        { value: "2", text: "民間" }
                                                    ],


                                                },
                                                //width: "40%"
                                            },
                                            {
                                                name: "use_flg",
                                                type: "radioGroup",
                                                label: "利用状況",
                                                required: false,
                                                labelPosition: "top",  // ラベルを左側に配置
                                                labelWidth: "100px",    // ラベルの横幅を固定
                                                css: "custom-radio-align",
                                                options: {
                                                    cols: [
                                                        { value: "0", text: "利用中" },
                                                        { value: "9", text: "停止" }
                                                    ]
                                                },
                                                //: "30%"
                                            },
                                            {
                                                name: "client_flg",
                                                type: "radioGroup",
                                                label: "顧客区分",
                                                required: false,
                                                labelPosition: "top",  // ラベルを左側に配置
                                                labelWidth: "100px",    // ラベルの横幅を固定
                                                css: "custom-radio-align",
                                                options: {
                                                    cols: [
                                                        { value: "0", text: "既契約先" },
                                                        { value: "1", text: "未契約先" }
                                                    ]
                                                },
                                                //width: "30%"
                                            },
                                        ]
                                    },
                                ]
                            }
                        ]
                    },
                    {
                        cols: [
                            {
                                type: "button",
                                name: "save",
                                text: "保存",
                                view: "flat",
                                color: "primary"
                            }
                        ]
                    },
                ]
            });
            // ★外部ファイルの共通関数を呼び出す（これだけでEnter移動が有効になります）
            enableFormEnterNavigation(form);
            dhxWindow.attach(form);
            // =======================================================
            //  3. DATA LOADING （データ通信・サーバーとのやり取り）
            // =======================================================

            // CONNECT: 3.1 DRFからデータの読み込み
            fetch("/api/get_current_client/")
                .then(res => res.json())
                .then(data => {
                    client_id = data['current-client'].client_id;
                    client_no = data['current-client'].client_no;
                    client_name = data['current-client'].client_name;

                    // 💡 今回追加した「ヘッダー」の要素に文字をセット
                    const headerNoElem = document.getElementById("header_client_no");
                    const headerNameElem = document.getElementById("header_client_name");
                    const headerReportTitleElem = document.getElementById("header_report_title");
                    if (headerNoElem) headerNoElem.textContent = client_no ? `[${client_no}]` : '';
                    if (headerNameElem) headerNameElem.textContent = client_name || '';
                    if (headerReportTitleElem) headerReportTitleElem.textContent = "得意先マスタ保守";


                    // 💡 フォームの初期化が終わっているので、安全に初期値をセットできる
                    if (client_id && form) {
                        form.setValue({ client: String(client_id) });
                    }

                    // 💡 1つ目のデータが取れたので、2つ目のfetch（Grid用データ）を呼ぶ
                    if (client_id && grid) {
                        fetch(`/customer/lists/${client_id}/`)
                            .then(response => response.json())
                            .then(data => { grid.data.parse(data); })
                            .catch(err => console.error("顧客データ取得失敗:", err));
                    }
                })
                .catch(err => console.error("current clientデータ取得失敗:", err));



            //Grid.data.pase(dataset); // 作成した DataCollection を直接紐付ける
            // =======================================================
            //  4. EVENTS （ボタン操作・関数）
            // =======================================================

            // 6. --- イベントの処理 ---
            // 6.1 新規作成のウインドウを表示する
            function addRow() {
                if (form) {
                    form.clear({}); // フォームをクリア

                    // 💡 4. 保存しておいた変数をここで安全に使う！
                    if (client_id) {
                        form.setValue({
                            client: String(client_id) // フォームの「name: "client"」にセット
                        });
                        console.log("Formにセットしました:", client_id);
                    } else {
                        console.warn("まだclient_idのデータが届いていません。");
                    }
                }
                dhxWindow.header.data.update("title", { value: "新規登録" });
                dhxWindow.setPosition(100, 50);
                dhxWindow.paint();
                dhxWindow.show();
            }
            // 6.2 グリッド内の「編集」ボタンクリック時
            grid.events.on("cellClick", (row, col) => {
                if (col.id === "action") {
                    form.setValue(row); // 選択した行のデータをフォームにセット
                    dhxWindow.header.data.update("title", { value: "編集" });
                    dhxWindow.paint();
                    dhxWindow.show();
                }
            });


            // 6.3. 保存ボタンの処理
            // UPDATE: 6.3. 保存ボタンの処理
            form.getItem("save").events.on("click", () => {

                // 6.3.1 バリデーションを実行
                if (!form.validate()) {
                    const info = form.getInfo();
                    const firstErrorId = Object.keys(info).find(itemId => info[itemId].error);
                    if (firstErrorId) {
                        form.getItem(firstErrorId).setFocus();
                    }
                    return;
                }

                // 6.3.2. バリデーション成功後に値を取得
                const formData = form.getValue();
                console.log("送信データ:", formData);

                const isNew = !formData.id || formData.id === "";


                // 💡 6.3.3. 新規と更新で「URL」と「HTTPメソッド」を正しく切り替える
                const url = isNew ? `/customer/lists/${client_id}/` : `/customer/detail/${formData.id}/`;
                const method = isNew ? "POST" : "PUT"; // 新規時はPOST、更新時はPUT


                // 6.3.4. 通信開始
                fetch(url, {
                    method: method,
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCookie('csrftoken')
                    },
                    body: JSON.stringify(formData)
                })

                    .then(res => {
                        if (!res.ok) {
                            // DRFのバリデーションエラー(400)などをキャッチ
                            return res.json().then(err => { throw err; });
                        }
                        return res.json();
                    })
                    .then(result => {

                        // 💡 成功メッセージの表示
                        dhx.message({
                            text: isNew ? "追加されました" : "更新されました",
                            css: "dhx_widget--bg_success",
                            expire: 3000
                        });

                        dhxWindow.hide();

                        // 💡 グリッドの再読み込み（async/awaitでスッキリ並列・直列処理）
                        grid.data.removeAll();
                        return fetch(`/customer/lists/${client_id}/`);
                    })

                    .then(res => res && res.json())
                    .then(data => {
                        if (data) grid.data.parse(data);
                    })
                    .catch(err => {
                        console.error(err);
                        // Django(DRF)のエラーは {"field_name": ["error message"]} の形式で来ることが多いです
                        let msg = "エラーが発生しました";
                        if (typeof err === 'object') {
                            // 最初のエラー内容を抽出して表示
                            const firstKey = Object.keys(err)[0];
                            msg = Array.isArray(err[firstKey]) ? err[firstKey][0] : (err.detail || msg);
                        }
                        dhx.message({ text: msg, css: "dhx_widget--bg_danger" });
                    });

            });


            // DELETE: 削除ボタンの即時実行
            grid.events.on("cellClick", (row, col) => {
                if (col.id === "delete") {
                    if (confirm("選択した行を削除してもよろしいですか？")) {
                        // 6.4.1. サーバー側のデータを削除
                        fetch(`/customer/detail/${row.id}/`, {
                            method: 'DELETE',
                            headers: {
                                'X-CSRFToken': getCookie('csrftoken') // DjangoのCSRF対策
                            }
                        })
                            .then(res => {
                                if (res.ok) {
                                    // 6.4.2. サーバー削除成功後、フロントエンド(Grid)から削除
                                    grid.data.remove(row.id);
                                    dhx.message({
                                        text: "削除しました",
                                        css: "dhx_widget--bg_success",
                                        expire: 3000
                                    });
                                } else {
                                    dhx.message({
                                        text: "削除に失敗しました",
                                        css: "dhx_widget--bg_danger",
                                        expire: -1
                                    });
                                }
                            })
                            .catch(err => {
                                //console.error(err);
                                dhx.message({
                                    text: "システムエラーが発生しました", css: "dhx_widget--bg_danger"
                                });
                            });
                    }
                }
            });

            // ===================================================
            // 5. START APPLICATION （実行）
            // ===================================================
            // loadInitialData();
        </script>

    </div>
</body>

{% endblock %}
